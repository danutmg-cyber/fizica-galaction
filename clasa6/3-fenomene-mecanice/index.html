<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fenomene mecanice | Clasa a VI-a | Fizica Galaction</title>
  <meta name="description" content="Capitolul 3 – Fenomene mecanice, clasa a VI-a, Fizica Galaction.">
  <style>
    :root {
      --bg: #0f172a;
      --header: #1e293b;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --blue: #2563eb;
      --green: #16a34a;
      --orange: #ea580c;
      --cyan: #06b6d4;
      --purple: #7c3aed;
      --slate: #334155;
      --white: #ffffff;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: var(--header);
      text-align: center;
      padding: clamp(28px, 5vw, 48px) 18px;
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(2.1rem, 5vw, 3.3rem);
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .topbar p {
      margin: 16px auto 0;
      max-width: 720px;
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      line-height: 1.5;
      color: var(--text);
      font-weight: 600;
    }

    main {
      flex: 1;
      width: min(100%, 1040px);
      margin: 0 auto;
      padding: clamp(34px, 6vw, 60px) 18px;
      text-align: center;
    }

    .intro h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      line-height: 1.15;
      font-weight: 900;
    }

    .motto {
      margin: 18px auto 34px;
      max-width: 820px;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      line-height: 1.5;
    }

    .buttons {
      width: min(100%, 760px);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .big-button {
      display: block;
      width: 100%;
      padding: clamp(22px, 4vw, 34px) 18px;
      border-radius: 18px;
      text-decoration: none;
      color: var(--white);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.16);
      transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .big-button:hover,
    .big-button:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.07);
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.42);
      outline: none;
    }

    .big-button:active {
      transform: translateY(0);
    }

    .big-button strong {
      display: block;
      font-size: clamp(1.55rem, 3.5vw, 2.25rem);
      line-height: 1.15;
      font-weight: 900;
    }

    .big-button span {
      display: block;
      margin-top: 7px;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      font-weight: 800;
      opacity: 0.95;
    }

    .blue { background: var(--blue); }
    .green { background: var(--green); }
    .orange { background: var(--orange); }
    .cyan { background: var(--cyan); color: #06202a; }
    .purple { background: var(--purple); }
    .slate { background: var(--slate); }

    .cyan strong,
    .cyan span {
      color: #06202a;
    }

    .footer {
      background: var(--header);
      color: var(--text);
      text-align: center;
      padding: 24px 16px;
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.6;
    }

    .footer a {
      color: #67e8f9;
      text-decoration: none;
      font-weight: 800;
    }

    @media (max-width: 560px) {
      main {
        padding-left: 14px;
        padding-right: 14px;
      }

      .buttons {
        gap: 14px;
      }

      .big-button {
        border-radius: 16px;
      }
    }
  </style>
</head>
<body data-page-type="chapter">
  <div id="header-container"></div>

  <main>
    <section class="intro" aria-label="Capitolul curent">
      <h1>Clasa a VI-a · Capitolul 3</h1>
      <p class="motto">Fenomene mecanice</p>
    </section>

    <nav class="buttons" aria-label="Resursele capitolului">
      <a class="big-button blue" href="./lectii/index.html">
        <strong>📘 Lecții</strong>
        <span>Învață pas cu pas</span>
      </a>

      <a class="big-button green" href="./fise-de-lucru/index.html">
        <strong>✍️ Fișe de lucru</strong>
        <span>Exersează mișcarea</span>
      </a>

      <a class="big-button orange" href="./recapitulare/index.html">
        <strong>🔁 Recapitulare</strong>
        <span>Reține ideile importante</span>
      </a>

      <a class="big-button purple" href="./test-final/index.html">
        <strong>✅ Test final</strong>
        <span>Verifică ce ai învățat</span>
      </a>

      <a class="big-button slate" href="../index.html">
        <strong>⬅ Înapoi</strong>
        <span>Clasa a VI-a</span>
      </a>
    </nav>
  </main>

  <div id="footer-container"></div>

  <script defer src="../../assets/js/config.js"></script>
  <script defer src="../../assets/js/theme-toggle.js"></script>
  <script defer src="../../assets/js/navigation.js"></script>
  <script defer src="../../assets/js/progress.js"></script>
  <script defer src="../../assets/js/load-header.js"></script>
  <script defer src="../../assets/js/load-footer.js"></script>
  <script defer src="../../assets/js/app.js"></script>
</body>
</html>
