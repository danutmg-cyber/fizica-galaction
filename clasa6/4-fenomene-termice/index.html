<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fenomene termice | Clasa a VI-a | Fizica Galaction</title>
  <meta name="description" content="Pagina capitolului Fenomene termice, clasa a VI-a, Fizica Galaction.">
  <style>
    :root {
      --bg: #0f172a;
      --card: #111c33;
      --card2: #1e293b;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --cyan: #22d3ee;
      --cyan2: #67e8f9;
      --green: #22c55e;
      --yellow: #facc15;
      --orange: #fb923c;
      --blue: #38bdf8;
      --border: rgba(148, 163, 184, 0.24);
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(34, 211, 238, 0.16), transparent 34%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.11), transparent 30%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .page {
      width: min(620px, 100%);
      min-height: min(760px, calc(100dvh - 36px));
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }

    .top {
      text-align: center;
      padding: 6px 4px 2px;
    }

    .brand {
      color: var(--cyan2);
      font-size: clamp(1.8rem, 7vw, 3rem);
      line-height: 1.04;
      margin: 0;
      font-weight: 900;
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 4vw, 1.3rem);
      font-weight: 700;
    }

    .motto {
      margin: 12px auto 0;
      color: #fef08a;
      font-size: clamp(0.98rem, 3.6vw, 1.1rem);
      line-height: 1.35;
      max-width: 520px;
      font-style: italic;
    }

    .panel {
      width: 100%;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: clamp(18px, 4vw, 26px);
      backdrop-filter: blur(10px);
    }

    .chapter-title {
      text-align: center;
      margin: 0 0 18px;
      color: var(--text);
      font-size: clamp(1.45rem, 6vw, 2.2rem);
      line-height: 1.12;
      font-weight: 900;
    }

    .buttons {
      display: grid;
      gap: 13px;
    }

    .big-btn {
      width: 100%;
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 18px;
      border-radius: 18px;
      border: 2px solid transparent;
      text-decoration: none;
      color: #052e16;
      background: var(--green);
      font-size: clamp(1.08rem, 4.6vw, 1.35rem);
      line-height: 1.15;
      font-weight: 900;
      box-shadow: 0 12px 24px rgba(34, 197, 94, 0.20);
      transition: transform 0.16s ease, filter 0.16s ease, box-shadow 0.16s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .big-btn:hover,
    .big-btn:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.04);
      box-shadow: 0 16px 30px rgba(34, 197, 94, 0.26);
      outline: none;
    }

    .big-btn.blue {
      background: var(--blue);
      color: #082f49;
      box-shadow: 0 12px 24px rgba(56, 189, 248, 0.18);
    }

    .big-btn.yellow {
      background: var(--yellow);
      color: #422006;
      box-shadow: 0 12px 24px rgba(250, 204, 21, 0.18);
    }

    .big-btn.orange {
      background: var(--orange);
      color: #431407;
      box-shadow: 0 12px 24px rgba(251, 146, 60, 0.18);
    }

    .big-btn.back {
      background: #e2e8f0;
      color: #0f172a;
      box-shadow: 0 12px 24px rgba(226, 232, 240, 0.14);
      min-height: 58px;
      font-size: clamp(1rem, 4vw, 1.18rem);
      margin-top: 4px;
    }

    .icon {
      font-size: 1.45em;
      line-height: 1;
    }

    .footer {
      text-align: center;
      color: #94a3b8;
      font-size: clamp(0.9rem, 3.5vw, 1rem);
      line-height: 1.45;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .footer strong {
      color: #e2e8f0;
    }

    @media (max-width: 390px) {
      body {
        padding: 12px;
      }

      .panel {
        border-radius: 22px;
        padding: 16px;
      }

      .big-btn {
        min-height: 62px;
        border-radius: 16px;
      }
    }
  </style>
</head>

<body data-page-type="chapter">

    </header>

    <section class="panel" aria-label="Resurse capitol">

      <nav class="buttons" aria-label="Navigare capitol">
        <a class="big-btn" href="./lectii/index.html">
          <span class="icon">📘</span>
          <span>Lecții</span>
        </a>

        <a class="big-btn blue" href="./fise-de-lucru/index.html">
          <span class="icon">📝</span>
          <span>Fișe de lucru</span>
        </a>

        <a class="big-btn yellow" href="./recapitulare/index.html">
          <span class="icon">🔁</span>
          <span>Recapitulare</span>
        </a>

        <a class="big-btn orange" href="./test-final/index.html">
          <span class="icon">✅</span>
          <span>Test final</span>
        </a>

        <a class="big-btn back" href="../index.html">
          <span class="icon">⬅️</span>
          <span>Înapoi la clasa a VI-a</span>
        </a>
      </nav>
    </section>

    <footer class="footer">
      <strong>Prof. Dănuț Andronie</strong><br>
      email: danutmg@gmail.com
    </footer>
  </main>

  <div id="footer-container"></div>

  <script defer src="../../assets/js/config.js"></script>
  <script defer src="../../assets/js/theme-toggle.js"></script>
  <script defer src="../../assets/js/navigation.js"></script>
  <script defer src="../../assets/js/progress.js"></script>
  <script defer src="../../assets/js/load-header.js"></script>
  <script defer src="../../assets/js/load-footer.js"></script>
  <script defer src="../../assets/js/app.js"></script>
</body>
</html>
