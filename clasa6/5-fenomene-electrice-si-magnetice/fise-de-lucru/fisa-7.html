    initWorksheet({
      data: FISA_DATA,
      containerId: "worksheetApp",

    });

    // ===== Comutator temă zi/noapte =====
    (function () {
      const STORAGE_KEY = "fizica-galaction-fisa-theme";
      const body = document.body;
      const switchBtn = document.getElementById("themeSwitch");
      const icon = document.getElementById("themeIcon");
      const label = document.getElementById("themeLabel");

      function apply(theme) {
        if (theme === "light") {
          body.setAttribute("data-theme", "light");
          icon.textContent = "☀️";
          label.textContent = "Mod zi";
        } else {
          body.removeAttribute("data-theme");
          icon.textContent = "🌙";
          label.textContent = "Mod noapte";
        }
      }

      apply(localStorage.getItem(STORAGE_KEY) || "dark");

      switchBtn.addEventListener("click", function () {
        const current = body.getAttribute("data-theme") === "light" ? "light" : "dark";
        const next = current === "light" ? "dark" : "light";
        localStorage.setItem(STORAGE_KEY, next);
        apply(next);
      });
    })();
