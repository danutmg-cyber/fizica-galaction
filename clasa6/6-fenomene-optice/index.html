<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fenomene optice | Clasa a VI-a | Fizica Galaction</title>
  <meta name="description" content="Fizica Galaction - Clasa a VI-a, Capitolul 6: Fenomene optice.">
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --card-2: #1e293b;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --cyan: #22d3ee;
      --blue: #38bdf8;
      --green: #22c55e;
      --yellow: #facc15;
      --orange: #fb923c;
      --pink: #f472b6;
      --line: rgba(148, 163, 184, 0.28);
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(34, 211, 238, 0.18), transparent 34rem),
        linear-gradient(180deg, #0f172a 0%, #111827 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .page {
      width: min(100%, 520px);
      min-height: calc(100dvh - 36px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }

    .card {
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: 0 20px 55px var(--shadow);
      padding: 22px;
      text-align: center;
    }

    .school {
      color: var(--cyan);
      font-size: clamp(1.2rem, 5vw, 1.7rem);
      font-weight: 900;
      letter-spacing: 0.02em;
      margin: 0 0 6px;
    }

    .subtitle {
      color: var(--muted);
      font-size: clamp(1rem, 4vw, 1.18rem);
      font-weight: 700;
      margin: 0;
    }

    .motto {
      margin: 14px 0 0;
      padding: 12px;
      border-left: 4px solid var(--cyan);
      border-radius: 14px;
      background: rgba(34, 211, 238, 0.08);
      color: #fef9c3;
      font-size: clamp(0.96rem, 3.8vw, 1.08rem);
      font-style: italic;
      line-height: 1.45;
    }

    .chapter {
      margin: 0;
      color: var(--blue);
      font-size: clamp(1.35rem, 6vw, 2rem);
      line-height: 1.18;
      font-weight: 950;
    }

    .small {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 4.4vw, 1.16rem);
      line-height: 1.45;
    }

    .buttons {
      display: grid;
      gap: 14px;
      margin-top: 2px;
    }

    .big-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 66px;
      padding: 16px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.16);
      text-decoration: none;
      color: #061019;
      background: var(--green);
      box-shadow: 0 12px 26px rgba(0,0,0,0.24);
      font-size: clamp(1.08rem, 4.8vw, 1.32rem);
      font-weight: 900;
      line-height: 1.2;
      transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
    }

    .big-btn:hover,
    .big-btn:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow: 0 16px 32px rgba(0,0,0,0.32);
      outline: 3px solid rgba(255,255,255,0.26);
      outline-offset: 2px;
    }

    .icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 14px;
      background: rgba(255,255,255,0.32);
      font-size: 1.35rem;
    }

    .btn-text {
      flex: 1;
      text-align: left;
    }

    .btn-lessons { background: #22c55e; }
    .btn-sheets { background: #38bdf8; color: #082f49; }
    .btn-recap { background: #facc15; color: #1f2937; }
    .btn-test { background: #fb923c; color: #1f2937; }
    .btn-back { background: #e2e8f0; color: #111827; }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .footer strong {
      color: var(--text);
    }

    @media (max-width: 420px) {
      body {
        padding: 12px;
      }

      .page {
        min-height: calc(100dvh - 24px);
        gap: 12px;
      }

      .card {
        padding: 18px;
        border-radius: 22px;
      }

      .big-btn {
        min-height: 62px;
        padding: 14px 15px;
        border-radius: 18px;
      }

      .icon {
        width: 38px;
        height: 38px;
        min-width: 38px;
        border-radius: 13px;
      }
    }
  </style>
</head>
<body data-page-type="chapter">

  <main class="page" aria-label="Fenomene optice - Clasa a VI-a">
    <section class="card">

    <nav class="buttons" aria-label="Resursele capitolului">

      </a>

      <a class="big-btn btn-sheets" href="./fise-de-lucru/index.html">

      </a>

      <a class="big-btn btn-recap" href="./recapitulare/index.html">

      </a>

      <a class="big-btn btn-test" href="./test-final/index.html">

      <a class="big-btn btn-back" href="../index.html">

      </a>
    </nav>

    <footer class="footer">
      <strong>Prof. Dănuț Andronie</strong><br>

    </footer>
  </main>

  <div id="footer-container"></div>

  <script defer src="../../assets/js/config.js"></script>
  <script defer src="../../assets/js/theme-toggle.js"></script>
  <script defer src="../../assets/js/navigation.js"></script>
  <script defer src="../../assets/js/progress.js"></script>
  <script defer src="../../assets/js/load-header.js"></script>
  <script defer src="../../assets/js/load-footer.js"></script>
  <script defer src="../../assets/js/app.js"></script>
</body>
</html>
