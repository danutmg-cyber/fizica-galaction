<!doctype html>
<html lang="ro">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descoperă nota 10 la mișcare și repaus</title>
<style>
body { background: #152237; color: #f2f7ff; font: 1rem/1.6 system-ui; margin: auto; max-width: 42rem; padding: 1.5rem; }
a { color: #a9dcff; }
section { background: #203652; padding: 1.2rem; border-radius: 1rem; }
button { display: block; margin: .5rem 0; padding: .65rem 1rem; font: inherit; text-align: left; border-radius: .6rem; border: 0; color: #142238; background: #e1efff; }
button:focus-visible { outline: 3px solid #ffd26a; outline-offset: 3px; }
</style>
<a href="../">Înapoi la jocuri</a>
<main>
<h1>Descoperă nota 10 la mișcare și repaus</h1>
<section aria-labelledby="mission">
<h2 id="mission">Misiunea 1 · Alege reperul</h2>
<div id="game"></div>
</section>
</main>
<script>
const questions = [
  ["Care dintre următoarele este un corp fizic?", ["Viteza", "O minge", "Traiectoria", "Durata"], 1, "Mingea este un obiect material."],
  ["Când putem reprezenta un tren printr-un punct?", ["Când îi măsurăm lungimea", "Când verificăm dacă încape pe pod", "Când numărăm vagoanele", "Când îi urmărim deplasarea între două orașe pe o hartă"], 3, "Dimensiunile trenului sunt neglijabile la scara deplasării dintre orașe."],
  ["Autobuzul se îndepărtează de stație. Care este reperul?", ["Stația", "Autobuzul", "Șoferul", "Distanța parcursă"], 0, "Poziția autobuzului este descrisă față de stație."],
  ["Cu ce precizăm unde se află mobilul și la ce moment?", ["Doar cu un ceas", "Doar cu unitatea de lungime", "Cu un reper, axe de coordonate și un ceas", "Doar cu lungimea traiectoriei"], 2, "Reperul și axele ne ajută să precizăm poziția, iar ceasul indică momentul."]
];
const game = document.querySelector("#game");
const key = "fizica-galaction:descopera-nota-10:misiunea-1";
let best = 0;
try { best = Number(localStorage.getItem(key)) || 0; } catch {}

function add(tag, content) {
  const element = document.createElement(tag);
  element.textContent = content;
  game.append(element);
  return element;
}

function action(label, handler) {
  const button = add("button", label);
  button.onclick = handler;
  return button;
}

function heading(label) {
  const element = add("h3", label);
  element.tabIndex = -1;
  element.focus();
}

function play(round, firstScore = null) {
  let position = 0;
  const mistakes = [];
  function showQuestion() {
    game.replaceChildren();
    const question = round[position];
    const [prompt, choices, correct, explanation] = question;
    add("p", (firstScore === null ? "Întrebare " : "Reluare ") + (position + 1) + " din " + round.length);
    heading(prompt);
    const buttons = choices.map((choice, index) => action(choice, () => {
      buttons.forEach(button => { button.disabled = true; });
      if (index !== correct) mistakes.push(question);
      feedback.textContent = (index === correct ? "Corect! " : "Răspuns corect: " + choices[correct] + ". ") + explanation;
      action("Continuă", () => {
        position += 1;
        if (position < round.length) showQuestion();
        else finish(firstScore ?? round.length - mistakes.length, mistakes);
      }).focus();
    }));
    const feedback = add("p", "");
    feedback.setAttribute("role", "status");
  }
  showQuestion();
}

function finish(score, mistakes) {
  const stars = mistakes.length === 0 ? 3 : score >= 3 ? 2 : 1;
  best = Math.max(best, stars);
  try { localStorage.setItem(key, String(best)); } catch {}
  game.replaceChildren();
  heading(stars === 3 ? "Misiune stăpânită!" : "Misiune parcursă");
  add("p", stars + " din 3 stele · Record: " + best + " din 3");
  add("p", score + " din 4 răspunsuri corecte din prima încercare.");
  if (mistakes.length) action("Reia întrebările greșite", () => play(mistakes, score));
  else action("Joacă din nou", () => play(questions));
}

add("p", "Câștigi trei stele când răspunzi corect la toate cele patru întrebări, inclusiv la reluare.");
if (best) add("p", "Recordul tău: " + best + " din 3 stele");
action("Începe misiunea", () => play(questions));
</script>
