<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jocuri interactive - Clasa a VI-a</title>

    <link rel="stylesheet" href="../../assets/css/style.css">

    <style>
        .jocuri-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        .jocuri-container h1 {
            margin-bottom: 30px;
        }

        .jocuri-butoane {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .joc-button {
            display: block;
            padding: 18px 20px;

            border-radius: 12px;

            background-color: #2563eb;
            color: white;

            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;

            transition:
                transform 0.2s ease,
                background-color 0.2s ease;
        }

        .joc-button:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }

        .back-button {
            margin-top: 30px;
            background-color: #475569;
        }

        .back-button:hover {
            background-color: #334155;
        }

        @media (max-width: 600px) {
            .jocuri-container {
                margin: 20px auto;
                padding: 16px;
            }

            .joc-button {
                padding: 16px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <div id="header-container"></div>

    <main class="jocuri-container">

        <h1>🎮 Jocuri interactive</h1>

        <div class="jocuri-butoane">

            <a
                class="joc-button"
                href="unitati-de-masura.html"
            >
                📏 Campionii Unităților de Măsură
            </a>

            <a
                class="joc-button"
                href="viteza-si-densitatea.html"
            >
                🚗 Campionii Vitezei și Densității
            </a>

        </div>

        <a
            class="joc-button back-button"
            href="../index.html"
        >
            ← Înapoi la Clasa a VI-a
        </a>

    </main>

    <div id="footer-container"></div>

    <script defer src="../../assets/js/config.js"></script>
    <script defer src="../../assets/js/theme-toggle.js"></script>
    <script defer src="../../assets/js/navigation.js"></script>
    <script defer src="../../assets/js/progress.js"></script>
    <script defer src="../../assets/js/load-header.js"></script>
    <script defer src="../../assets/js/load-footer.js"></script>
    <script defer src="../../assets/js/app.js"></script>

</body>
</html>
