<!doctype html>
<html lang="ro">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descoperă nota 10 la mișcare și repaus</title>
<style>
* { box-sizing: border-box; }
body {
  min-height: 100vh; margin: 0; padding: clamp(1rem, 5vw, 3rem);
  color: #f6f8ff; font: 1rem/1.55 system-ui, sans-serif;
  background: radial-gradient(ellipse at top right, #47387c, transparent 55%), #10152e;
}
main, nav { max-width: 53rem; margin: auto; }
nav { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
a { color: #b5f9eb; }
h1 { max-width: 17ch; margin: 0; font-size: clamp(2rem, 7vw, 4rem); line-height: 1.06; letter-spacing: -.045em; }
h1 span { color: #6ff1d4; }
.hero { position: relative; overflow: hidden; padding: clamp(1.25rem, 6vw, 3rem) 0; }
.hero p { color: #dcd5ff; margin: 0 0 .65rem; font-weight: 700; }
section { background: #20284b; border: 1px solid #66649b; padding: clamp(1rem, 4vw, 2rem); border-radius: 1.25rem; box-shadow: 0 10px 0 #0b1024; }
h2 { margin: 0 0 1rem; }
h3 { font-size: clamp(1.15rem, 4vw, 1.65rem); line-height: 1.3; }
button { min-height: 44px; padding: .65rem 1rem; font: inherit; font-weight: 700; border-radius: .75rem; border: 1px solid transparent; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid #ffdc83; outline-offset: 3px; }
.sound { color: #f6f8ff; background: #29264d; border-color: #867eb8; }
.action { display: block; margin-top: .85rem; color: #102225; background: #6ff1d4; }
.action:hover { background: #a3ffeb; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
.choice { display: flex; gap: .65rem; align-items: center; text-align: left; color: #fff; background: #303b64; border-color: #777eab; }
.choice span { background: #161e3e; color: #c4fcf1; border-radius: .45rem; padding: .2rem .55rem; }
.choice:hover:not(:disabled) { background: #47568d; }
.choice:disabled { cursor: default; }
.choice.correct { background: #155743; border-color: #6ff1d4; }
.choice.wrong { background: #713047; border-color: #ff9ab4; }
.feedback { padding: .7rem 1rem; background: #161e3e; border-radius: .65rem; }
.feedback:empty { padding: 0; margin: 0; }
.step { color: #dedcff; }
progress { display: block; width: 100%; height: .65rem; accent-color: #6ff1d4; }
.stars { color: #ffdc83; font-size: 2rem; letter-spacing: .15em; margin: .5rem 0; }
@media (max-width: 36rem) { .choices { grid-template-columns: 1fr; } }
</style>
<nav aria-label="Navigare joc">
<a href="./">← Înapoi la jocuri</a>
<button class="sound" id="sound" type="button" aria-pressed="false">Sunet oprit</button>
</nav>
<main>
<header class="hero">
<p>Fizică · Clasa a VI-a</p>
<h1>Descoperă <span>nota 10</span> la mișcare și repaus</h1>
</header>
<section aria-labelledby="mission">
<h2 id="mission">Misiunea 1 · Alege reperul</h2>
<div id="game"></div>
</section>
</main>
<script>
const questions = [
  ["Care dintre următoarele este un corp fizic?", ["Viteza", "O minge", "Traiectoria", "Durata"], 1, "Mingea este un obiect material."],
  ["Când putem reprezenta un tren printr-un punct?", ["Când îi măsurăm lungimea", "Când verificăm dacă încape pe pod", "Când numărăm vagoanele", "Când îi urmărim deplasarea între două orașe pe o hartă"], 3, "Dimensiunile trenului sunt neglijabile la scara deplasării dintre orașe."],
  ["Autobuzul se îndepărtează de stație. Care este reperul?", ["Stația", "Autobuzul", "Șoferul", "Distanța parcursă"], 0, "Poziția autobuzului este descrisă față de stație."],
  ["Cu ce precizăm unde se află mobilul și la ce moment?", ["Doar cu un ceas", "Doar cu unitatea de lungime", "Cu un reper, axe de coordonate și un ceas", "Doar cu lungimea traiectoriei"], 2, "Reperul și axele ne ajută să precizăm poziția, iar ceasul indică momentul."]
];
const game = document.querySelector("#game");
const key = "fizica-galaction:descopera-nota-10:misiunea-1";
const soundButton = document.querySelector("#sound");
const AudioEngine = window.AudioContext || window.webkitAudioContext;
let audio;
let soundEnabled = false;
const tunes = {
  correct: [523, 659, 784],
  wrong: [349, 262],
  win: [523, 659, 784, 1047]
};

function playSound(cue) {
  if (!soundEnabled || audio?.state !== "running") return;
  tunes[cue].forEach((frequency, index) => {
    const note = audio.createOscillator();
    const volume = audio.createGain();
    const start = audio.currentTime + index * .095;
    note.type = "sine";
    note.frequency.value = frequency;
    volume.gain.setValueAtTime(.001, start);
    volume.gain.exponentialRampToValueAtTime(.085, start + .025);
    volume.gain.exponentialRampToValueAtTime(.001, start + .15);
    note.connect(volume).connect(audio.destination);
    note.start(start);
    note.stop(start + .16);
  });
}

function updateSound(enabled) {
  soundEnabled = enabled;
  soundButton.textContent = enabled ? "Sunet pornit" : "Sunet oprit";
  soundButton.setAttribute("aria-pressed", String(enabled));
}

if (AudioEngine) {
  soundButton.onclick = async () => {
    updateSound(!soundEnabled);
    if (!soundEnabled) return;
    try {
      audio ??= new AudioEngine();
      await audio.resume();
      playSound("correct");
    } catch {
      updateSound(false);
    }
  };
} else {
  soundButton.hidden = true;
}
let best = 0;
try { best = Number(localStorage.getItem(key)) || 0; } catch {}

function add(tag, content, parent = game) {
  const element = document.createElement(tag);
  element.textContent = content;
  parent.append(element);
  return element;
}

function action(label, handler) {
  const button = add("button", label);
  button.className = "action";
  button.onclick = handler;
  return button;
}

function heading(label) {
  const element = add("h3", label);
  element.tabIndex = -1;
  element.focus();
}

function play(round, firstScore = null) {
  let position = 0;
  const mistakes = [];
  function showQuestion() {
    game.replaceChildren();
    const question = round[position];
    const [prompt, choices, correct, explanation] = question;
    add("p", (firstScore === null ? "Întrebare " : "Reluare ") + (position + 1) + " din " + round.length).className = "step";
    const progress = add("progress", "");
    progress.max = round.length;
    progress.value = position;
    progress.setAttribute("aria-label", "Întrebări parcurse");
    heading(prompt);
    const grid = add("div", "");
    grid.className = "choices";
    const buttons = choices.map((choice, index) => {
      const button = add("button", "", grid);
      button.className = "choice";
      add("span", "ABCD"[index], button).setAttribute("aria-hidden", "true");
      button.append(document.createTextNode(choice));
      button.onclick = () => {
        buttons.forEach(answer => { answer.disabled = true; });
        buttons[correct].classList.add("correct");
        progress.value = position + 1;
        if (index !== correct) {
          mistakes.push(question);
          button.classList.add("wrong");
        }
        playSound(index === correct ? "correct" : "wrong");
        feedback.textContent = (index === correct ? "Corect! " : "Răspuns corect: " + choices[correct] + ". ") + explanation;
        action("Continuă", () => {
          position += 1;
          if (position < round.length) showQuestion();
          else finish(firstScore ?? round.length - mistakes.length, mistakes);
        }).focus();
      };
      return button;
    });
    const feedback = add("p", "");
    feedback.className = "feedback";
    feedback.setAttribute("role", "status");
  }
  showQuestion();
}

function finish(score, mistakes) {
  const stars = mistakes.length === 0 ? 3 : score >= 3 ? 2 : 1;
  best = Math.max(best, stars);
  try { localStorage.setItem(key, String(best)); } catch {}
  game.replaceChildren();
  heading(stars === 3 ? "Misiune stăpânită!" : "Misiune parcursă");
  add("div", "★".repeat(stars) + "☆".repeat(3 - stars)).className = "stars";
  if (stars === 3) playSound("win");
  add("p", stars + " din 3 stele · Record: " + best + " din 3");
  add("p", score + " din 4 răspunsuri corecte din prima încercare.");
  if (mistakes.length) action("Reia întrebările greșite", () => play(mistakes, score));
  else action("Joacă din nou", () => play(questions));
}

add("p", "Câștigi trei stele când răspunzi corect la toate cele patru întrebări, inclusiv la reluare.");
if (best) add("p", "Recordul tău: " + best + " din 3 stele");
action("Începe misiunea", () => play(questions));
</script>
