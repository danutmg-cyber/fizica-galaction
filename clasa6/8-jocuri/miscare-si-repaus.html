<script>
const questions = [
  ["Care dintre următoarele este un corp fizic?", ["Viteza", "O minge", "Traiectoria", "Durata"], 1, "Mingea este un obiect material."],
  ["Când putem reprezenta un tren printr-un punct?", ["Când îi măsurăm lungimea", "Când verificăm dacă încape pe pod", "Când numărăm vagoanele", "Când îi urmărim deplasarea între două orașe pe o hartă"], 3, "Dimensiunile trenului sunt neglijabile la scara deplasării dintre orașe."],
  ["Autobuzul se îndepărtează de stație. Care este reperul?", ["Stația", "Autobuzul", "Șoferul", "Distanța parcursă"], 0, "Poziția autobuzului este descrisă față de stație."],
  ["Cu ce precizăm unde se află mobilul și la ce moment?", ["Doar cu un ceas", "Doar cu unitatea de lungime", "Cu un reper, axe de coordonate și un ceas", "Doar cu lungimea traiectoriei"], 2, "Reperul și axele ne ajută să precizăm poziția, iar ceasul indică momentul."]
];
const numberFormat = new Intl.NumberFormat("ro-RO", { maximumFractionDigits: 1 });
const dataSets = Array.from({ length: 30 }, (_, index) => ({
  tenths: 20 + index * 5,
  duration: 10 + (index % 6) * 10,
  start: 2 + index
}));

function numeric(build) {
  let previous = -1;
  return () => {
    const offset = previous < 0 ? 0 : 1;
    const index = (previous + 1 + Math.floor(Math.random() * (dataSets.length - offset))) % dataSets.length;
    previous = index;
    const [prompt, result, unit, explanation, alternatives = []] = build(dataSets[index]);
    const values = [result, ...alternatives, result + 1, result - 1, result + 2, result + 3];
    const choices = [...new Set(values.map(value => format(value, unit)))].slice(0, 4);
    return [prompt, choices, 0, explanation];
  };
}

function format(value, unit) {
  return numberFormat.format(value) + " " + unit;
}

function shuffle(items) {
  const copy = [...items];
  for (let index = copy.length - 1; index > 0; index -= 1) {
    const other = Math.floor(Math.random() * (index + 1));
    [copy[index], copy[other]] = [copy[other], copy[index]];
  }
  return copy;
}

const missions = [
  ["Alege reperul", questions],
  ["Urmărește traseul", [
    ["Când este un corp în mișcare față de un reper?", ["Când își schimbă poziția față de reper", "Când are masă mare", "Când reperul este vizibil", "Când poziția rămâne aceeași"], 0, "Mișcarea se stabilește urmărind poziția corpului față de reper."],
    ["Față de ce este în repaus un copil așezat într-un autobuz în mers?", ["Față de trotuar", "Față de scaunul său", "Față de stație", "Față de un copac de lângă drum"], 1, "Copilul își păstrează poziția față de scaun."],
    ["Față de ce este în mișcare copilul din autobuz?", ["Față de podeaua autobuzului", "Față de scaun", "Față de un stâlp de pe marginea drumului", "Față de pasagerul așezat lângă el"], 2, "Poziția copilului față de stâlp se schimbă odată cu deplasarea autobuzului."],
    ["Ce este traiectoria unui mobil?", ["Durata mișcării", "Lungimea totală a drumului", "Viteza la sosire", "Linia formată din pozițiile succesive"], 3, "Traiectoria descrie forma drumului urmat."],
    ["Ce traiectorie are un lift care urcă vertical față de sol?", ["Un segment vertical", "Un cerc", "O spirală", "Un segment orizontal"], 0, "Pozițiile liftului se află pe o dreaptă verticală."],
    ["Ce traiectorie are un copil aflat pe un carusel care se rotește complet?", ["Un segment", "Un cerc", "O spirală", "O elipsă"], 1, "Copilul rămâne la aceeași distanță de centrul caruselului."],
    ["Un copil scapă o minge într-un tren care merge drept cu viteză constantă. Ce vede copilul și ce vede cineva de pe peron?", ["Amândoi văd o dreaptă verticală", "Amândoi văd o dreaptă orizontală", "Copilul vede o dreaptă verticală, iar persoana de pe peron vede o curbă", "Copilul vede o curbă, iar persoana de pe peron vede o dreaptă verticală"], 2, "Față de peron, mingea păstrează și o mișcare orizontală în timp ce cade."]
  ]],
  ["Măsoară călătoria", [
    ["Ce măsoară distanța parcursă?", ["Lungimea drumului urmat", "Durata mișcării", "Viteza finală", "Întotdeauna distanța în linie dreaptă până la destinație"], 0, "Măsurăm întregul drum, inclusiv eventualele întoarceri."],
    ["Care sunt unitățile SI pentru distanță și durată?", ["km și h", "m și s", "m și min", "cm și s"], 1, "Distanța se exprimă în metri, iar durata în secunde."],
    numeric(({ start }) => [`Mergi ${start} m până la poartă și revii. Ce distanță parcurgi?`, 2 * start, "m", `Aduni drumul dus și drumul întors: ${start} + ${start} = ${2 * start} m.`]),
    numeric(({ start, duration }) => [`Cronometrul arată ${start} s la start și ${start + duration} s la sosire. Care este durata?`, duration, "s", `Scazi momentul inițial din cel final: ${start + duration} − ${start} = ${duration} s.`]),
    numeric(({ start }) => [`Câte secunde înseamnă 2 min și ${start} s?`, 120 + start, "s", `Două minute înseamnă 120 s, la care adaugi ${start} s.`])
  ]],
  ["Calculează viteza", [
    ["Cum calculezi viteza medie?", ["Durata ÷ distanța", "Distanța totală ÷ durata totală", "Distanța × durata", "Media vitezelor de la plecare și sosire"], 1, "Împarți lungimea întregului traseu la timpul total."],
    ["Care este unitatea SI pentru viteză?", ["m", "m/s²", "m/s", "s/m"], 2, "Viteza exprimă distanța parcursă pe unitatea de timp."],
    numeric(({ tenths, duration }) => {
      const distance = tenths * (duration / 10);
      return [`Parcurgi ${distance} m în ${duration} s. Care este viteza medie?`, tenths / 10, "m/s", `${distance} ÷ ${duration} = ${format(tenths / 10, "m/s")}.`];
    }),
    numeric(({ tenths }) => [`Transformă ${format(tenths * 36 / 100, "km/h")} în m/s.`, tenths / 10, "m/s", "Împarți valoarea în km/h la 3,6."]),
    numeric(({ tenths }) => [`Transformă ${format(tenths / 10, "m/s")} în km/h.`, tenths * 36 / 100, "km/h", "Înmulțești valoarea în m/s cu 3,6."]),
    numeric(({ tenths, duration }) => {
      const distance = tenths * (duration / 10 + 1);
      return [`Parcurgi ${distance} m în ${duration} s de pedalare și faci o pauză de 10 s pe traseu. Care este viteza medie?`, tenths / 10, "m/s", `Incluzi pauza: ${distance} ÷ ${duration + 10} = ${format(tenths / 10, "m/s")}.`];
    })
  ]],
  ["Citește graficul", [
    ["Cum se deplasează un mobil în mișcare rectilinie uniformă?", ["Pe cerc, cu viteză constantă", "Pe o dreaptă, cu viteză constantă", "Pe o dreaptă, cu viteză tot mai mare", "Pe orice traseu"], 1, "Rectilinie înseamnă în linie dreaptă, iar uniformă înseamnă cu viteză constantă."],
    numeric(({ tenths, duration }) => [`Un robot merge drept cu ${format(tenths / 10, "m/s")} timp de ${duration} s. Ce distanță parcurge?`, tenths * (duration / 10), "m", "La viteză constantă, distanța este viteza înmulțită cu durata."]),
    numeric(({ tenths, duration }) => [`Un robot parcurge ${tenths * (duration / 10)} m cu viteza constantă de ${format(tenths / 10, "m/s")}. Cât durează deplasarea?`, duration, "s", "Împarți distanța parcursă la viteză."]),
    ["Pe ce axă se află timpul într-un grafic poziție–timp?", ["Pe axa orizontală", "Pe axa verticală", "Pe ambele axe", "Pe axa poziției"], 0, "Timpul este variabila reprezentată orizontal."],
    ["Ce face mobilul când graficul poziție–timp este orizontal?", ["Accelerează", "Încetinește", "Stă pe loc", "Se întoarce"], 2, "Un segment orizontal arată că poziția rămâne constantă."],
    numeric(({ tenths, duration, start }) => {
      const end = start + tenths * (duration / 10);
      return [`În graficul poziție–timp, o dreaptă unește (0 s, ${start} m) cu (${duration} s, ${end} m). Care este viteza?`, tenths / 10, "m/s", `Împarți variația poziției la durată: (${end} − ${start}) ÷ ${duration}.`];
    }),
    ["Pe același grafic poziție–timp, care dintre două drepte ascendente indică o viteză mai mare?", ["Cea cu poziția inițială mai mare", "Cea mai apropiată de orizontală", "Ambele indică aceeași viteză", "Cea mai înclinată față de orizontală"], 3, "Pe grafic, într-un timp egal, dreapta mai înclinată urcă mai mult."]
  ]],
  ["Pornește și frânează", [
    ["Ce se întâmplă cu viteza unui trotinist care pornește din repaus și prinde viteză?", ["Crește de la zero", "Scade până la zero", "Rămâne zero", "Este constantă și diferită de zero"], 0, "Pornirea din repaus înseamnă că viteza inițială este zero."],
    ["Ce valoare are viteza unei biciclete la finalul frânării până la oprire?", ["0 m/s", "1 m/s", "Viteza inițială", "De două ori viteza inițială"], 0, "Un corp oprit are viteza zero."],
    ["Cum se calculează accelerația medie în mișcare rectilinie?", ["Distanța ÷ durata", "Viteza finală ÷ durata în toate situațiile", "(Viteza inițială − viteza finală) ÷ durata", "(Viteza finală − viteza inițială) ÷ durata"], 3, "Scazi viteza inițială din cea finală și împarți la intervalul de timp."],
    ["Care este unitatea SI pentru accelerație?", ["m/s", "s/m", "m/s²", "km/h"], 2, "Accelerația exprimă variația vitezei pe secundă."],
    numeric(({ tenths, start }) => {
      const seconds = 2 + start % 5;
      const speed = tenths * seconds / 10;
      return [`Un cărucior pornește din repaus și atinge ${format(speed, "m/s")} în ${seconds} s. Care este accelerația medie?`, tenths / 10, "m/s²", `Împarți variația vitezei, ${format(speed, "m/s")}, la ${seconds} s.`];
    }),
    numeric(({ tenths, start }) => {
      const seconds = 2 + start % 5;
      const speed = tenths * seconds / 10;
      return [`Un cărucior frânează de la ${format(speed, "m/s")} până la oprire în ${seconds} s. Sensul deplasării este pozitiv. Care este accelerația medie?`, -tenths / 10, "m/s²", `Variația vitezei este 0 − ${numberFormat.format(speed)} m/s. Împarți la ${seconds} s.`];
    }),
    ["Un tren merge drept cu viteză constantă. Care este accelerația medie?", ["0 m/s²", "1 m/s²", "Egală cu viteza", "Depinde doar de durată"], 0, "Viteza rămâne aceeași, deci variația ei este zero."]
  ]]
];
const practice = [
  [
    ["Un tren trece complet printr-un tunel. Pentru a calcula durata de la intrarea locomotivei până la ieșirea ultimului vagon, ce trebuie să cunoști, pe lângă viteză?", ["Lungimile trenului și tunelului", "Doar lungimea tunelului", "Doar lungimea trenului", "Numărul locurilor din tren"], 0, "Locomotiva trebuie să parcurgă lungimea tunelului plus lungimea trenului pentru ca și ultimul vagon să iasă."],
    ["Două biciclete merg alături, drept, cu aceeași viteză și în același sens. Cum este una față de cealaltă?", ["În mișcare accelerată", "În repaus", "În mișcare în sens opus", "Depinde de lungimea drumului"], 1, "Distanța și poziția relativă dintre biciclete rămân constante."],
    ["Ce informație lipsește din afirmația «Mingea se află la 3 m» ca să putem indica poziția pe o axă?", ["Masa mingii", "Durata deplasării", "Reperul și direcția față de acesta", "Unitatea vitezei"], 2, "Pentru poziție contează de unde măsurăm și în ce direcție."]
  ],
  [
    ["Un alergător trece de două ori prin același punct și este mereu în mișcare între treceri. Ce poți deduce?", ["A parcurs o distanță mai mare decât zero", "A stat pe loc tot timpul", "A avut neapărat viteză constantă", "A mers obligatoriu în linie dreaptă"], 0, "Revenirea la aceeași poziție nu anulează lungimea traseului."],
    ["O roată de bicicletă se rostogolește. Față de ce reper un punct de pe jantă descrie un cerc?", ["Față de sol", "Față de centrul roții", "Față de un copac", "Față de punctul de plecare de pe sol"], 1, "Punctul rămâne la distanță constantă de centrul roții."]
  ],
  [
    numeric(({ start }) => [`Câte secunde înseamnă ${start} min?`, start * 60, "s", "Un minut are 60 s. Înmulțești numărul de minute cu 60.", [start, start * 100, start * 3600]]),
    numeric(({ start }) => [`Câte secunde înseamnă ${numberFormat.format(start / 2)} h?`, start * 1800, "s", "O oră are 3 600 s. Înmulțești valoarea în ore cu 3 600.", [start * 30, start * 3600, start * 180]]),
    numeric(({ start }) => [`Câte secunde înseamnă 1 h și ${start} min?`, 3600 + start * 60, "s", "Transformi ora în 3 600 s și minutele în secunde, apoi aduni.", [3600 + start, 60 + start * 60, start * 60]]),
    numeric(({ start }) => [`Transformă 2 h, ${start} min și 15 s în secunde.`, 7215 + start * 60, "s", `2 × 3 600 + ${start} × 60 + 15 = ${7215 + start * 60} s.`, [7215 + start, 7200 + start * 60, 135 + start * 60]]),
    numeric(({ start }) => [`Transformă ${numberFormat.format(start / 10)} km în metri.`, start * 100, "m", "Un kilometru are 1 000 m. Înmulțești numărul de kilometri cu 1 000.", [start * 10, start * 1000, start]]),
    numeric(({ start }) => [`Traseul are 1 km și ${start * 10} m. Câți metri are în total?`, 1000 + start * 10, "m", "Transformi 1 km în 1 000 m și aduni segmentul exprimat deja în metri.", [100 + start * 10, start * 10, 1000 + start]]),
    numeric(({ start }) => [`Un elev pleacă la cronometrul de 1 min și ${start} s și sosește la 2 min și 35 s. Care este Δt?`, 95 - start, "s", `Momentele sunt ${60 + start} s și 155 s. Calculezi 155 − ${60 + start}.`, [155, 155 + 60 + start, 35 - start]]),
    numeric(({ start }) => [`Pe o axă, un mobil trece de la x₁ = ${start} m la x₂ = −4 m. Care este Δx = x₂ − x₁?`, -4 - start, "m", "Scazi poziția inițială din cea finală. Semnul minus indică sensul negativ.", [4 + start, start - 4, -4]])
  ],
  [
    numeric(({ start }) => [`Un autobuz circulă cu ${start * 18} km/h. Ce viteză are în m/s?`, start * 5, "m/s", "Împarți viteza în km/h la 3,6.", [start * 18, start * 18 * 3.6, start * 0.5]]),
    numeric(({ start }) => [`O trotinetă merge cu ${numberFormat.format(start * 1.8)} km/h. Ce viteză are în m/s?`, start / 2, "m/s", "Împarți la 3,6. Echivalent: înmulțești cu 5 și împarți la 18.", [start, start * 1.8, start * 5]]),
    numeric(({ start }) => [`Un biciclist parcurge ${numberFormat.format(start / 10)} km în 3 min și 20 s. Care este viteza medie în m/s?`, start / 2, "m/s", `Transformi distanța în ${start * 100} m și timpul în 200 s, apoi împarți.`, [start, start / 10, start * 5]]),
    numeric(({ start }) => [`Un mobil merge ${numberFormat.format(start / 10)} km în 1 min și 40 s. Care este viteza medie în m/s?`, start, "m/s", `Transformi distanța în ${start * 100} m și timpul în 100 s, apoi împarți.`, [start * 100, start * 10, start / 10]]),
    numeric(({ start }) => [`Un elev merge ${start * 30} m până la poartă în 20 s și revine în 40 s. Ce viteză medie are pe tot traseul?`, start, "m/s", `Distanța totală este ${start * 60} m, iar durata totală este 60 s.`, [0, start * 1.5, start / 2]])
  ],
  [
    numeric(({ start }) => [`Un mobil pleacă de la x₁ = −${start} m și ajunge la x₂ = 5 m. Cât este Δx?`, start + 5, "m", `Scăderea unei poziții negative devine adunare: 5 − (−${start}).`, [5 - start, -start - 5, -start]]),
    numeric(({ start }) => [`La t₁ = ${start} s, x₁ = 20 m. La t₂ = ${start + 10} s, x₂ = ${20 + start * 5} m. Care este viteza dacă mișcarea este rectilinie uniformă?`, start / 2, "m/s", `Δx = ${start * 5} m și Δt = 10 s. Împarți Δx la Δt.`, [start * 5, (20 + start * 5) / 10, start * 2]]),
    numeric(({ start }) => [`Un mobil pleacă de la x = 0 m, ajunge la x = ${start} m, apoi revine la x = 1 m. Ce distanță a parcurs?`, 2 * start - 1, "m", `Aduni cele două segmente: ${start} m la dus și ${start - 1} m la întoarcere.`, [1, start, start - 1]]),
    numeric(({ start }) => [`O mașină merge fără să se întoarcă de la borna de ${numberFormat.format(2 + start / 10)} km la borna de 2 km în 100 s. Care este viteza medie, exprimată în m/s?`, start, "m/s", `Δx = −${start * 100} m. Pe acest traseu direct, distanța este ${start * 100} m. Viteza medie ca distanță ÷ durată este pozitivă.`, [-start, start * 100, start / 10]])
  ],
  [
    numeric(({ start }) => [`O bicicletă trece de la 2 m/s la ${2 + start * 2} m/s în 4 s. Care este accelerația medie?`, start / 2, "m/s²", `Δv = ${2 + start * 2} − 2 m/s. Împarți Δv la 4 s.`, [(2 + start * 2) / 4, -start / 2, start * 2]]),
    numeric(({ start }) => [`Un cărucior are viteza ${start + 2} m/s la t₁ = 3 s și viteza 2 m/s la t₂ = 13 s. Care este accelerația medie, cu sensul mișcării ales pozitiv?`, -start / 10, "m/s²", `Δt = 13 − 3 = 10 s, iar Δv = 2 − ${start + 2} = −${start} m/s.`, [start / 10, -(start + 2) / 10, 0]]),
    numeric(({ start }) => [`Un mobil pornește din repaus și atinge ${numberFormat.format(start * 3.6)} km/h în 10 s. Calculează accelerația medie în m/s².`, start / 10, "m/s²", `Mai întâi transformi viteza: împarți la 3,6 și obții ${start} m/s. Apoi împarți la 10 s.`, [start, start * .36, start * 10]])
  ]
];

practice.forEach((items, index) => missions[index][1].push(...items));

const game = document.querySelector("#game");
const keyPrefix = "fizica-galaction:descopera-nota-10:misiunea-";
const missionHeading = document.querySelector("#mission");
const soundButton = document.querySelector("#sound");
const AudioEngine = window.AudioContext || window.webkitAudioContext;
let audio;
let soundEnabled = false;
const tunes = {
  correct: [523, 659, 784],
  wrong: [349, 262],
  win: [523, 659, 784, 1047]
};

function playSound(cue) {
  if (!soundEnabled || audio?.state !== "running") return;
  tunes[cue].forEach((frequency, index) => {
    const note = audio.createOscillator();
    const volume = audio.createGain();
    const start = audio.currentTime + index * .095;
    note.type = "sine";
    note.frequency.value = frequency;
    volume.gain.setValueAtTime(.001, start);
    volume.gain.exponentialRampToValueAtTime(.085, start + .025);
    volume.gain.exponentialRampToValueAtTime(.001, start + .15);
    note.connect(volume).connect(audio.destination);
    note.start(start);
    note.stop(start + .16);
  });
}

function updateSound(enabled) {
  soundEnabled = enabled;
  soundButton.textContent = enabled ? "Sunet pornit" : "Sunet oprit";
  soundButton.setAttribute("aria-pressed", String(enabled));
}

if (AudioEngine) {
  soundButton.onclick = async () => {
    updateSound(!soundEnabled);
    if (!soundEnabled) return;
    try {
      audio ??= new AudioEngine();
      await audio.resume();
      playSound("correct");
    } catch {
      updateSound(false);
    }
  };
} else {
  soundButton.hidden = true;
}
const records = Array.from({ length: missions.length + 1 }, (_, index) => {
  try {
    const stars = Number(localStorage.getItem(keyPrefix + (index + 1)));
    return [1, 2, 3].includes(stars) ? stars : 0;
  } catch { return 0; }
});
const ranks = [
  [0, "Explorator"],
  [4, "Detectiv al mișcării"],
  [8, "Pilot de precizie"],
  [12, "Expert în mișcare"],
  [18, "Maestru al mișcării"]
];
let activeMission = 0;
let currentRound = [];

function add(tag, content, parent = game) {
  const element = document.createElement(tag);
  element.textContent = content;
  parent.append(element);
  return element;
}

function action(label, handler) {
  const button = add("button", label);
  button.className = "action";
  button.onclick = handler;
  return button;
}

function heading(label) {
  const element = add("h3", label);
  element.tabIndex = -1;
  element.focus();
}

function showRank() {
  const missionStars = records.slice(0, missions.length).reduce((total, stars) => total + stars, 0);
  const champion = missionStars === 18 && records[missions.length] === 3;
  const next = ranks.find(([threshold]) => threshold > missionStars);
  const [, rank] = ranks.filter(([threshold]) => threshold <= missionStars).at(-1);
  const panel = add("div", "");
  panel.className = "rank";
  add("p", "Rangul tău · " + (champion ? "Campion de nota 10" : rank), panel);
  add("p", missionStars + "/18 stele în misiuni", panel);
  if (next) add("p", "Încă " + (next[0] - missionStars) + " ★ până la rangul „" + next[1] + "”.", panel);
  else if (!champion) add("p", "Câștigă trei stele în provocarea finală pentru rangul „Campion de nota 10”.", panel);
}

function play(round, firstScore = null) {
  let position = 0;
  const mistakes = [];
  function showQuestion() {
    game.replaceChildren();
    const question = round[position];
    const [prompt, choices, correct, explanation] = typeof question === "function" ? question() : question;
    const order = shuffle(choices.map((_, index) => index));
    add("p", (firstScore === null ? "Întrebare " : "Reluare ") + (position + 1) + " din " + round.length).className = "step";
    const progress = add("progress", "");
    progress.max = round.length;
    progress.value = position;
    progress.setAttribute("aria-label", "Întrebări parcurse");
    heading(prompt);
    const grid = add("div", "");
    grid.className = "choices";
    const buttons = order.map((index, positionInGrid) => {
      const button = add("button", "", grid);
      button.className = "choice";
      add("span", "ABCD"[positionInGrid], button).setAttribute("aria-hidden", "true");
      button.append(document.createTextNode(choices[index]));
      button.onclick = () => {
        buttons.forEach(answer => { answer.disabled = true; });
        buttons[order.indexOf(correct)].classList.add("correct");
        progress.value = position + 1;
        if (index !== correct) {
          mistakes.push(question);
          button.classList.add("wrong");
        }
        playSound(index === correct ? "correct" : "wrong");
        feedback.textContent = (index === correct ? "Corect! " : "Răspuns corect: " + choices[correct] + ". ") + explanation;
        action("Continuă", () => {
          position += 1;
          if (position < round.length) showQuestion();
          else finish(firstScore ?? round.length - mistakes.length, mistakes);
        }).focus();
      };
      return button;
    });
    const feedback = add("p", "");
    feedback.className = "feedback";
    feedback.setAttribute("role", "status");
  }
  showQuestion();
}

function finish(score, mistakes) {
  const stars = mistakes.length === 0 ? 3 : score / currentRound.length >= .75 ? 2 : 1;
  records[activeMission] = Math.max(records[activeMission], stars);
  try { localStorage.setItem(keyPrefix + (activeMission + 1), String(records[activeMission])); } catch {}
  game.replaceChildren();
  heading(stars === 3 ? "Misiune stăpânită!" : "Misiune parcursă");
  add("div", "★".repeat(stars) + "☆".repeat(3 - stars)).className = "stars";
  if (stars === 3) playSound("win");
  add("p", stars + " din 3 stele");
  add("p", score + " din " + currentRound.length + " răspunsuri corecte din prima încercare.");
  showRank();
  if (mistakes.length) action("Reia întrebările greșite", () => play(mistakes, score));
  action("Joacă din nou", () => startMission(activeMission));
  action("Alege altă misiune", showMissions);
  add("p", "Felicitări! Ești tot mai aproape de nota 10").className = "encouragement";
}

function startMission(index) {
  activeMission = index;
  if (index === missions.length) {
    missionHeading.textContent = "Provocarea de nota 10";
    currentRound = shuffle(missions.flatMap(([, items]) => shuffle(items).slice(0, 2)));
  } else {
    const [title, items] = missions[index];
    missionHeading.textContent = "Misiunea " + (index + 1) + " · " + title;
    const firstChallenge = items.length - practice[index].length;
    currentRound = [...shuffle(items.slice(0, firstChallenge)), ...items.slice(firstChallenge)];
  }
  play(currentRound);
}

function showMissions() {
  game.replaceChildren();
  missionHeading.textContent = "Alege o misiune";
  showRank();
  add("p", "Câștigi trei stele când rezolvi corect toate întrebările, inclusiv la reluare.");
  missions.forEach(([title], index) => {
    const stars = records[index];
    action((index + 1) + ". " + title + " · " + stars + "/3 stele", () => startMission(index));
  });
  if (records.slice(0, missions.length).every(stars => stars === 3)) {
    action("Provocarea de nota 10 · " + records[missions.length] + "/3 stele", () => startMission(missions.length));
  } else {
    add("p", "Provocarea de nota 10 se deblochează când ai câte trei stele la fiecare misiune.");
  }
}

showMissions();
</script>
