.inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}.inp{display:grid;gap:7px}label{font-weight:900;color:white}input[type=text]{width:100%;min-height:58px;border:2px solid var(--line);border-radius:16px;padding:14px;background:#050b15;color:#fff;outline:none;font-weight:750;font-size:clamp(1.05rem,3.5vw,1.2rem)}input::placeholder{color:#91a6c7}input:focus{border-color:#67e8f9;box-shadow:0 0 0 4px rgba(34,211,238,.2)}

.q-title{
  margin:0;
  font-size:clamp(1.2rem,4.8vw,1.65rem);
  line-height:1.12;
}
.problem.compact-problem{
  margin:4px 0 2px;
  font-size:clamp(1.18rem,5vw,1.55rem);
  line-height:1.28;
  color:#ffffff;
}
.known.compact-known{
  margin:2px 0;
  gap:6px;
}
.known.compact-known span{
  padding:5px 8px;
  font-size:.92rem;
}
.answer.compact-answer{
  margin-top:4px;
  padding:8px;
  border-radius:14px;
  grid-template-columns:minmax(0,1fr) 92px;
}
.answer.compact-answer input{
  min-height:50px;
  padding:10px;
  font-size:clamp(1.12rem,4.5vw,1.35rem);
}
.answer.compact-answer label{
  font-size:.95rem;
}
.answer.compact-answer .unit{
  min-height:50px;
  font-size:1.05rem;
}
.rules-line{
  color:#dbeafe;
  font-size:.9rem;
  margin:0;
}
.feedback:empty{display:none}
.feedback.compact-feedback{
  margin-top:8px;
  padding:9px 10px;
  min-height:auto;
}
.solution.compact-solution{
  margin-top:8px;
  padding:10px;
  font-size:.95rem;
}
.buttons.compact-buttons{
  gap:8px;
  margin-top:10px;
}
.buttons.compact-buttons .btn{
  min-height:50px;
  padding:10px 12px;
  border-radius:14px;
  font-size:1rem;
}

.admin-reset-panel{
  margin-top:14px;
  padding:12px;
  border-radius:16px;
  border:1px solid rgba(251,113,133,.65);
  background:rgba(251,113,133,.12);
}
.admin-reset-panel h3{
  margin:0 0 6px;
  color:#ffe4e6;
}
.admin-reset-panel p{
  margin:0 0 10px;
  color:#ffe4e6;
  font-size:.95rem;
}
.admin-reset-panel .btn{
  min-height:54px;
}

.online-board{
  margin-top:16px;
  display:grid;
  gap:8px;
}
.online-row{
  display:grid;
  grid-template-columns:54px 1fr 86px;
  gap:8px;
  align-items:center;
  background:#07111f;
  border:1px solid rgba(148,163,184,.35);
  border-radius:14px;
  padding:10px;
}
.online-row.me{
  border-color:rgba(34,197,94,.75);
  background:rgba(34,197,94,.14);
}
.online-rank{font-weight:1000;color:#fff0a8}
.online-score{text-align:right;font-weight:1000;color:#bbf7d0}
.online-name{font-weight:900;color:#f8fafc}
.online-meta{display:block;color:#cbd5e1;font-size:.86rem}
.online-status{
  margin-top:14px;
  padding:12px;
  border-radius:16px;
  border:1px solid rgba(34,211,238,.45);
  background:rgba(34,211,238,.10);
  color:#e0faff;
  font-weight:850;
}

@media(max-width:820px){
  .hero-home{grid-template-columns:1fr}
  .avatar-board{min-height:auto}
  .hero-stat-grid,.info-mini-grid{grid-template-columns:1fr}
  .top.compact{position:sticky}
  .top.compact .toprow{grid-template-columns:1fr}
  .top.compact .pill{justify-self:stretch}
  .answer.compact-answer{grid-template-columns:1fr}
}
@media(max-width:420px){
  .top.compact .tag{font-size:.78rem}
  .qhead{align-items:flex-start;flex-direction:column}
  .qhead .points{align-self:stretch;text-align:center}
}

<body>
<div class="app">
  <header class="top" id="top" style="display:none">
    <div class="toprow"><div><div class="title">Campionii Unităților de Măsură</div><p class="tag" id="sub">Antrenament</p></div><div class="pill" id="part">🏅 Participări: 0/4</div></div>
    <div class="stats"><div class="stat"><small>Jucător</small><strong id="sn">-</strong></div><div class="stat"><small>Scor</small><strong id="ss">0 p</strong></div><div class="stat"><small>Nivel</small><strong id="sl">MEDIU</strong></div><div class="stat"><small>Progres</small><strong id="sp">0%</strong></div></div>

<div class="toast" id="toast"></div><div class="confetti" id="confetti"></div>
<script>
(()=>{"use strict";
const COUNT=20,BASE=100,BONUS=25,LS="campionii_unitatilor_masura_progress_v1";
const ADMIN_MODE = new URLSearchParams(location.search).get("admin")==="1" || location.hash==="#admin";

/*
  CONECTARE LA GOOGLE SHEETS
  1. Publică fișierul Code_universal_clasamente_jocuri.gs ca Web App.
  2. Copiază URL-ul care se termină în /exec și pune-l mai jos.
  3. Parola de resetare profesor este în Code.gs, nu în HTML.
*/
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCSfxRaU_5wiu555kA347-BLp0GNbyHFmY4JBIUp2RXaAcZl5VDsT1hBpXwA9WDrI1FQ/exec";
const ONLINE_KEY = "FIZICA_GALACTION_TOATE_JOCURILE_2026";
const GAME_ID = "clasa6-unitati-de-masura";
const LS_PLAYER_ID = "campionii_unitatilor_masura_player_id_v1";
const TIERS={1:{label:"MEDIU",mult:1,icon:"🟢",desc:"Conversii directe, potrivite pentru antrenament de bază."},2:{label:"RIDICAT",mult:1.5,icon:"🟡",desc:"Conversii cu arie, volum, masă și timp. Punctaj ×1,5."},3:{label:"AVANSAT",mult:2,icon:"🔴",desc:"Conversii combinate și rezultate cu zecimale. Punctaj ×2."}};
const U={length:{name:"lungime",f:{mm:.001,cm:.01,dm:.1,m:1,km:1000}},mass:{name:"masă",f:{mg:.000001,g:.001,kg:1,q:100,t:1000}},time:{name:"timp",f:{s:1,min:60,h:3600}},area:{name:"arie",f:{"cm²":.0001,"dm²":.01,"m²":1}},volume:{name:"volum",f:{"cm³":.000001,mL:.000001,"dm³":.001,L:.001,"m³":1}}};
const BAD=["prost","proasta","idiot","idioata","bou","vaca","pula","pizda","muie","cur","cacat","rahat","jeg"];
let S={page:"home",tier:1,level:"MEDIU",mult:1,score:0,i:0,name:"",cls:"",school:"",loc:"",playerId:"",qs:[],ans:{},quick:{},quickDone:false,quickScore:0,finished:false,onlineStatus:"",onlineLeaders:[],onlineMonthly:[],onlineSent:false,lastSubmissionId:""};
const $=id=>document.getElementById(id),card=$("card"),top=$("top");
function rnd(){if(crypto?.getRandomValues){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}return Math.random()}
function ri(a,b){return Math.floor(rnd()*(b-a+1))+a}function pick(a){return a[ri(0,a.length-1)]}function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function one(n){return Math.round((Number(n)+Number.EPSILON)*10)/10}
function val(n){return Number.isInteger(Number(n))?String(n):String(one(n)).replace(".",",")}
function ro(n){n=Number(n);if(!isFinite(n))return"";let d=Number.isInteger(n)?0:Math.abs(n)<.01?6:Math.abs(n)<1?4:Math.abs(n)<100?3:1;return String(Number(n.toFixed(d))).replace(".",",")}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function parse(v){v=String(v||"").trim().replace(/[\s\u00A0]+/g,"").replace(/,/g,".").replace(/[−–—]/g,"-");let m=v.match(/[-+]?\d*\.?\d+(?:e[-+]?\d+)?/i);return m?Number(m[0]):NaN}
function dec(n){return (String(Number(n.toFixed(10))).split(".")[1]||"").length}function trunc1(n){return n>=0?Math.floor((n+Number.EPSILON)*10)/10:Math.ceil((n-Number.EPSILON)*10)/10}
function correct(v,a){if(!isFinite(v))return false;a=Number(a);if(Math.abs(v-a)<=Math.max(1e-8,Math.abs(a)*1e-7))return true;if(dec(a)>1){let r=Math.round((a+Number.EPSILON)*10)/10,t=trunc1(a);return Math.abs(v-r)<=.051||Math.abs(v-t)<=.051}return Math.abs(v-a)<=Math.max(.001,Math.abs(a)*.00001)}
function toast(m){$("toast").textContent=m;$("toast").classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").classList.remove("show"),2300)}
function conf(){let c=$("confetti");c.innerHTML="";["#22d3ee","#22c55e","#fbbf24","#fb7185","#fff"].forEach((col,k)=>{for(let i=0;i<14;i++){let s=document.createElement("span");s.style.left=rnd()*100+"%";s.style.background=col;s.style.animationDelay=rnd()*.35+"s";c.appendChild(s)}});setTimeout(()=>c.innerHTML="",1700)}
function prog(){try{return JSON.parse(localStorage.getItem(LS))||{participations:0,unlockedTier:1,bestScore:0,bestLevel:"MEDIU"}}catch(e){return{participations:0,unlockedTier:1,bestScore:0,bestLevel:"MEDIU"}}}
function save(p){try{localStorage.setItem(LS,JSON.stringify(p))}catch(e){}}
function isGoogleConfigured(){
  return /^https:\/\/script\.google\.com\/macros\/s\//.test(GOOGLE_SCRIPT_URL);
}
function getPlayerId(){
  try{
    let id=localStorage.getItem(LS_PLAYER_ID);
    if(id)return id;
    id="u-"+Date.now().toString(36)+"-"+Math.floor(rnd()*1e12).toString(36);
    localStorage.setItem(LS_PLAYER_ID,id);
    return id;
  }catch(e){
    return "u-"+Date.now().toString(36)+"-"+Math.floor(rnd()*1e12).toString(36);
  }
}
function submissionId(){
  return "sub-"+Date.now().toString(36)+"-"+Math.floor(rnd()*1e12).toString(36);
}
function weekKey(){
  let d=new Date(), day=d.getDay()||7;
  let th=new Date(d); th.setDate(d.getDate()+4-day);
  let y=new Date(th.getFullYear(),0,1);
  let w=Math.ceil((((th-y)/86400000)+1)/7);
  return th.getFullYear()+"-W"+String(w).padStart(2,"0");
}
function monthKey(){
  let d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function jsonp(params, timeout=8000){
  return new Promise((resolve,reject)=>{
    if(!isGoogleConfigured()){reject(new Error("Google Script URL nu este configurat."));return}
    const cb="unitati_cb_"+Date.now()+"_"+Math.floor(rnd()*1e9);
    const q=new URLSearchParams({...params, callback:cb});
    const script=document.createElement("script");
    let done=false;
    const timer=setTimeout(()=>{cleanup();reject(new Error("Timp expirat la conectarea cu Google Sheets."));},timeout);
    function cleanup(){
      if(done)return;
      done=true;
      clearTimeout(timer);
      try{delete window[cb]}catch(e){window[cb]=undefined}
      if(script.parentNode)script.parentNode.removeChild(script);
    }
    window[cb]=data=>{cleanup();resolve(data||{})};
    script.onerror=()=>{cleanup();reject(new Error("Nu s-a putut contacta Google Apps Script."))};
    script.src=GOOGLE_SCRIPT_URL+"?"+q.toString();
    document.body.appendChild(script);
  });
}
function leaderboardHtml(list){
  if(!Array.isArray(list)||!list.length)return `<div class="feedback">Nu există încă rezultate în clasamentul online pentru acest joc.</div>`;
  const myId=S.playerId||"";
  return `<div class="online-board">${list.slice(0,8).map(r=>{
    const me=myId && String(r.playerId||"")===myId;
    return `<div class="online-row ${me?"me":""}">
      <div class="online-rank">#${esc(r.loc||"-")}</div>
      <div>
        <span class="online-name">${esc(r.name||"Jucător")}${me?" (tu)":""}</span>
        <span class="online-meta">${esc(r.className||"")} • ${esc(r.schoolName||"")} • ${esc(r.locality||"")} • ${esc(r.gameLevel||"")}</span>
      </div>
      <div class="online-score">${esc(r.score||0)} p</div>
    </div>`;
  }).join("")}</div>`;
}
async function loadOnlineLeaderboard(){
  if(!isGoogleConfigured())return;
  try{
    const data=await jsonp({action:"leaderboard",gameId:GAME_ID,key:ONLINE_KEY});
    if(data&&data.ok){
      S.onlineLeaders=data.weekly||[];
      S.onlineMonthly=data.monthly||[];
      if(S.page==="final")render();
    }
  }catch(e){}
}
async function sendScoreToGoogle(){
  if(!isGoogleConfigured()){
    S.onlineStatus="Clasamentul online nu este activat încă. Completează GOOGLE_SCRIPT_URL în index.html.";
    return;
  }
  const correct=Object.values(S.ans).filter(x=>x.correct).length;
  const p=S.after||prog();
  if(!S.lastSubmissionId)S.lastSubmissionId=submissionId();
  const payload={
    action:"submit",
    key:ONLINE_KEY,
    gameId:GAME_ID,
    submissionId:S.lastSubmissionId,
    playerId:S.playerId||getPlayerId(),
    name:S.name,
    className:S.cls,
    schoolName:S.school,
    locality:S.loc,
    gameLevel:S.level,
    tier:S.tier,
    scoreMultiplier:S.mult,
    score:S.score,
    maxScore:COUNT*BASE*S.mult+QQ.length*BONUS*S.mult,
    correctAnswers:correct,
    localParticipations:p.participations||0,
    weekKey:weekKey(),
    monthKey:monthKey(),
    pageUrl:location.href,
    userAgent:navigator.userAgent
  };
  S.onlineStatus="Se trimite rezultatul către clasamentul online...";
  try{
    const data=await jsonp({action:"submit",key:ONLINE_KEY,gameId:GAME_ID,payload:JSON.stringify(payload)});
    if(data&&data.ok){
      S.onlineSent=true;
      S.onlineStatus=data.duplicate?"Rezultatul era deja înregistrat în Google Sheets.":"Rezultatul a fost înregistrat în Google Sheets.";
      S.onlineLeaders=data.weekly||[];
      S.onlineMonthly=data.monthly||[];
    }else{
      S.onlineStatus="Rezultatul nu a fost salvat: "+esc(data&&data.error?data.error:"eroare necunoscută");
    }
  }catch(e){
    S.onlineStatus="Nu s-a putut trimite rezultatul: "+esc(e.message||e);
  }
  if(S.page==="final")render();
}
async function resetLocalProgress(){
  if(!ADMIN_MODE)return;
  if(!isGoogleConfigured()){
    toast("Pentru resetare cu parolă trebuie configurat GOOGLE_SCRIPT_URL.");
    return;
  }

  const parola = prompt("Introduceți parola profesorului pentru resetarea jocului.");
  if(!parola){
    toast("Resetarea a fost anulată.");
    return;
  }

  const ok = prompt("Resetarea șterge rezultatele din Google Sheets și progresul local din acest browser. Pentru confirmare scrie RESET.");
  if(String(ok||"").trim().toUpperCase()!=="RESET"){
    toast("Resetarea a fost anulată.");
    return;
  }

  try{
    const data=await jsonp({action:"resetGame",gameId:GAME_ID,key:ONLINE_KEY,adminCode:parola,confirm:"RESET"});
    if(!data||!data.ok){
      toast(data&&data.error?data.error:"Resetarea nu a reușit.");
      return;
    }
    try{localStorage.removeItem(LS)}catch(e){}
    try{localStorage.removeItem(LS_PLAYER_ID)}catch(e){}
    S={page:"home",tier:1,level:"MEDIU",mult:1,score:0,i:0,name:"",cls:"",school:"",loc:"",playerId:"",qs:[],ans:{},quick:{},quickDone:false,quickScore:0,finished:false,onlineStatus:"",onlineLeaders:[],onlineMonthly:[],onlineSent:false,lastSubmissionId:""};
    setTier(1);
    toast("Jocul a fost resetat complet.");
    render();
  }catch(e){
    toast("Resetarea nu a reușit: "+(e.message||e));
  }
}
window.resetUnitatiMasuraProgress = resetLocalProgress;
document.addEventListener("click", function(event){
  const btn = event.target && event.target.closest ? event.target.closest("#resetProgress") : null;
  if(btn){
    event.preventDefault();
    resetLocalProgress();
  }
});

function bad(t){t=String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");return BAD.some(w=>t.includes(w))}
function conv(cat,v,from,to){return Number(v)*U[cat].f[from]/U[cat].f[to]}
function qconv(cat,from,to,vals){let v=pick(vals),a=conv(cat,v,from,to);return{title:"Conversie de "+U[cat].name,text:`Transformă ${val(v)} ${from} în ${to}.`,known:[`${val(v)} ${from}`,`? ${to}`],unit:to,answer:a,solution:`${val(v)} ${from} = ${ro(a)} ${to}.`}}
function qmix(cat,au,bu,tu,av,bv,op="+"){let a=pick(av),b=pick(bv),x=conv(cat,a,au,tu),y=conv(cat,b,bu,tu),r=op=="-"?x-y:x+y;return{title:"Conversie combinată",text:`${op=="-"?"Scade":"Calculează suma"}: ${val(a)} ${au} ${op} ${val(b)} ${bu}. Exprimă rezultatul în ${tu}.`,known:[`${val(a)} ${au}`,`${val(b)} ${bu}`,`în ${tu}`],unit:tu,answer:r,solution:`${val(a)} ${au} = ${ro(x)} ${tu}; ${val(b)} ${bu} = ${ro(y)} ${tu}; rezultatul este ${ro(r)} ${tu}.`}}
function med(){return[()=>qconv("length","m","cm",[.5,1,1.2,1.5,2,2.5,3,4,5,7.5]),()=>qconv("length","cm","m",[50,100,150,200,250,300,500,750]),()=>qconv("length","km","m",[.2,.5,1,1.5,2,2.5,3]),()=>qconv("length","m","mm",[.5,1,1.5,2,2.5,3,4]),()=>qconv("mass","kg","g",[.5,1,1.2,1.5,2,2.5,3,3.5]),()=>qconv("mass","g","kg",[500,1000,1200,1500,2000,2500,3000]),()=>qconv("time","min","s",[.5,1,1.5,2,2.5,3,4,5,10]),()=>qconv("time","h","min",[.5,1,1.5,2,2.5,3]),()=>qconv("volume","L","mL",[.5,1,1.2,1.5,2,2.5,3]),()=>qconv("volume","mL","L",[500,1000,1500,2000,2500,3000])]}
function high(){return[()=>qconv("length","dm","cm",[1,1.5,2,2.5,3,4,5,8]),()=>qconv("length","mm","cm",[10,20,50,100,150,250,500]),()=>qconv("length","dm","m",[5,10,15,20,25,30,50]),()=>qconv("mass","q","kg",[.5,1,1.5,2,2.5,3,5]),()=>qconv("mass","kg","q",[50,100,150,200,250,500]),()=>qconv("mass","t","kg",[.5,1,1.2,1.5,2,2.5]),()=>qconv("mass","kg","t",[500,1000,1500,2000,2500]),()=>qconv("time","h","s",[.5,1,1.5,2,2.5]),()=>qconv("time","s","min",[30,60,90,120,180,300,600]),()=>qconv("area","m²","dm²",[.5,1,1.5,2,2.5,3]),()=>qconv("area","dm²","cm²",[1,1.5,2,2.5,4,5,10]),()=>qconv("area","dm²","m²",[10,15,20,25,50,75,100]),()=>qconv("volume","m³","dm³",[.1,.2,.3,.5,1,1.5]),()=>qconv("volume","dm³","cm³",[.5,1,1.5,2,2.5,3]),()=>qconv("volume","cm³","mL",[10,50,100,250,500,750,1000])]}
function adv(){return[()=>qmix("length","m","cm","cm",[.5,1,1.2,1.5,2,2.5],[20,40,75,100,150],"+"),()=>qmix("length","km","m","m",[.2,.5,1,1.2,1.5],[50,150,200,500],"+"),()=>qmix("mass","kg","g","kg",[.5,1,1.2,1.5,2.5],[100,250,500,750],"+"),()=>qmix("mass","t","kg","kg",[.5,1,1.5,2],[100,200,500,750],"+"),()=>qmix("time","h","min","min",[.5,1,1.5,2,2.5],[15,30,45,90],"+"),()=>qmix("volume","L","mL","L",[.5,1,1.2,1.5,2],[100,250,500,750],"+"),()=>qconv("area","cm²","m²",[1000,1500,2000,2500,4000,7500,10000]),()=>qconv("area","m²","cm²",[.1,.2,.5,1,1.5,2]),()=>qconv("volume","cm³","L",[250,500,750,1000,1500,2500]),()=>qconv("volume","m³","L",[.1,.2,.3,.5,1,1.2]),()=>qconv("mass","g","q",[5000,10000,15000,25000,50000]),()=>qconv("mass","q","t",[.5,1,1.5,2,2.5,5,10]),()=>qmix("area","m²","dm²","dm²",[.5,1,1.5,2],[10,50,75,100],"+"),()=>qmix("volume","dm³","cm³","cm³",[.5,1,1.5,2.5],[100,500,750,1000],"+")]}
function makeSet(t){let pool=t==1?med():t==2?high():adv(),qs=[],seen=new Set(),safe=0;while(qs.length<COUNT&&safe++<300){let q=pick(pool)(),key=q.text+"|"+q.unit;if(!seen.has(key)){seen.add(key);qs.push(q)}}while(qs.length<COUNT)qs.push(pick(pool)());return sh(qs).map((q,i)=>({...q,id:i+1}))}
function setTier(t){let p=prog(),a=Math.min(Math.max(1,Number(t)||1),p.unlockedTier||1),info=TIERS[a];S.tier=a;S.level=info.label;S.mult=info.mult}
function pts(x){return Math.round(x*S.mult)}
function tierHtml(sel,unl){return`<div class="tiers">${[1,2,3].map(t=>{let i=TIERS[t],l=t>unl;return`<button class="tier ${t==sel?"sel":""} ${l?"lock":""}" data-t="${t}" ${l?"disabled":""}><strong>${i.icon} ${i.label}</strong><span>${i.desc}</span><span class="mini">${l?"Blocat: termină nivelul anterior":t==sel?"Selectat":"Disponibil"}</span></button>`}).join("")}</div>`}
function update(){
  let show=S.page!="home";
  top.style.display=show?"":"none";
  top.classList.toggle("compact", S.page==="question" || S.page==="quick");
  if(!show)return;
  let p=prog(),pct=S.page=="final"?100:S.page=="quick"?92:S.page=="question"?Math.round((S.i+1)/COUNT*90):0;
  if(S.page==="question"){
    $("sub").textContent=`Exercițiul ${S.i+1}/${COUNT} • ${S.level}`;
    $("part").textContent=`${S.score} p • ${pct}%`;
  }else if(S.page==="quick"){
    $("sub").textContent=`Bonus final • ${S.level}`;
    $("part").textContent=`${S.score} p • ${pct}%`;
  }else{
    $("sub").textContent=`${S.level} • 20 exerciții • diploma după 4 participări`;
    $("part").textContent=`🏅 Participări: ${p.participations||0}/4`;
  }
  $("sn").textContent=S.name||"-";
  $("ss").textContent=S.score+" p";
  $("sl").textContent=S.level;
  $("sp").textContent=pct+"%";
  $("bar").style.width=pct+"%";
}
function render(){update();({home,info,question,quick,final})[S.page]();scrollTo({top:0,behavior:"smooth"})}
function home(){
  let p=prog();
  if(S.tier>(p.unlockedTier||1))setTier(p.unlockedTier);
  card.innerHTML=`
    <div class="hero-home">
      <div>
        <div class="badge">🎮 Joc de fizică • clasa a VI-a</div>
        <h1>Campionii Unităților de Măsură</h1>
        <p class="tag">Exersezi transformări între unități de măsură, pe 3 trepte de dificultate, cu diplomă după 4 participări finalizate.</p>

        <div class="home-note">
          🎓 Diploma devine disponibilă după <strong>4 participări finalizate</strong>, salvate în browserul aceluiași telefon, tabletă sau calculator.
        </div>

        <details class="details-box">
          <summary>Informații importante despre diplomă și date</summary>
          <div class="details-content">
            <ul>
              <li>Participările sunt calculate local, în browserul acestui dispozitiv.</li>
              <li>Dacă schimbi dispozitivul sau ștergi datele browserului, jocul local nu mai vede participările anterioare.</li>
              <li>Numele și prenumele sunt folosite numai pentru completarea diplomei.</li>
              <li>Dacă nu dorești diplomă, poți folosi un nume fictiv, fără cuvinte obscene sau jignitoare.</li>
              <li>Jocul se poate reseta din când în când, iar progresul poate porni de la zero.</li>
            </ul>
          </div>
        </details>

        <h2>Alege nivelul</h2>
        ${tierHtml(S.tier,p.unlockedTier||1)}

        <div class="inputs">
          <div class="inp">
            <label for="n">Numele și prenumele / nume fictiv</label>
            <input id="n" type="text" maxlength="50" autocomplete="off" placeholder="Ex.: Andrei Popescu">
          </div>
          <div class="inp">
            <label for="c">Clasa</label>
            <input id="c" type="text" maxlength="12" autocomplete="off" placeholder="Ex.: 6A">
          </div>
          <div class="inp">
            <label for="sc">Școala</label>
            <input id="sc" type="text" maxlength="80" autocomplete="off" placeholder="Ex.: Școala Gimnazială ...">
          </div>
          <div class="inp">
            <label for="l">Localitatea</label>
            <input id="l" type="text" maxlength="60" autocomplete="off" placeholder="Ex.: Mangalia">
          </div>
        </div>

        <div class="buttons single">
          <button class="btn success" id="start">Începe antrenamentul</button>
        </div>

        ${ADMIN_MODE?`
        <div class="admin-reset-panel">
          <h3>🔐 Administrare profesor</h3>
          <p>Resetarea este protejată cu parola profesorului din Google Apps Script și șterge clasamentul online al acestui joc, apoi resetează și progresul local din browser.</p>
          <button type="button" class="btn danger" id="resetProgress">🔴 Resetează jocul și clasamentul</button>
        </div>`:""}
      </div>

      <div class="avatar-board" aria-hidden="true">
        <div class="big-icon">📏</div>
        <h2>20 de provocări</h2>
        <p class="tag">lungime • masă • timp • arie • volum • conversii</p>
        <p class="tag">Nivel selectat: <strong>${TIERS[S.tier].label}</strong> • punctaj ×${TIERS[S.tier].mult}</p>
        <div class="hero-stat-grid">
          <div class="hero-stat"><strong>${p.participations||0}/4</strong><span>participări</span></div>
          <div class="hero-stat"><strong>${p.bestScore||0}</strong><span>scor maxim</span></div>
          <div class="hero-stat"><strong>${esc(p.bestLevel||"MEDIU")}</strong><span>nivel maxim</span></div>
        </div>
      </div>
    </div>
  `;
  document.querySelectorAll(".tier").forEach(b=>b.onclick=()=>{setTier(b.dataset.t);render()});
  if(ADMIN_MODE && $("resetProgress")) $("resetProgress").onclick=resetLocalProgress;
  $("start").onclick=()=>{
    let txt=[$("n").value,$("c").value,$("sc").value,$("l").value].join(" ");
    if(bad(txt)){toast("Te rog să folosești un nume civilizat.");return}
    S.name=$("n").value.trim()||"Jucător";
    S.cls=$("c").value.trim()||"-";
    S.school=$("sc").value.trim()||"-";
    S.loc=$("l").value.trim()||"-";
    S.playerId=getPlayerId();
    S.score=0;S.i=0;S.ans={};S.quick={};S.quickDone=false;S.quickScore=0;S.finished=false;S.onlineStatus="";S.onlineSent=false;S.onlineLeaders=[];S.onlineMonthly=[];S.lastSubmissionId="";
    S.qs=makeSet(S.tier);
    S.page="info";
    render();
  };
  $("n").focus();
}
function info(){
  card.innerHTML=`
    <h1>📘 Start rapid</h1>
    <p class="problem">Nivel ales: <strong>${TIERS[S.tier].icon} ${S.level}</strong>. Ai 20 de exerciții. Fiecare problemă are o singură încercare.</p>
    <div class="info-mini-grid">
      <div class="box good">
        <h3>Ce exersezi?</h3>
        <p>Transformări între unități de lungime, masă, timp, arie și volum.</p>
      </div>
      <div class="box warn">
        <h3>Zecimale</h3>
        <p>Poți scrie cu virgulă sau punct. Dacă rezultatul are multe zecimale, este acceptată și varianta cu o zecimală, rotunjită sau nerotunjită.</p>
      </div>
      <div class="box">
        <h3>Încercări</h3>
        <p>Ai o singură încercare. La greșeală primești rezolvarea și 0 puncte.</p>
      </div>
      <div class="box">
        <h3>Punctaj</h3>
        <p>MEDIU ×1 • RIDICAT ×1,5 • AVANSAT ×2.</p>
      </div>
    </div>
    <div class="buttons">
      <button class="btn secondary" id="back">Înapoi</button>
      <button class="btn success" id="next">Mergi mai departe</button>
    </div>
  `;
  $("back").onclick=()=>{S.page="home";render()};
  $("next").onclick=()=>{S.page="question";render()};
}
function question(){
  let q=S.qs[S.i],st=S.ans[q.id]||{checked:false,value:""};
  card.innerHTML=`
    <div class="qcard">
      <div class="qhead">
        <strong>Exercițiul ${S.i+1}/${COUNT} • ${S.level}</strong>
        <span class="points">+${pts(BASE)} p</span>
      </div>

      <h2 class="q-title">${q.title}</h2>
      <p class="problem compact-problem">${q.text}</p>

      <div class="known compact-known">${q.known.map(k=>`<span>${esc(k)}</span>`).join("")}</div>

      <div class="answer compact-answer">
        <div>
          <label for="a">Răspuns numeric</label>
          <input id="a" type="text" inputmode="decimal" autocomplete="off" placeholder="Scrie răspunsul" value="${esc(st.value||"")}" ${st.checked?"disabled":""}>
        </div>
        <div class="unit">${q.unit}</div>
      </div>

      <p class="rules-line">Scrie doar numărul. Sunt acceptate zecimale cu virgulă sau punct: 2,5 / 2.5.</p>

      ${st.checked?`<div class="feedback compact-feedback ${st.correct?"ok":"no"}">${st.msg}</div>`:""}
      ${st.checked?`<div class="solution compact-solution"><strong>Rezolvare:</strong><br>${q.solution}${st.correct?"":"<br><br>Curaj! Data viitoare te vei descurca mai bine."}</div>`:""}

      <div class="buttons compact-buttons">
        <button class="btn secondary" id="back">Înapoi</button>
        <button class="btn primary" id="check" ${st.checked?"disabled":""}>Verifică</button>
        <button class="btn success" id="next" ${st.checked?"":"disabled"}>${S.i==COUNT-1?"Bonus":"Mai departe"}</button>
      </div>
    </div>
  `;
  $("back").onclick=()=>{if(S.i>0)S.i--;else S.page="info";render()};
  $("check").onclick=()=>{
    let raw=$("a").value,v=parse(raw);
    if(!isFinite(v)){toast("Scrie un număr pentru răspuns.");return}
    let ok=correct(v,q.answer),gain=ok?pts(BASE):0;
    if(ok){S.score+=gain;conf()}
    S.ans[q.id]={
      checked:true,
      correct:ok,
      value:raw,
      msg:ok?`Corect! Ai câștigat ${gain} puncte.`:`Răspuns greșit. Primești 0 puncte. Răspunsul corect este ${ro(q.answer)} ${q.unit}.`
    };
    render();
  };
  $("next").onclick=()=>{if(S.i<COUNT-1){S.i++;render()}else{S.page="quick";render()}};
  let a=$("a");if(a&&!st.checked){a.focus();a.onkeydown=e=>{if(e.key=="Enter")$("check").click()}}
}
const QQ=[["Unitatea SI pentru lungime este:",["metrul","kilometrul","centimetrul"],0],["Unitatea SI pentru masă este:",["gramul","kilogramul","tona"],1],["1 h are:",["60 s","600 s","3600 s"],2],["1 dm³ este egal cu:",["1 L","10 L","100 L"],0],["1 q este egal cu:",["10 kg","100 kg","1000 kg"],1]];
function quick(){card.innerHTML=`<h1>⚡ Verificare rapidă – bonus</h1><p class="problem">Răspunde la 5 întrebări scurte. Fiecare răspuns corect aduce ${pts(BONUS)} puncte.</p><div class="quick">${QQ.map((q,i)=>`<div class="box"><h3>${i+1}. ${q[0]}</h3><div class="variants">${q[1].map((op,j)=>`<label class="variant"><input type="radio" name="q${i}" value="${j}" ${S.quick[i]===j?"checked":""} ${S.quickDone?"disabled":""}><span><strong>${String.fromCharCode(65+j)}.</strong> ${op}</span></label>`).join("")}</div></div>`).join("")}</div><div class="feedback ${S.quickDone?"ok":""}">${S.quickDone?`Bonus finalizat: ${S.quickScore} puncte.`:"Alege câte o variantă la fiecare întrebare."}</div><div class="buttons"><button class="btn secondary" id="back">Înapoi</button><button class="btn primary" id="check" ${S.quickDone?"disabled":""}>Verifică bonusul</button><button class="btn success" id="fin" ${S.quickDone?"":"disabled"}>Vezi rezultatul</button></div>`;QQ.forEach((q,i)=>document.querySelectorAll(`input[name=q${i}]`).forEach(inp=>inp.onchange=()=>S.quick[i]=Number(inp.value)));$("back").onclick=()=>{S.page="question";S.i=COUNT-1;render()};$("check").onclick=()=>{if(Object.keys(S.quick).length<QQ.length){toast("Alege un răspuns la fiecare întrebare.");return}let c=0;QQ.forEach((q,i)=>{if(S.quick[i]===q[2])c++});S.quickScore=pts(c*BONUS);S.score+=S.quickScore;S.quickDone=true;if(c>=4)conf();render()};$("fin").onclick=()=>{if(!S.finished){S.finished=true;let p=prog(),bestLevel=["MEDIU","RIDICAT","AVANSAT"].indexOf(S.level)>=["MEDIU","RIDICAT","AVANSAT"].indexOf(p.bestLevel||"MEDIU")?S.level:p.bestLevel||"MEDIU";S.after={participations:(p.participations||0)+1,unlockedTier:Math.min(3,Math.max(p.unlockedTier||1,S.tier+1)),bestScore:Math.max(p.bestScore||0,S.score),bestLevel,lastPlayed:new Date().toISOString()};save(S.after)}S.page="final";render();sendScoreToGoogle()}}
function diploma(p){return(p.participations||0)>=4?`<div class="cert" id="diploma"><h2>FELICITĂRI!</h2><p>Se adeverește prin prezenta că</p><div class="name">${esc(S.name)}</div><p>de la școala <strong>${esc(S.school)}</strong>, din localitatea <strong>${esc(S.loc)}</strong>, a participat la competiția <strong>Campionii fizicii – etapa unitățile de măsură</strong>, nivelul <strong>${esc(S.level)}</strong>, și a finalizat cel puțin <strong>4 exersări</strong>.</p><p>Scorul obținut la această participare: <strong>${S.score} puncte</strong>.</p><div class="sig">Semnează: prof. Dănuț Andronie</div></div>`:""}
function final(){
  let p=S.after||prog(),cor=Object.values(S.ans).filter(x=>x.correct).length,need=Math.max(0,4-(p.participations||0)),next=S.tier<3&&(p.unlockedTier||1)>=S.tier+1;
  const onlineBox=isGoogleConfigured()?`
    <div class="online-status">${S.onlineStatus||"Clasamentul online este activ. Rezultatul se trimite la finalizarea jocului."}</div>
    <h2 style="margin-top:16px">🏆 Clasament online săptămânal</h2>
    ${leaderboardHtml(S.onlineLeaders)}
    <div class="buttons single"><button class="btn primary" id="resend">Retrimite / actualizează clasamentul</button></div>
  `:`<div class="online-status">Clasamentul online nu este activat încă. Completează GOOGLE_SCRIPT_URL în index.html după publicarea Apps Script.</div>`;
  card.innerHTML=`<h1>🏁 Rezultat final</h1><p class="problem">Ai finalizat nivelul ${S.level}.</p><div class="scoregrid"><div class="tile"><strong>${S.score}</strong><span>puncte</span></div><div class="tile"><strong>${cor}/${COUNT}</strong><span>exerciții corecte</span></div><div class="tile"><strong>${p.participations}/4</strong><span>participări pentru diplomă</span></div></div><div class="box ${p.participations>=4?"good":"warn"}"><h3>${p.participations>=4?"🎓 Diplomă disponibilă":"🎓 Încă puțin până la diplomă"}</h3><p>${p.participations>=4?"Ai cel puțin 4 participări salvate în browserul acestui dispozitiv. Diploma este afișată mai jos.":`Mai ai nevoie de ${need} participare/participări finalizate pe acest dispozitiv.`}</p></div>${diploma(p)}${onlineBox}<div class="buttons">${next?`<button class="btn warning" id="nt">Treci la nivelul următor</button>`:""}<button class="btn success" id="again">Joacă din nou</button><button class="btn secondary" id="exit">Ieșire</button>${p.participations>=4?`<button class="btn primary" id="print">Tipărește / salvează diploma</button>`:""}</div>`;
  if($("nt"))$("nt").onclick=()=>{setTier(S.tier+1);S.page="home";render()};
  $("again").onclick=()=>{S.page="home";render()};
  $("exit").onclick=()=>{location.href="../index.html"};
  if($("print"))$("print").onclick=()=>print();
  if($("resend"))$("resend").onclick=()=>sendScoreToGoogle();
}
setTier(1);render();loadOnlineLeaderboard();
})();
</script>
