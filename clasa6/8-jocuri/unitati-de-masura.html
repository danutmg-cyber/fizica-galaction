<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Test interactiv pentru exersarea unităților de măsură la clasa a VI-a."
    >

    <title>
        Campionii Unităților de Măsură
    </title>

    <!-- Stil general platformă -->
    <link
        rel="stylesheet"
        href="../../assets/css/style.css"
    >

    <!-- Stil comun pentru teste -->
    <link
        rel="stylesheet"
        href="../../assets/css/test-style.css"
    >
</head>

<body>

    <main>
        <div
            id="testApp"
            data-test-engine
        ></div>
    </main>

    <!-- 1. Profil elev + sesiune + progres -->
    <script
        src="../../assets/js/test-storage.js"
    ></script>

    <!-- 2. Conținutul testului -->
    <script
        src="../../assets/js/unitati-de-masura.js"
    ></script>

    <!-- 3. Motorul testului -->
    <script
        src="../../assets/js/test-engine.js"
    ></script>

    <!-- 4. Pornirea testului -->
    <script>
        if (
            typeof window.initTestEngine ===
            "function"
        ) {
            window.initTestEngine();
        } else {
            console.error(
                "test-engine.js nu a fost încărcat."
            );
        }
    </script>

</body>

</html>
