<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Test interactiv pentru exersarea transformărilor între unități de măsură la clasa a VI-a."
    >

    <title>
        Campionii Unităților de Măsură
    </title>

    <!-- Stilul general al platformei -->
    <link
        rel="stylesheet"
        href="../../assets/css/style.css"
    >

    <!-- Stilul comun tuturor testelor -->
    <link
        rel="stylesheet"
        href="../../assets/css/test-style.css"
    >

    <style>
        /*
         * Doar ajustări minime pentru această pagină.
         * Stilurile testului sunt în test-style.css.
         */

        body {
            min-height: 100vh;
        }

        .test-page {
            width: 100%;
            min-height: 100vh;
        }
    </style>
</head>


<body
    class="class-6"
    data-class="6"
>

    <main class="test-page">

        <!--
            Motorul testului va genera aici:
            - titlul;
            - indicațiile;
            - datele elevului;
            - nivelurile;
            - întrebările;
            - rezultatul.
        -->
        <div
            id="testApp"
            data-test-engine
        ></div>

    </main>


    <!-- =====================================================
         1. SALVAREA PROFILULUI ȘI A PROGRESULUI
    ====================================================== -->

    <script
        src="../../assets/js/test-storage.js"
    ></script>


    <!-- =====================================================
         2. CONȚINUTUL TESTULUI
    ====================================================== -->

    <script
        src="../../assets/js/unitati-de-masura.js"
    ></script>


    <!-- =====================================================
         CONFIGURAȚIE SIMPLIFICATĂ PENTRU ELEVI
    ====================================================== -->

    <script>
        /*
         * unitati-de-masura.js a creat deja window.TEST_DATA.
         *
         * Aici simplificăm textele afișate elevului,
         * fără să modificăm motorul general.
         */

        if (window.TEST_DATA) {

            /*
             * Descriere scurtă.
             */
            window.TEST_DATA.descriere =
                "Exersează transformările între unități de măsură.";


            /*
             * Câteva indicații simple la început.
             */
            window.TEST_DATA.instructiuni = [

                "Completează datele elevului; ele se păstrează în acest browser.",

                "Rezolvă cele 20 de exerciții și verifică fiecare răspuns.",

                "Nivelul următor se deblochează după finalizarea nivelului curent.",

                "La 100% treci automat la nivelul următor.",

                "Diploma se deblochează după ce finalizezi Nivelul 3."
            ];


            /*
             * Reducem informațiile suplimentare
             * afișate în zona întrebărilor.
             */
            window.TEST_DATA.config =
                window.TEST_DATA.config || {};


            /*
             * Nu este necesar să afișăm permanent
             * punctajul fiecărei întrebări.
             */
            window.TEST_DATA.config.showQuestionPoints =
                false;


            /*
             * Feedback imediat după verificare.
             */
            window.TEST_DATA.config.immediateFeedback =
                true;


            /*
             * Explicația rămâne disponibilă,
             * fiind utilă elevului când greșește.
             */
            window.TEST_DATA.config.showExplanations =
                true;


            /*
             * Elevul trebuie să răspundă
             * înainte de a continua.
             */
            window.TEST_DATA.config.requireAllAnswers =
                true;


            /*
             * Poate reveni la întrebarea precedentă.
             */
            window.TEST_DATA.config.allowBack =
                true;


            /*
             * Profilul elevului se păstrează
             * între niveluri.
             */
            window.TEST_DATA.config.persistStudentProfile =
                true;


            /*
             * Testul neterminat poate fi reluat.
             */
            window.TEST_DATA.config.saveProgress =
                true;

            window.TEST_DATA.config.restoreProgress =
                true;
        }
    </script>


    <!-- =====================================================
         3. MOTORUL COMUN AL TESTELOR
    ====================================================== -->

    <script
        src="../../assets/js/test-engine.js"
    ></script>


    <!-- =====================================================
         4. PORNIRE
    ====================================================== -->

    <script>
        document.addEventListener(
            "DOMContentLoaded",
            function () {

                if (
                    typeof window.initTestEngine ===
                    "function"
                ) {

                    window.initTestEngine();

                } else {

                    console.error(
                        "test-engine.js nu a fost încărcat corect."
                    );
                }
            }
        );
    </script>

</body>

</html>
