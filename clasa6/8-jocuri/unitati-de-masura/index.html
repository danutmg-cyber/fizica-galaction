<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campionii Unităților de Măsură</title>
<style>
:root{--bg:#07111f;--card:#142033;--card2:#0b1323;--text:#f8fafc;--muted:#dbeafe;--cyan:#22d3ee;--green:#22c55e;--yellow:#fbbf24;--red:#fb7185;--line:#6b83a8}
*{box-sizing:border-box}html{font-size:18px}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at top left,rgba(34,211,238,.18),transparent 34rem),linear-gradient(180deg,#07111f,#0f172a);color:var(--text);line-height:1.55}
button,input{font:inherit}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05}h2{font-size:clamp(1.45rem,4.5vw,2.1rem)}h3{font-size:clamp(1.15rem,3.5vw,1.45rem)}p,li,label{font-size:clamp(1rem,3.2vw,1.15rem)}.small{font-size:clamp(.92rem,2.8vw,1rem);color:#cbd5e1}
.app{width:min(100%,1040px);margin:auto;min-height:100vh;padding:14px;display:flex;flex-direction:column;gap:14px}.screen{flex:1;display:flex;align-items:center;justify-content:center}.card{width:100%;background:linear-gradient(180deg,rgba(20,32,51,.98),rgba(15,23,42,.98));border:1px solid rgba(148,163,184,.35);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.45);padding:clamp(18px,4vw,32px)}
.top{position:sticky;top:0;z-index:10;background:rgba(7,17,31,.94);border:1px solid rgba(148,163,184,.35);border-radius:0 0 22px 22px;padding:12px;box-shadow:0 14px 40px rgba(0,0,0,.28)}.toprow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.title{font-weight:950}.tag{color:var(--muted);margin:3px 0 0}.pill{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 12px;border-radius:999px;border:1px solid rgba(34,211,238,.65);background:rgba(34,211,238,.14);font-weight:900;text-align:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.stat{background:#07111f;border:1px solid rgba(148,163,184,.35);border-radius:16px;padding:10px}.stat small{display:block;color:#d8e8ff;font-size:.78rem}.stat strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:13px;border-radius:99px;background:#020617;overflow:hidden;border:1px solid rgba(148,163,184,.35);margin-top:12px}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green),var(--yellow));transition:.25s}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:20px}.badge{display:inline-flex;gap:8px;padding:9px 13px;border-radius:999px;color:#fff7cd;background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.52);font-weight:950}.quote{border-left:5px solid var(--cyan);background:rgba(34,211,238,.1);padding:12px 14px;border-radius:16px;font-weight:750}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}.box{background:var(--card2);border:1px solid rgba(148,163,184,.35);border-radius:18px;padding:14px}.good{background:rgba(34,197,94,.11);border-color:rgba(34,197,94,.55)}.warn{background:rgba(251,191,36,.11);border-color:rgba(251,191,36,.55)}.danger{background:rgba(251,113,133,.11);border-color:rgba(251,113,133,.55)}
.inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}.inp{display:grid;gap:7px}label{font-weight:900;color:white}input[type=text]{width:100%;min-height:58px;border:2px solid var(--line);border-radius:16px;padding:14px;background:#050b15;color:#fff;outline:none;font-weight:750;font-size:clamp(1.05rem,3.5vw,1.2rem)}input::placeholder{color:#91a6c7}input:focus{border-color:#67e8f9;box-shadow:0 0 0 4px rgba(34,211,238,.2)}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.buttons.single{grid-template-columns:1fr}.btn{min-height:62px;border:0;border-radius:18px;padding:15px 18px;cursor:pointer;font-weight:1000;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;color:#06101f;font-size:clamp(1.05rem,3.7vw,1.22rem);box-shadow:0 10px 24px rgba(0,0,0,.22)}.btn:disabled{opacity:.55;cursor:not-allowed}.primary{background:var(--cyan)}.success{background:var(--green)}.warning{background:var(--yellow)}.secondary{background:#31435f;color:white;border:1px solid var(--line)}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.tier{min-height:150px;border:2px solid rgba(148,163,184,.35);border-radius:20px;padding:16px;background:#0b1323;color:white;text-align:left;cursor:pointer}.tier strong{display:block;font-size:1.25rem}.tier span{display:block;color:#d8e8ff}.tier .mini{color:#fff0a8;font-weight:950;margin-top:9px}.tier.sel{border-color:#67e8f9;box-shadow:0 0 0 4px rgba(34,211,238,.16)}.tier.lock{opacity:.55;cursor:not-allowed}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border-radius:20px;background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(34,197,94,.11));border:1px solid rgba(34,211,238,.45);margin-bottom:16px}.num{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--cyan);color:#062033;font-weight:1000;font-size:1.35rem;flex:0 0 auto}.btitle{display:flex;gap:12px;align-items:center}.problem{font-weight:900;font-size:clamp(1.32rem,5vw,1.75rem);line-height:1.25}.known{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.known span{border-radius:999px;background:#091426;border:1px solid rgba(148,163,184,.38);color:#e0f2fe;font-weight:900;padding:8px 12px}
.answer{display:grid;grid-template-columns:1fr 115px;gap:10px;align-items:end;background:rgba(8,17,31,.72);border:1px solid rgba(148,163,184,.28);border-radius:18px;padding:12px;margin-top:12px}.answer input{text-align:center}.unit{min-height:58px;border-radius:16px;display:grid;place-items:center;background:#1e2a42;border:1px solid var(--line);color:#fff0a8;font-weight:1000}.feedback{margin-top:14px;border-radius:18px;border:1px solid rgba(148,163,184,.32);background:#08111f;padding:14px;min-height:56px;font-weight:800}.ok{background:rgba(34,197,94,.13);border-color:rgba(34,197,94,.58);color:#dcfce7}.no{background:rgba(251,113,133,.13);border-color:rgba(251,113,133,.58);color:#ffe4e6}.solution{margin-top:12px;background:rgba(34,211,238,.11);border:1px solid rgba(34,211,238,.45);border-radius:18px;padding:14px;color:#eefcff}
.quick{display:grid;gap:12px}.variants{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.variant{min-height:58px;display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:16px;background:#16243a;color:white;padding:12px;font-weight:850}.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{background:#0b1323;border:1px solid rgba(148,163,184,.35);border-radius:18px;padding:14px;text-align:center}.tile strong{display:block;color:#fff0a8;font-size:clamp(1.45rem,5vw,2.1rem)}
.cert{margin-top:18px;background:#fffaf0;color:#111827;border:4px solid #f59e0b;border-radius:24px;padding:clamp(18px,4vw,34px);text-align:center}.cert h2{color:#92400e;font-size:clamp(1.8rem,6vw,2.7rem)}.cert p{color:#111827}.cert .name{display:inline-block;border-bottom:3px solid #92400e;padding:4px 18px;margin:8px 0 12px;font-weight:1000;font-size:clamp(1.4rem,5vw,2.1rem)}.cert .sig{text-align:right;font-weight:950;margin-top:24px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(calc(100% - 28px),620px);z-index:100;display:none;background:#020617;border:1px solid rgba(34,211,238,.55);box-shadow:0 20px 50px rgba(0,0,0,.45);border-radius:18px;padding:14px;text-align:center;font-weight:900}.toast.show{display:block}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:120}.confetti span{position:absolute;top:-24px;width:10px;height:16px;opacity:.92;animation:fall 1.35s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(max-width:820px){html{font-size:17px}.hero,.grid,.inputs{grid-template-columns:1fr}.tiers{grid-template-columns:1fr}.buttons{grid-template-columns:1fr}.answer{grid-template-columns:1fr}.variants{grid-template-columns:1fr}.scoregrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.toprow{grid-template-columns:1fr}.app{padding:8px}.card{border-radius:20px}.pill{white-space:normal}.unit{min-height:50px}}
@media(max-width:420px){html{font-size:16px}.stats{grid-template-columns:1fr}.banner{flex-direction:column;align-items:flex-start}.btitle{align-items:flex-start}}
@media(print){body{background:white!important;color:black!important}.top,.buttons,.feedback,.grid,.scoregrid{display:none!important}.app{padding:0}.card{box-shadow:none;border:0;background:white}.cert{box-shadow:none;margin:0;min-height:90vh;display:flex;flex-direction:column;justify-content:center}}

/* ===== OPTIMIZARE VIZIBILITATE TELEFON / TABLETĂ ===== */
body{line-height:1.42}
.app{
  width:min(100%,980px);
  min-height:100svh;
  padding:8px;
  gap:8px;
}
.screen{
  flex:1;
  align-items:flex-start;
  justify-content:center;
  padding:4px 0 10px;
}
.card{
  border-radius:18px;
  padding:clamp(14px,3.2vw,24px);
  box-shadow:0 14px 38px rgba(0,0,0,.38);
}
h1{font-size:clamp(1.55rem,5vw,2.45rem);line-height:1.08;margin-bottom:8px}
h2{font-size:clamp(1.2rem,4vw,1.7rem);margin-bottom:8px}
h3{font-size:clamp(1rem,3.4vw,1.22rem);margin-bottom:6px}
p,li,label{font-size:clamp(1rem,3vw,1.12rem)}
.small{font-size:clamp(.9rem,2.6vw,1rem)}
.top{
  padding:8px;
  border-radius:0 0 14px 14px;
}
.toprow{gap:8px}
.title{font-size:clamp(.95rem,3vw,1.08rem)}
.tag{font-size:.92rem;line-height:1.25}
.pill{min-height:34px;padding:6px 10px;font-size:.9rem}
.stats{gap:6px;margin-top:7px}
.stat{padding:6px;border-radius:12px}
.stat small{font-size:.68rem}
.stat strong{font-size:.86rem}
.bar{height:8px;margin-top:7px}
.badge{padding:6px 10px;font-size:.9rem;margin-bottom:6px}
.hero{grid-template-columns:1fr;gap:12px}
.compact-home{display:grid;gap:12px}
.home-head{
  display:grid;
  grid-template-columns:1.35fr .65fr;

}
.mini-progress{
  background:#08111f;

}
.mini-progress .big{
  color:#fff0a8;

  line-height:1;
}
.mini-progress span{color:#dbeafe;font-weight:800}
.notice{
  border-radius:16px;
  border:1px solid rgba(251,191,36,.55);
  background:rgba(251,191,36,.11);
  padding:10px 12px;
}
.notice strong{display:block;color:#fff0a8;margin-bottom:2px}
.details-box{
  background:#08111f;
  border:1px solid rgba(148,163,184,.35);
  border-radius:16px;
  padding:0;
  overflow:hidden;
}
.details-box summary{
  cursor:pointer;
  padding:12px 14px;
  color:#e0f2fe;
  font-weight:1000;
  list-style:none;
}
.details-box summary::-webkit-details-marker{display:none}
.details-box summary:after{content:" +";color:#67e8f9}
.details-box[open] summary:after{content:" −"}
.details-content{
  border-top:1px solid rgba(148,163,184,.25);
  padding:12px 14px;
  color:#f8fafc;
}
.details-content ul{margin:0;padding-left:1.15rem}
.details-content li{margin:6px 0}
.grid{gap:10px;margin:10px 0}
.box{border-radius:15px;padding:11px}
.inputs{gap:10px;margin:12px 0}
input[type=text]{min-height:52px;border-radius:14px;padding:12px;font-size:1.05rem}
.tiers{gap:9px;margin:10px 0}
.tier{
  min-height:auto;
  padding:11px;
  border-radius:16px;
}
.tier strong{font-size:1.08rem}
.tier span{font-size:.92rem;line-height:1.3}
.tier .mini{margin-top:5px}
.buttons{
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:9px;
  margin-top:12px;
}
.btn{
  min-height:52px;
  border-radius:15px;
  padding:12px 14px;
  font-size:clamp(1rem,3.3vw,1.12rem);
}
.banner{
  padding:10px;
  border-radius:16px;
  margin-bottom:10px;
}
.btitle{gap:9px}
.num{
  width:40px!important;
  height:40px!important;
  min-width:40px!important;
  border-radius:12px!important;
}
.problem{
  font-size:clamp(1.15rem,4.4vw,1.55rem);
  line-height:1.28;
  margin-bottom:8px;
}
.known{gap:6px;margin:8px 0}
.known span{padding:6px 9px;font-size:.95rem}
.answer{
  grid-template-columns:minmax(0,1fr) 96px;
  padding:9px;
  gap:8px;
  border-radius:15px;
  margin-top:9px;
}
.unit{min-height:52px;border-radius:14px}
.feedback,.solution{border-radius:15px;padding:11px;margin-top:10px}
.quick{gap:9px}
.variant{min-height:50px;border-radius:14px;padding:10px}
.scoregrid{gap:9px}
.tile{border-radius:15px;padding:11px}

@media(max-width:820px){
  .top{position:relative}
  .home-head{grid-template-columns:1fr}
  .mini-progress{
    grid-template-columns:repeat(3,1fr);
    text-align:center;
    gap:8px;
  }
  .mini-progress .big{font-size:1.55rem}

  .tier{display:grid;gap:2px}

@media(max-width:520px){
  html{font-size:16.5px}
  .app{padding:6px}
  .card{padding:12px;border-radius:16px}
  .top{padding:6px}
  .toprow{grid-template-columns:1fr}
  .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{display:none}
  .pill{min-height:30px;font-size:.82rem}
  .stats{
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:4px;
    margin-top:5px;
  }
  .stat{padding:4px 3px;border-radius:9px;text-align:center}
  .stat small{font-size:.56rem}
  .stat strong{font-size:.7rem}
  .bar{height:6px;margin-top:5px}
  .mini-progress{grid-template-columns:1fr 1fr 1fr;padding:8px}
  .mini-progress span{font-size:.78rem}
  .problem{font-size:1.16rem}
  .answer{grid-template-columns:1fr}
  .unit{min-height:42px}
  .buttons{grid-template-columns:1fr}
  .btn{min-height:50px}
}

</style>

<body>
<div class="app">
  <header class="top" id="top" style="display:none">
    <div class="toprow"><div><div class="title">Campionii Unităților de Măsură</div><p class="tag" id="sub">Antrenament</p></div><div class="pill" id="part">🏅 Participări: 0/4</div></div>
    <div class="stats"><div class="stat"><small>Jucător</small><strong id="sn">-</strong></div><div class="stat"><small>Scor</small><strong id="ss">0 p</strong></div><div class="stat"><small>Nivel</small><strong id="sl">MEDIU</strong></div><div class="stat"><small>Progres</small><strong id="sp">0%</strong></div></div>
    <div class="bar"><span id="bar"></span></div>
  </header>
  <main class="screen"><section class="card" id="card"></section></main>
</div>
<div class="toast" id="toast"></div><div class="confetti" id="confetti"></div>
<script>
(()=>{"use strict";
const COUNT=20,BASE=100,BONUS=25,LS="campionii_unitatilor_masura_progress_v1";
const TIERS={1:{label:"MEDIU",mult:1,icon:"🟢",desc:"Conversii directe, potrivite pentru antrenament de bază."},2:{label:"RIDICAT",mult:1.5,icon:"🟡",desc:"Conversii cu arie, volum, masă și timp. Punctaj ×1,5."},3:{label:"AVANSAT",mult:2,icon:"🔴",desc:"Conversii combinate și rezultate cu zecimale. Punctaj ×2."}};
const U={length:{name:"lungime",f:{mm:.001,cm:.01,dm:.1,m:1,km:1000}},mass:{name:"masă",f:{mg:.000001,g:.001,kg:1,q:100,t:1000}},time:{name:"timp",f:{s:1,min:60,h:3600}},area:{name:"arie",f:{"cm²":.0001,"dm²":.01,"m²":1}},volume:{name:"volum",f:{"cm³":.000001,mL:.000001,"dm³":.001,L:.001,"m³":1}}};
const BAD=["prost","proasta","idiot","idioata","bou","vaca","pula","pizda","muie","cur","cacat","rahat","jeg"];
let S={page:"home",tier:1,level:"MEDIU",mult:1,score:0,i:0,name:"",cls:"",school:"",loc:"",qs:[],ans:{},quick:{},quickDone:false,quickScore:0,finished:false};
const $=id=>document.getElementById(id),card=$("card"),top=$("top");
function rnd(){if(crypto?.getRandomValues){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}return Math.random()}
function ri(a,b){return Math.floor(rnd()*(b-a+1))+a}function pick(a){return a[ri(0,a.length-1)]}function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function one(n){return Math.round((Number(n)+Number.EPSILON)*10)/10}
function val(n){return Number.isInteger(Number(n))?String(n):String(one(n)).replace(".",",")}
function ro(n){n=Number(n);if(!isFinite(n))return"";let d=Number.isInteger(n)?0:Math.abs(n)<.01?6:Math.abs(n)<1?4:Math.abs(n)<100?3:1;return String(Number(n.toFixed(d))).replace(".",",")}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function parse(v){v=String(v||"").trim().replace(/\s+/g,"").replace(",",".").replace(/[−–—]/g,"-");let m=v.match(/[-+]?\d*\.?\d+(?:e[-+]?\d+)?/i);return m?Number(m[0]):NaN}
function dec(n){return (String(Number(n.toFixed(10))).split(".")[1]||"").length}function trunc1(n){return n>=0?Math.floor((n+Number.EPSILON)*10)/10:Math.ceil((n-Number.EPSILON)*10)/10}
function correct(v,a){if(!isFinite(v))return false;a=Number(a);if(Math.abs(v-a)<=Math.max(1e-8,Math.abs(a)*1e-7))return true;if(dec(a)>1){let r=Math.round((a+Number.EPSILON)*10)/10,t=trunc1(a);return Math.abs(v-r)<=.051||Math.abs(v-t)<=.051}return Math.abs(v-a)<=Math.max(.001,Math.abs(a)*.00001)}
function toast(m){$("toast").textContent=m;$("toast").classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").classList.remove("show"),2300)}
function conf(){let c=$("confetti");c.innerHTML="";["#22d3ee","#22c55e","#fbbf24","#fb7185","#fff"].forEach((col,k)=>{for(let i=0;i<14;i++){let s=document.createElement("span");s.style.left=rnd()*100+"%";s.style.background=col;s.style.animationDelay=rnd()*.35+"s";c.appendChild(s)}});setTimeout(()=>c.innerHTML="",1700)}
function prog(){try{return JSON.parse(localStorage.getItem(LS))||{participations:0,unlockedTier:1,bestScore:0,bestLevel:"MEDIU"}}catch(e){return{participations:0,unlockedTier:1,bestScore:0,bestLevel:"MEDIU"}}}
function save(p){try{localStorage.setItem(LS,JSON.stringify(p))}catch(e){}}
function bad(t){t=String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");return BAD.some(w=>t.includes(w))}
function conv(cat,v,from,to){return Number(v)*U[cat].f[from]/U[cat].f[to]}
function qconv(cat,from,to,vals){let v=pick(vals),a=conv(cat,v,from,to);return{title:"Conversie de "+U[cat].name,text:`Transformă ${val(v)} ${from} în ${to}.`,known:[`${val(v)} ${from}`,`? ${to}`],unit:to,answer:a,solution:`${val(v)} ${from} = ${ro(a)} ${to}.`}}
function qmix(cat,au,bu,tu,av,bv,op="+"){let a=pick(av),b=pick(bv),x=conv(cat,a,au,tu),y=conv(cat,b,bu,tu),r=op=="-"?x-y:x+y;return{title:"Conversie combinată",text:`${op=="-"?"Scade":"Calculează suma"}: ${val(a)} ${au} ${op} ${val(b)} ${bu}. Exprimă rezultatul în ${tu}.`,known:[`${val(a)} ${au}`,`${val(b)} ${bu}`,`în ${tu}`],unit:tu,answer:r,solution:`${val(a)} ${au} = ${ro(x)} ${tu}; ${val(b)} ${bu} = ${ro(y)} ${tu}; rezultatul este ${ro(r)} ${tu}.`}}
function med(){return[()=>qconv("length","m","cm",[.5,1,1.2,1.5,2,2.5,3,4,5,7.5]),()=>qconv("length","cm","m",[50,100,150,200,250,300,500,750]),()=>qconv("length","km","m",[.2,.5,1,1.5,2,2.5,3]),()=>qconv("length","m","mm",[.5,1,1.5,2,2.5,3,4]),()=>qconv("mass","kg","g",[.5,1,1.2,1.5,2,2.5,3,3.5]),()=>qconv("mass","g","kg",[500,1000,1200,1500,2000,2500,3000]),()=>qconv("time","min","s",[.5,1,1.5,2,2.5,3,4,5,10]),()=>qconv("time","h","min",[.5,1,1.5,2,2.5,3]),()=>qconv("volume","L","mL",[.5,1,1.2,1.5,2,2.5,3]),()=>qconv("volume","mL","L",[500,1000,1500,2000,2500,3000])]}
function high(){return[()=>qconv("length","dm","cm",[1,1.5,2,2.5,3,4,5,8]),()=>qconv("length","mm","cm",[10,20,50,100,150,250,500]),()=>qconv("length","dm","m",[5,10,15,20,25,30,50]),()=>qconv("mass","q","kg",[.5,1,1.5,2,2.5,3,5]),()=>qconv("mass","kg","q",[50,100,150,200,250,500]),()=>qconv("mass","t","kg",[.5,1,1.2,1.5,2,2.5]),()=>qconv("mass","kg","t",[500,1000,1500,2000,2500]),()=>qconv("time","h","s",[.5,1,1.5,2,2.5]),()=>qconv("time","s","min",[30,60,90,120,180,300,600]),()=>qconv("area","m²","dm²",[.5,1,1.5,2,2.5,3]),()=>qconv("area","dm²","cm²",[1,1.5,2,2.5,4,5,10]),()=>qconv("area","dm²","m²",[10,15,20,25,50,75,100]),()=>qconv("volume","m³","dm³",[.1,.2,.3,.5,1,1.5]),()=>qconv("volume","dm³","cm³",[.5,1,1.5,2,2.5,3]),()=>qconv("volume","cm³","mL",[10,50,100,250,500,750,1000])]}
function adv(){return[()=>qmix("length","m","cm","cm",[.5,1,1.2,1.5,2,2.5],[20,40,75,100,150],"+"),()=>qmix("length","km","m","m",[.2,.5,1,1.2,1.5],[50,150,200,500],"+"),()=>qmix("mass","kg","g","kg",[.5,1,1.2,1.5,2.5],[100,250,500,750],"+"),()=>qmix("mass","t","kg","kg",[.5,1,1.5,2],[100,200,500,750],"+"),()=>qmix("time","h","min","min",[.5,1,1.5,2,2.5],[15,30,45,90],"+"),()=>qmix("volume","L","mL","L",[.5,1,1.2,1.5,2],[100,250,500,750],"+"),()=>qconv("area","cm²","m²",[1000,1500,2000,2500,4000,7500,10000]),()=>qconv("area","m²","cm²",[.1,.2,.5,1,1.5,2]),()=>qconv("volume","cm³","L",[250,500,750,1000,1500,2500]),()=>qconv("volume","m³","L",[.1,.2,.3,.5,1,1.2]),()=>qconv("mass","g","q",[5000,10000,15000,25000,50000]),()=>qconv("mass","q","t",[.5,1,1.5,2,2.5,5,10]),()=>qmix("area","m²","dm²","dm²",[.5,1,1.5,2],[10,50,75,100],"+"),()=>qmix("volume","dm³","cm³","cm³",[.5,1,1.5,2.5],[100,500,750,1000],"+")]}
function makeSet(t){let pool=t==1?med():t==2?high():adv(),qs=[],seen=new Set(),safe=0;while(qs.length<COUNT&&safe++<300){let q=pick(pool)(),key=q.text+"|"+q.unit;if(!seen.has(key)){seen.add(key);qs.push(q)}}while(qs.length<COUNT)qs.push(pick(pool)());return sh(qs).map((q,i)=>({...q,id:i+1}))}
function setTier(t){let p=prog(),a=Math.min(Math.max(1,Number(t)||1),p.unlockedTier||1),info=TIERS[a];S.tier=a;S.level=info.label;S.mult=info.mult}
function pts(x){return Math.round(x*S.mult)}
function tierHtml(sel,unl){return`<div class="tiers">${[1,2,3].map(t=>{let i=TIERS[t],l=t>unl;return`<button class="tier ${t==sel?"sel":""} ${l?"lock":""}" data-t="${t}" ${l?"disabled":""}><strong>${i.icon} ${i.label}</strong><span>${i.desc}</span><span class="mini">${l?"Blocat: termină nivelul anterior":t==sel?"Selectat":"Disponibil"}</span></button>`}).join("")}</div>`}
function update(){let show=S.page!="home";top.style.display=show?"":"none";if(!show)return;let p=prog(),pct=S.page=="final"?100:S.page=="quick"?92:S.page=="question"?Math.round(S.i/COUNT*90):0;$("sub").textContent=`${S.level} • 20 exerciții • diploma după 4 participări`;$("part").textContent=`🏅 Participări: ${p.participations||0}/4`;$("sn").textContent=S.name||"-";$("ss").textContent=S.score+" p";$("sl").textContent=S.level;$("sp").textContent=pct+"%";$("bar").style.width=pct+"%"}
function render(){update();({home,info,question,quick,final})[S.page]();scrollTo({top:0,behavior:"smooth"})}
function home(){let p=prog();if(S.tier>(p.unlockedTier||1))setTier(p.unlockedTier);card.innerHTML=`<div class="compact-home"><div class="home-head"><div><div class="badge">🎮 Joc de fizică • clasa a VI-a</div><h1>Campionii Unităților de Măsură</h1><p class="tag">20 de exerciții pe nivel, cu dificultate progresivă și diplomă după 4 participări.</p></div><div class="mini-progress"><div><div class="big">${p.participations||0}/4</div><span>participări</span></div><div><div class="big">${p.bestScore||0}</div><span>scor maxim</span></div><div><div class="big">${esc(p.bestLevel||"MEDIU")}</div><span>nivel maxim</span></div></div></div><div class="notice"><strong>🎓 Criteriu pentru diplomă</strong><span>Diploma devine disponibilă după <strong>4 participări finalizate</strong> salvate în browserul aceluiași telefon, tabletă sau calculator.</span></div><details class="details-box"><summary>Informații importante despre diplomă și date</summary><div class="details-content"><ul><li>Participările sunt calculate local, în browserul acestui dispozitiv.</li><li>Dacă schimbi dispozitivul sau ștergi datele browserului, jocul local nu mai vede participările anterioare.</li><li>Numele, școala și localitatea sunt folosite pentru diploma afișată pe ecran.</li><li>Dacă nu dorești diplomă, poți folosi un nume fictiv, fără cuvinte obscene sau jignitoare.</li><li>Jocul se poate reseta din când în când, iar progresul poate porni de la zero.</li></ul></div></details><h2>Alege nivelul</h2>${tierHtml(S.tier,p.unlockedTier||1)}<div class="inputs"><div class="inp"><label for="n">Numele și prenumele / nume fictiv</label><input id="n" type="text" maxlength="50" autocomplete="off" placeholder="Ex.: Andrei Popescu"></div><div class="inp"><label for="c">Clasa</label><input id="c" type="text" maxlength="12" autocomplete="off" placeholder="Ex.: 6A"></div><div class="inp"><label for="sc">Școala</label><input id="sc" type="text" maxlength="80" autocomplete="off" placeholder="Ex.: Școala Gimnazială ..."></div><div class="inp"><label for="l">Localitatea</label><input id="l" type="text" maxlength="60" autocomplete="off" placeholder="Ex.: Mangalia"></div></div><div class="buttons single"><button class="btn success" id="start">Începe antrenamentul</button></div><p class="small">Niveluri deblocate: ${[1,2,3].filter(x=>x<=(p.unlockedTier||1)).map(x=>TIERS[x].label).join(", ")}.</p></div>`;document.querySelectorAll(".tier").forEach(b=>b.onclick=()=>{setTier(b.dataset.t);render()});$("start").onclick=()=>{let txt=[$("n").value,$("c").value,$("sc").value,$("l").value].join(" ");if(bad(txt)){toast("Te rog să folosești un nume civilizat.");return}S.name=$("n").value.trim()||"Jucător";S.cls=$("c").value.trim()||"-";S.school=$("sc").value.trim()||"-";S.loc=$("l").value.trim()||"-";S.score=0;S.i=0;S.ans={};S.quick={};S.quickDone=false;S.quickScore=0;S.finished=false;S.qs=makeSet(S.tier);S.page="info";render()}}
function info(){card.innerHTML=`<h1>📘 Start rapid</h1><p class="problem">Nivel ales: ${TIERS[S.tier].icon} ${S.level}</p><div class="grid"><div class="box good"><h3>Ce exersezi?</h3><p>Transformări între unități de lungime, masă, timp, arie și volum.</p></div><div class="box warn"><h3>Zecimale</h3><p>Poți scrie cu virgulă sau punct. Dacă rezultatul are multe zecimale, este acceptată și varianta cu o zecimală, rotunjită sau nerotunjită.</p></div><div class="box"><h3>Încercări</h3><p>Ai o singură încercare. La greșeală primești rezolvarea și 0 puncte.</p></div><div class="box"><h3>Punctaj</h3><p>MEDIU ×1 • RIDICAT ×1,5 • AVANSAT ×2.</p></div></div><div class="buttons"><button class="btn secondary" id="back">Înapoi</button><button class="btn success" id="next">Mergi mai departe</button></div>`;$("back").onclick=()=>{S.page="home";render()};$("next").onclick=()=>{S.page="question";render()}}
function question(){let q=S.qs[S.i],st=S.ans[q.id]||{checked:false,value:""};card.innerHTML=`<div class="banner"><div class="btitle"><div class="num">${q.id}</div><div><h2>${q.title}</h2><p class="tag">Exercițiul ${S.i+1}/${COUNT} • nivel ${S.level}</p></div></div><div class="pill">+${pts(BASE)} p</div></div><p class="problem">${q.text}</p><div class="known">${q.known.map(k=>`<span>${esc(k)}</span>`).join("")}</div><div class="answer"><div><label for="a">Răspuns numeric</label><input id="a" type="text" inputmode="decimal" autocomplete="off" placeholder="Scrie răspunsul" value="${esc(st.value||"")}" ${st.checked?"disabled":""}></div><div class="unit">${q.unit}</div></div><p class="small">Scrie doar numărul, fără unitate. Exemple acceptate: 2,5 sau 2.5.</p><div class="feedback ${st.checked?(st.correct?"ok":"no"):""}">${st.checked?st.msg:"Completează răspunsul, apoi apasă pe „Verifică răspunsul”."}</div>${st.checked?`<div class="solution"><strong>Rezolvare:</strong><br>${q.solution}${st.correct?"":"<br><br>Curaj! Data viitoare te vei descurca mai bine."}</div>`:""}<div class="buttons"><button class="btn secondary" id="back">Înapoi</button><button class="btn primary" id="check" ${st.checked?"disabled":""}>Verifică răspunsul</button><button class="btn success" id="next" ${st.checked?"":"disabled"}>${S.i==COUNT-1?"Mergi la bonus":"Mergi mai departe"}</button></div>`;$("back").onclick=()=>{if(S.i>0)S.i--;else S.page="info";render()};$("check").onclick=()=>{let raw=$("a").value,v=parse(raw);if(!isFinite(v)){toast("Scrie un număr pentru răspuns.");return}let ok=correct(v,q.answer),gain=ok?pts(BASE):0;if(ok){S.score+=gain;conf()}S.ans[q.id]={checked:true,correct:ok,value:raw,msg:ok?`Corect! Ai câștigat ${gain} puncte.`:`Răspuns greșit. Primești 0 puncte. Răspunsul corect este ${ro(q.answer)} ${q.unit}.`};render()};$("next").onclick=()=>{if(S.i<COUNT-1){S.i++;render()}else{S.page="quick";render()}};let a=$("a");if(a&&!st.checked){a.focus();a.onkeydown=e=>{if(e.key=="Enter")$("check").click()}}}
const QQ=[["Unitatea SI pentru lungime este:",["metrul","kilometrul","centimetrul"],0],["Unitatea SI pentru masă este:",["gramul","kilogramul","tona"],1],["1 h are:",["60 s","600 s","3600 s"],2],["1 dm³ este egal cu:",["1 L","10 L","100 L"],0],["1 q este egal cu:",["10 kg","100 kg","1000 kg"],1]];
function quick(){card.innerHTML=`<h1>⚡ Verificare rapidă – bonus</h1><p class="problem">Răspunde la 5 întrebări scurte. Fiecare răspuns corect aduce ${pts(BONUS)} puncte.</p><div class="quick">${QQ.map((q,i)=>`<div class="box"><h3>${i+1}. ${q[0]}</h3><div class="variants">${q[1].map((op,j)=>`<label class="variant"><input type="radio" name="q${i}" value="${j}" ${S.quick[i]===j?"checked":""} ${S.quickDone?"disabled":""}><span><strong>${String.fromCharCode(65+j)}.</strong> ${op}</span></label>`).join("")}</div></div>`).join("")}</div><div class="feedback ${S.quickDone?"ok":""}">${S.quickDone?`Bonus finalizat: ${S.quickScore} puncte.`:"Alege câte o variantă la fiecare întrebare."}</div><div class="buttons"><button class="btn secondary" id="back">Înapoi</button><button class="btn primary" id="check" ${S.quickDone?"disabled":""}>Verifică bonusul</button><button class="btn success" id="fin" ${S.quickDone?"":"disabled"}>Vezi rezultatul</button></div>`;QQ.forEach((q,i)=>document.querySelectorAll(`input[name=q${i}]`).forEach(inp=>inp.onchange=()=>S.quick[i]=Number(inp.value)));$("back").onclick=()=>{S.page="question";S.i=COUNT-1;render()};$("check").onclick=()=>{if(Object.keys(S.quick).length<QQ.length){toast("Alege un răspuns la fiecare întrebare.");return}let c=0;QQ.forEach((q,i)=>{if(S.quick[i]===q[2])c++});S.quickScore=pts(c*BONUS);S.score+=S.quickScore;S.quickDone=true;if(c>=4)conf();render()};$("fin").onclick=()=>{if(!S.finished){S.finished=true;let p=prog(),bestLevel=["MEDIU","RIDICAT","AVANSAT"].indexOf(S.level)>=["MEDIU","RIDICAT","AVANSAT"].indexOf(p.bestLevel||"MEDIU")?S.level:p.bestLevel||"MEDIU";S.after={participations:(p.participations||0)+1,unlockedTier:Math.min(3,Math.max(p.unlockedTier||1,S.tier+1)),bestScore:Math.max(p.bestScore||0,S.score),bestLevel,lastPlayed:new Date().toISOString()};save(S.after)}S.page="final";render()}}
function diploma(p){return(p.participations||0)>=4?`<div class="cert" id="diploma"><h2>FELICITĂRI!</h2><p>Se adeverește prin prezenta că</p><div class="name">${esc(S.name)}</div><p>de la școala <strong>${esc(S.school)}</strong>, din localitatea <strong>${esc(S.loc)}</strong>, a participat la competiția <strong>Campionii fizicii – etapa unitățile de măsură</strong>, nivelul <strong>${esc(S.level)}</strong>, și a finalizat cel puțin <strong>4 exersări</strong>.</p><p>Scorul obținut la această participare: <strong>${S.score} puncte</strong>.</p><div class="sig">Semnează: prof. Dănuț Andronie</div></div>`:""}
function final(){let p=S.after||prog(),cor=Object.values(S.ans).filter(x=>x.correct).length,need=Math.max(0,4-(p.participations||0)),next=S.tier<3&&(p.unlockedTier||1)>=S.tier+1;card.innerHTML=`<h1>🏁 Rezultat final</h1><p class="problem">Ai finalizat nivelul ${S.level}.</p><div class="scoregrid"><div class="tile"><strong>${S.score}</strong><span>puncte</span></div><div class="tile"><strong>${cor}/${COUNT}</strong><span>exerciții corecte</span></div><div class="tile"><strong>${p.participations}/4</strong><span>participări pentru diplomă</span></div></div><div class="box ${p.participations>=4?"good":"warn"}"><h3>${p.participations>=4?"🎓 Diplomă disponibilă":"🎓 Încă puțin până la diplomă"}</h3><p>${p.participations>=4?"Ai cel puțin 4 participări salvate în browserul acestui dispozitiv. Diploma este afișată mai jos.":`Mai ai nevoie de ${need} participare/participări finalizate pe acest dispozitiv.`}</p></div>${diploma(p)}<div class="buttons">${next?`<button class="btn warning" id="nt">Treci la nivelul următor</button>`:""}<button class="btn success" id="again">Joacă din nou</button><button class="btn secondary" id="exit">Ieșire</button>${p.participations>=4?`<button class="btn primary" id="print">Tipărește / salvează diploma</button>`:""}</div>`;if($("nt"))$("nt").onclick=()=>{setTier(S.tier+1);S.page="home";render()};$("again").onclick=()=>{S.page="home";render()};$("exit").onclick=()=>{location.href="../index.html"};if($("print"))$("print").onclick=()=>print()}
setTier(1);render();
})();
</script>
