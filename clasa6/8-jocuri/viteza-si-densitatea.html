<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Test interactiv pentru exersarea vitezei, distanței, timpului, densității, masei și volumului la clasa a VI-a."
    >

    <title>
        Campionii Vitezei și Densității
    </title>

    <!-- Stilul general al platformei -->
    <link
        rel="stylesheet"
        href="../../assets/css/style.css"
    >

    <!-- Stilul comun tuturor testelor -->
    <link
        rel="stylesheet"
        href="../../assets/css/test-style.css"
    >
</head>


<body>

    <main>

        <!--
            Testul este generat aici de test-engine.js.

            Vor fi afișate:
            - titlul;
            - nivelul;
            - câteva indicații scurte;
            - datele elevului;
            - progresul nivelurilor;
            - cele 30 de exerciții;
            - rezultatul;
            - diploma după Nivelul 3.
        -->

        <div
            id="testApp"
            data-test-engine
        ></div>

    </main>


    <!-- =====================================================
         1. PROFIL ELEV + SESIUNE + PROGRES
    ====================================================== -->

    <script
        src="../../assets/js/test-storage.js"
    ></script>


    <!-- =====================================================
         2. CONȚINUTUL TESTULUI
    ====================================================== -->

    <script
        src="../../assets/js/viteza-si-densitatea.js"
    ></script>


    <!-- =====================================================
         3. MOTORUL COMUN AL TESTELOR
    ====================================================== -->

    <script
        src="../../assets/js/test-engine.js"
    ></script>


    <!-- =====================================================
         4. PORNIREA TESTULUI
    ====================================================== -->

    <script>
        if (
            typeof window.initTestEngine ===
            "function"
        ) {
            window.initTestEngine();

        } else {

            console.error(
                "test-engine.js nu a fost încărcat corect."
            );
        }
    </script>

</body>

</html>
