<script>
"use strict";

/* Înlocuiește generatorul anterior cu itemi mai dificili. */
const initialBuild = build;

build = function(v) {
  const q = initialBuild(v);
  const loc = scenes[v - 1];
  const r = rng(v * 104729);
  const get = id => q.find(item => item.id === id);

  function multi(id, prompt, value) {
    Object.assign(get(id), {
      prompt,
      answer: fmt(value),
      options: shuffle(
        [value, value * 10, value * 100, value / 10].map(fmt),
        r
      )
    });
  }

  function pairs(id, prompt, rows) {
    Object.assign(get(id), {
      prompt,
      left: rows.map(row => row[0]),
      answer: rows.map(row => row[1]),
      options: shuffle(rows.map(row => row[1]), r)
    });
  }

  /* Exact 10 itemi de transformare în SI. */
  let x = (1743 + 37 * v) / 10;
  multi(
    0,
    `În ${loc}, un cablu are ${fmt(x)} cm.
     Alege valoarea lungimii în metri.`,
    x / 100
  );

  x = (38765 + 137 * v) / 10;
  multi(
    1,
    `În ${loc}, masa unui recipient este ${fmt(x)} g.
     Alege valoarea masei în kilograme.`,
    x / 1000
  );

  const minutes = 12 + v;
  const seconds = 17 + v;
  multi(
    2,
    `În ${loc}, o măsurare durează ${minutes} minute
     și ${seconds} secunde. Alege durata în secunde.`,
    minutes * 60 + seconds
  );

  x = (43217 + 113 * v) / 10;
  Object.assign(get(3), {
    prompt:
      `În ${loc}, ${fmt(x)} mm reprezintă
       ${fmt(x / (v % 2 ? 1000 : 100))} m.`,
    answer: v % 2 ? "Adevărat" : "Fals"
  });

  x = (8731 + 97 * v) / 10;
  Object.assign(get(4), {
    prompt:
      `În ${loc}, ${fmt(x)} cm² reprezintă
       ${fmt(x / (v % 2 ? 100 : 10000))} m².`,
    answer: v % 2 ? "Fals" : "Adevărat"
  });

  pairs(
    5,
    `Asociază lungimile din ${loc} cu valorile în metri.`,
    [
      [
        `${fmt((2467 + 31 * v) / 10)} cm`,
        fmt((2467 + 31 * v) / 1000)
      ],
      [
        `${fmt((58731 + 127 * v) / 10)} mm`,
        fmt((58731 + 127 * v) / 10000)
      ],
      [
        `${fmt((173 + 11 * v) / 100)} km`,
        fmt((173 + 11 * v) * 10)
      ]
    ]
  );

  pairs(
    6,
    `Asociază duratele din ${loc} cu valorile în secunde.`,
    [
      [
        `${fmt((173 + 13 * v) / 10)} min`,
        fmt((173 + 13 * v) * 6)
      ],
      [
        `${fmt((127 + 7 * v) / 100)} h`,
        fmt((127 + 7 * v) * 36)
      ],
      [
        `${fmt((4371 + 53 * v) / 10)} ms`,
        fmt((4371 + 53 * v) / 10000)
      ]
    ]
  );

  x = (176543 + 211 * v) / 10;
  Object.assign(get(7), {
    prompt:
      `În ${loc}, un volum este ${fmt(x)} cm³.
       Completează valoarea în m³.`,
    answer: x / 1e6
  });

  x = (3871 + 43 * v) / 100;
  Object.assign(get(8), {
    prompt:
      `În ${loc}, o suprafață este ${fmt(x)} dm².
       Completează valoarea în m².`,
    answer: x / 100
  });

  x = (276543 + 317 * v) / 10;
  Object.assign(get(9), {
    prompt:
      `În ${loc}, masa unui eșantion este ${fmt(x)} mg.
       Completează valoarea în kg.`,
    answer: x / 1e6
  });

  /* Calcule suplimentare fără transformări în SI. */
  const a = (1731 + 19 * v) / 10;
  const b = (1743 + 19 * v) / 10;
  const c = (1757 + 19 * v) / 10;

  Object.assign(get(17), {
    prompt:
      `În ${loc}, trei măsurări ale lungimii dau
       ${fmt(a)} cm, ${fmt(b)} cm și ${fmt(c)} cm.
       Calculează media aritmetică în cm.
       Rotunjește la două zecimale.`,
    answer: Number(((a + b + c) / 3).toFixed(2))
  });

  const divisions = 8 + v;
  const length = divisions * (17 + v) / 10;

  Object.assign(get(18), {
    prompt:
      `În ${loc}, între marcajele 0 cm și ${fmt(length)} cm
       ale unei rigle sunt ${divisions} intervale egale.
       Calculează valoarea unei diviziuni în cm.`,
    answer: (17 + v) / 10
  });

  /*
    Ordine amestecată, apoi decalată după catalog.
    Variantele consecutive nu au aceeași familie de item
    pe aceeași poziție. Enunțurile și datele diferă între elevi.
  */
  const order = shuffle(
    Array.from({ length: 20 }, (_, i) => i),
    rng(20261008)
  );

  return order.map((_, i) => get(order[(i + v - 1) % 20]));
};

/* Interfață: numai înainte. */
const originalRender = render;

render = function() {
  originalRender();

  $("previous").hidden = true;
  $("navigation").hidden = true;

  const navigationHint = $("navigation").nextElementSibling;
  if (navigationHint) navigationHint.hidden = true;

  const last = current === questions.length - 1;
  $("next").hidden = last;
  $("next").textContent = "Confirmă răspunsul și continuă";
  $("finish").hidden = !last;

  /* Literele urmăresc ordinea reală a variantelor de răspuns. */
  if (questions[current].type === "mc") {
    $("question").querySelectorAll(".option span")
      .forEach((span, i) => {
        span.textContent =
          `${String.fromCharCode(97 + i)}) ${span.textContent}`;
      });
  }

  const warning = document.createElement("p");
  warning.className = "note";
  warning.textContent =
    "Verifică răspunsul înainte de a continua. " +
    "După trecerea la itemul următor, nu mai poți reveni.";
  $("question").appendChild(warning);
};

/* Dezactivează vechile acțiuni de revenire. */
$("previous").onclick = null;
$("navigation").onclick = null;

function validCurrentAnswer() {
  const q = questions[current];

  if (!answered(q)) {
    alert("Completează răspunsul înainte de a continua.");
    return false;
  }

  if (q.type === "fill" && typeof q.answer === "number") {
    if (!Number.isFinite(numeric(answers[q.id]))) {
      alert(
        "Introdu numai un număr, fără unitate. " +
        "Poți folosi virgulă sau punct zecimal."
      );
      return false;
    }
  }

  return true;
}

$("next").onclick = () => {
  if (finalized || !validCurrentAnswer()) return;
  if (current >= questions.length - 1) return;
  current++;
  render();
};

/* La final se verifică și completarea ultimului item. */
const originalFinish = $("finish").onclick;

$("finish").onclick = () => {
  if (finalized || !validCurrentAnswer()) return;
  originalFinish();
};

/* Actualizează instrucțiunile de pe pagina de început. */
const introNote = $("intro").querySelector(".note");
introNote.textContent =
  "Folosește ciorna pentru calcule. Poți modifica răspunsul doar " +
  "la itemul afișat. După confirmare, treci înainte și nu mai " +
  "poți reveni. Nu reîncărca pagina: progresul se pierde.";

/* Elimină instrucțiunea veche despre revenire. */
$("intro").querySelectorAll("p").forEach(p => {
  if (p.textContent.includes("Poți reveni la orice întrebare"))
    p.textContent =
      "Verifică fiecare răspuns înainte de a trece la itemul următor.";
});

/* Verificări pentru generatorul actualizat. */
if (new URLSearchParams(location.search).has("verificare")) {
  try {
    const report = runChecks();
    const all = Array.from({ length: 30 }, (_, i) => build(i + 1));

    for (let v = 0; v < 29; v++) {
      for (let position = 0; position < 20; position++) {
        if (all[v][position].id === all[v + 1][position].id) {
          throw Error(
            `Variantele ${v + 1} și ${v + 2} au aceeași familie ` +
            `de item la poziția ${position + 1}.`
          );
        }
      }
    }

    $("check-output").textContent =
      report +
      "\nOK: variantele consecutive au familii diferite " +
      "la fiecare poziție.";
  } catch (error) {
    $("check-output").textContent = "EROARE: " + error.message;
  }
}
</script>
