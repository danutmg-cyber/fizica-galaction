<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Evaluare · Fizică · Clasa a VII-a</title>
<link rel="stylesheet" href="../../../assets/css/test-style.css">
<link rel="stylesheet" href="../../../assets/css/concepte7-test.css?v=20261008-4">
<script defer src="../../../assets/js/test-storage.js"></script>
<script defer src="../../../assets/js/test-engine.js"></script>
<script defer src="../../../assets/js/test-report.js"></script>
<script defer src="../../../assets/js/concepte7-test.js?v=20261008-6"></script>
</head>
<body>
<main class="assessment">
<header class="assessment-header">
<p class="assessment-class">Fizică · Clasa a VII-a</p>
<h1>Concepte de bază în fizică</h1>
</header>
<section id="registration" class="registration">
<h2>Date elev</h2>
<form id="variant-form">
<div class="registration-grid">
<label for="student-name">Nume și prenume
<input id="student-name" name="nume" required maxlength="80" autocomplete="name"></label>
<label for="catalog-number">Număr în catalog
<input id="catalog-number" name="catalog" type="number" min="1" max="30" step="1" required inputmode="numeric"></label>
</div>
<p class="evaluation-rules">După confirmarea răspunsului nu poți reveni la întrebare. Nu părăsi pagina în timpul testului.</p>
<p id="variant-error" class="form-error" role="alert"></p>
<button type="submit" class="start-button">Începe testul</button>
</form>
</section>
<p id="session-status" class="session-status" role="status" aria-live="polite"></p>
<div id="testApp" data-test-engine hidden></div>
<noscript><p>Activează JavaScript pentru a putea răspunde la întrebări.</p></noscript>
</main>
</body>
</html>
