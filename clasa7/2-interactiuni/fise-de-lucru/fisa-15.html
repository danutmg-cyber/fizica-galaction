<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">

  <title>Fișa 15 | Mișcarea unui corp pe un plan înclinat | Fizica Galaction</title>

  <link rel="stylesheet" href="../../../assets/css/lesson-app.css">

  <style>
    mjx-container {
      max-width: 100%;
      overflow-x: auto;

    }

    .formula-card {

      padding: 14px;

      border-radius: 12px;

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]']]
      },

        scale: 1.05
      }
    };
  </script>

</head>

<body>
  <button class="theme-switch" id="themeSwitch" type="button" aria-label="Comută între modul zi și modul noapte">
    <span class="icon" id="themeIcon" aria-hidden="true"></span>
    <span id="themeLabel">Mod noapte</span>
  </button>

  <main class="worksheet" id="worksheetApp"></main>

  <nav class="lesson-controls" id="worksheetNav" aria-label="Navigare între paginile fișei"></nav>

  <script src="../../../assets/js/utils.js"></script>
  <script src="../../../assets/js/worksheet-engine.js"></script>

  <script>

        inapoiLaLectii: "../lectii/index.html",

      pagini: [

          tip: "info",
          chip: "Pagina 1",

            "Fișa are 5 pagini. Completează fiecare pagină, apoi pe ultima pagină apasă <strong>Verifică fișa</strong> pentru a vedea scorul.",
            "Un <strong>plan înclinat</strong> formează cu planul orizontal un unghi ascuțit \\(\\alpha\\). Parametrii săi sunt înălțimea \\(h\\), lungimea \\(l\\) și baza \\(b\\).",
            "Pe corp pot acționa greutatea \\(\\vec G\\), reacțiunea normală \\(\\vec N\\), forța de frecare \\(\\vec F_f\\) și o forță aplicată \\(\\vec F\\).",
            "<div class=\"formula-card\">\\(\\vec G=\\vec G_t+\\vec G_n\\)<br>\\(G_t=G\\cdot\\frac{h}{l}\\), &nbsp; \\(G_n=G\\cdot\\frac{b}{l}\\)</div>",

            "Poți comuta între modul zi/noapte cu butonul din dreapta sus, fără să pierzi răspunsurile completate."

            },
            {

              sablon: "b) Componenta greutății perpendiculară pe plan se numește componentă {input}.",
              raspunsuriAcceptate: ["normala", "normală"],
              punctaj: 0.5
            },
            {
              id: "q1c",
              tip: "completare",
              sablon: "c) Forța exercitată de plan asupra corpului, perpendicular pe suprafață, este reacțiunea {input}.",
              raspunsuriAcceptate: ["normala", "normală"],
              punctaj: 0.5
            }
          ]
        },

        {
          tip: "intrebari",
          chip: "Pagina 3",
          titlu: "I.2 Alege varianta corectă / I.3 Adevărat sau Fals",
          intrebari: [
            {
              id: "q2a",
              tip: "alegere",
              intrebare: "Componenta greutății care tinde să deplaseze corpul de-a lungul planului este:",
              optiuni: [
                "\\(G_t\\)",

            },
            {
              id: "q2b",
              tip: "alegere",
              intrebare: "Dacă frecarea se neglijează, forța necesară pentru urcare uniformă este:",
              optiuni: [

                "\\(F=G+h+l\\)"
              ],
              corect: 1,
              punctaj: 0.5
            },
            {
              id: "q3a",
              tip: "adevarat-fals",
              intrebare: "Planul înclinat permite ridicarea unui corp folosind o forță mai mică decât greutatea sa.",
              corect: "A",
              punctaj: 0.5
            },
            {
              id: "q3b",
              tip: "adevarat-fals",
              intrebare: "Componenta \\(G_n\\) este paralelă cu suprafața planului înclinat.",
              corect: "F",
              punctaj: 0.5
            },
            {
              id: "q3c",
              tip: "adevarat-fals",
              intrebare: "La coborârea uniformă, forța de frecare poate echilibra componenta tangențială a greutății.",
              corect: "A",

            }
          ]
        },

        {
          tip: "intrebari",
          chip: "Pagina 4",
          titlu: "II. Calculează",
          intrebari: [
            {
              id: "q4a",
              tip: "numeric",
              sablon: "a) \\(G=120\\,N\\), \\(h=2\\,m\\), \\(l=6\\,m\\). Componenta tangențială este \\(G_t={input}\\,N\\).",
              raspunsCorect: 40,
              punctaj: 0.75
            },
            {
              id: "q4b",
              tip: "numeric",
              sablon: "b) \\(G=90\\,N\\), \\(h=1\\,m\\), \\(l=3\\,m\\). Fără frecare, forța de urcare uniformă este \\(F={input}\\,N\\).",
              raspunsCorect: 30,
              punctaj: 0.75
            },
            {
              id: "q4c",
              tip: "numeric",
              sablon: "c) Pentru un corp, \\(G_t=24\\,N\\) și \\(F_f=6\\,N\\). La urcarea uniformă, forța aplicată este \\(F={input}\\,N\\).",
              raspunsCorect: 30,
              punctaj: 0.75
            },
            {
              id: "q4d",
              tip: "numeric",
              sablon: "d) \\(G=100\\,N\\), \\(b=4\\,m\\), \\(l=5\\,m\\). Componenta normală este \\(G_n={input}\\,N\\).",
              raspunsCorect: 80,
              punctaj: 0.75
            }
          ]
        },

        {
          tip: "intrebari",
          chip: "Pagina 5",
          titlu: "III. Gândește",
          intrebari: [
            {
              id: "q5",
              tip: "text-liber",
              multilinie: true,
              intrebare: "1. De ce o rampă mai lungă și mai puțin abruptă permite urcarea corpului cu o forță mai mică?",
              cuvinteCheie: [
                "raportul h l",
                "h/l",
                "componenta tangentiala",
                "componenta tangențială",
                "gt scade",
                "g_t scade",
                "forta mai mica",
                "forță mai mică",
                "inclinatie mai mica",

              mesajCorect: "Corect. Pentru aceeași înălțime, o lungime mai mare micșorează raportul h/l, deci scad componenta tangențială și forța necesară.",
              mesajPartial: "Orientativ: folosește relația \\(F=G\\cdot\\frac{h}{l}\\) și explică efectul creșterii lungimii.",
              mesajGresit: "Scrie un răspuns.",
              punctaj: 1.5
            },
            {
              id: "q6",
              tip: "text-liber",
              multilinie: true,
              intrebare: "2. Ce forțe trebuie să se echilibreze pentru ca un corp să coboare uniform pe planul înclinat?",
              cuvinteCheie: [
                "componenta tangentiala",
                "componenta tangențială",
                "gt",
                "g_t",
                "forta de frecare",
                "forța de frecare",
                "egale",
                "se echilibreaza",
                "se echilibrează"
              ],
              mesajCorect: "Corect. Componenta tangențială a greutății și forța de frecare trebuie să fie egale și de sensuri opuse: \\(G_t=F_f\\).",
              mesajPartial: "Orientativ: numește componenta greutății de-a lungul planului și forța care i se opune.",
              mesajGresit: "Scrie un răspuns.",
              punctaj: 1.5
            }
          ]
        }

        // Pagina finală de verificare se adaugă automat.
      ]
    };

    initWorksheet({
      data: FISA_DATA,
      containerId: "worksheetApp",
      navId: "worksheetNav"
    });

    window.addEventListener("load", function () {
      if (window.MathJax && typeof window.MathJax.typesetPromise === "function") {
        window.MathJax.typesetPromise();
      }
    });

    // ===== Comutator temă zi/noapte =====
    (function () {
      const STORAGE_KEY = "fizica-galaction-fisa-theme";
      const body = document.body;
      const switchBtn = document.getElementById("themeSwitch");
      const icon = document.getElementById("themeIcon");
      const label = document.getElementById("themeLabel");

      function apply(theme) {
        if (theme === "light") {
          body.setAttribute("data-theme", "light");
          icon.textContent = "☀️";
          label.textContent = "Mod zi";
        } else {
          body.removeAttribute("data-theme");
          icon.textContent = "🌙";
          label.textContent = "Mod noapte";
        }
      }

      apply(localStorage.getItem(STORAGE_KEY) || "dark");

      switchBtn.addEventListener("click", function () {
        const current = body.getAttribute("data-theme") === "light" ? "light" : "dark";
        const next = current === "light" ? "dark" : "light";
        localStorage.setItem(STORAGE_KEY, next);
        apply(next);
      });
    })();
  </script>
</body>
</html>
