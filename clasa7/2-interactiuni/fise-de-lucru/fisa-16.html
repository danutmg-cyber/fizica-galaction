<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Fișă de lucru interactivă, paginată, pentru lecția 16, clasa a VII-a: Descompunerea unei forțe după două direcții reciproc perpendiculare.">
  <meta name="theme-color" content="#0f172a">
  <title>Fișa 16 | Descompunerea unei forțe | Fizica Galaction</title>

  <link rel="stylesheet" href="../../../assets/css/lesson-app.css">

  <style>
    mjx-container {
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.12em 0;
    }

    .question-block label {
      width: 100%;
    }

    .formula-card {
      margin: 14px 0;
      padding: 14px;
      border: 1px solid rgba(34, 211, 238, 0.45);
      border-radius: 12px;
      background: rgba(34, 211, 238, 0.08);
      text-align: center;
    }
  </style>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]']]
      },
      chtml: {
        scale: 1.05
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>

<body>
  <button class="theme-switch" id="themeSwitch" type="button" aria-label="Comută între modul zi și modul noapte">
    <span class="icon" id="themeIcon" aria-hidden="true"></span>
    <span id="themeLabel">Mod noapte</span>
  </button>

  <main class="worksheet" id="worksheetApp"></main>

  <nav class="lesson-controls" id="worksheetNav" aria-label="Navigare între paginile fișei"></nav>

  <script src="../../../assets/js/utils.js"></script>
  <script src="../../../assets/js/worksheet-engine.js"></script>

  <script>
    const FISA_DATA = {
      titlu: "Fișa 16 – Descompunerea unei forțe după două direcții reciproc perpendiculare",
      capitol: "Interacțiuni",

      linkuri: {
        inapoiLaLectii: "../lectii/index.html",
        vezicaLectie: "../lectii/lectia-16.html",
        toateFisele: "./index.html"
      },

      pagini: [
        {
          tip: "info",
          chip: "Pagina 1",
          paragrafe: [
            "Fișa are 5 pagini. Completează fiecare pagină, apoi pe ultima pagină apasă <strong>Verifică fișa</strong> pentru a vedea scorul.",
            "O forță oblică poate fi înlocuită cu două componente perpendiculare care produc împreună același efect ca forța inițială.",
            "<div class=\"formula-card\">\\(\\vec F=\\vec F_x+\\vec F_y\\)<br>\\(F_x=F\\cos\\alpha\\), &nbsp; \\(F_y=F\\sin\\alpha\\)<br>\\(F=\\sqrt{F_x^2+F_y^2}\\)</div>",
            "Pe planul înclinat, greutatea se descompune în componenta paralelă cu planul și componenta perpendiculară pe plan.",
            "<div class=\"formula-card\">\\(G_{\\parallel}=G\\sin\\alpha\\), &nbsp; \\(G_{\\perp}=G\\cos\\alpha\\)</div>",
            "<span class=\"example\"><strong>Exemplu numeric:</strong> pentru \\(F=10\\,N\\) și \\(\\alpha=30^\\circ\\): \\(F_x=10\\cos30^\\circ\\approx8,7\\,N\\), iar \\(F_y=10\\sin30^\\circ=5\\,N\\).</span>",
            "Poți comuta între modul zi/noapte cu butonul din dreapta sus, fără să pierzi răspunsurile completate."
          ]
        },

        {
          tip: "intrebari",
          chip: "Pagina 2",
          titlu: "I.1 Completează",
          intrebari: [
            {
              id: "q1a",
              tip: "completare",
              sablon: "a) Descompunerea unei forțe înseamnă înlocuirea ei cu două forțe {input}.",
              raspunsuriAcceptate: ["componente", "componente perpendiculare"],
              punctaj: 0.5
            },
            {
              id: "q1b",
              tip: "completare",
              sablon: "b) Componenta \\(F_x\\) se află pe direcția axei {input}.",
              raspunsuriAcceptate: ["ox", "x", "orizontale", "orizontală"],
              punctaj: 0.5
            },
            {
              id: "q1c",
              tip: "completare",
              sablon: "c) Forța inițială este reprezentată de {input} dreptunghiului construit pe componente.",
              raspunsuriAcceptate: ["diagonala", "diagonală"],
              punctaj: 0.5
            }
          ]
        },

        {
          tip: "intrebari",
          chip: "Pagina 3",
          titlu: "I.2 Alege varianta corectă / I.3 Adevărat sau Fals",
          intrebari: [
            {
              id: "q2a",
              tip: "alegere",
              intrebare: "Dacă forța \\(F\\) face unghiul \\(\\alpha\\) cu axa \\(Ox\\), componenta orizontală este:",
              optiuni: [
                "\\(F_x=F\\cos\\alpha\\)",
                "\\(F_x=F\\sin\\alpha\\)",
                "\\(F_x=F+\\alpha\\)"
              ],
              corect: 0,
              punctaj: 0.5
            },
            {
              id: "q2b",
              tip: "alegere",
              intrebare: "Pentru două componente perpendiculare, modulul forței este:",
              optiuni: [
                "\\(F=F_x-F_y\\)",
                "\\(F=\\sqrt{F_x^2+F_y^2}\\)",
                "\\(F=\\frac{F_x}{F_y}\\)"
              ],
              corect: 1,
              punctaj: 0.5
            },
            {
              id: "q3a",
              tip: "adevarat-fals",
              intrebare: "Componenta orizontală a forței de tracțiune ajută sania să înainteze.",
              corect: "A",
              punctaj: 0.5
            },
            {
              id: "q3b",
              tip: "adevarat-fals",
              intrebare: "Componenta verticală a unei forțe oblice nu poate modifica apăsarea corpului pe suprafață.",
              corect: "F",
              punctaj: 0.5
            },
            {
              id: "q3c",
              tip: "adevarat-fals",
              intrebare: "Pe planul înclinat, componenta \\(G_{\\parallel}\\) tinde să deplaseze corpul în jos pe plan.",
              corect: "A",
              punctaj: 0.5
            }
          ]
        },

        {
          tip: "intrebari",
          chip: "Pagina 4",
          titlu: "II. Calculează componentele",
          intrebari: [
            {
              id: "q4a",
              tip: "numeric",
              sablon: "a) \\(F=20\\,N\\), \\(\\alpha=30^\\circ\\). Folosește \\(\\sin30^\\circ=0,5\\). Componenta \\(F_y={input}\\,N\\).",
              raspunsCorect: 10,
              punctaj: 0.75
            },
            {
              id: "q4b",
              tip: "numeric",
              sablon: "b) \\(F=10\\,N\\), \\(\\alpha=60^\\circ\\). Folosește \\(\\cos60^\\circ=0,5\\). Componenta \\(F_x={input}\\,N\\).",
              raspunsCorect: 5,
              punctaj: 0.75
            },
            {
              id: "q4c",
              tip: "numeric",
              sablon: "c) \\(F_x=6\\,N\\) și \\(F_y=8\\,N\\). Modulul forței este \\(F={input}\\,N\\).",
              raspunsCorect: 10,
              punctaj: 0.75
            },
            {
              id: "q4d",
              tip: "numeric",
              sablon: "d) \\(G=100\\,N\\), \\(\\alpha=30^\\circ\\). Folosește \\(\\sin30^\\circ=0,5\\). Componenta \\(G_{\\parallel}={input}\\,N\\).",
              raspunsCorect: 50,
              punctaj: 0.75
            }
          ]
        },

        {
          tip: "intrebari",
          chip: "Pagina 5",
          titlu: "III. Gândește",
          intrebari: [
            {
              id: "q5",
              tip: "text-liber",
              multilinie: true,
              intrebare: "1. Explică de ce o sanie trasă cu un fir înclinat este și deplasată înainte, și apăsată mai puțin pe zăpadă.",
              cuvinteCheie: [
                "componenta orizontala",
                "componenta orizontală",
                "inainte",
                "înainte",
                "componenta verticala",
                "componenta verticală",
                "apasarea",
                "apăsarea",
                "micsoreaza",
                "micșorează"
              ],
              mesajCorect: "Corect. Componenta orizontală deplasează sania înainte, iar componenta verticală orientată în sus micșorează apăsarea pe zăpadă.",
              mesajPartial: "Orientativ: precizează separat efectul componentei orizontale și al celei verticale.",
              mesajGresit: "Scrie un răspuns.",
              punctaj: 1.5
            },
            {
              id: "q6",
              tip: "text-liber",
              multilinie: true,
              intrebare: "2. Ce rol au componentele \\(G_{\\parallel}\\) și \\(G_{\\perp}\\) pentru un corp aflat pe un plan înclinat?",
              cuvinteCheie: [
                "paralela",
                "paralelă",
                "deplaseaza",
                "deplasează",
                "in jos",
                "în jos",
                "perpendiculara",
                "perpendiculară",
                "apasa",
                "apasă",
                "plan"
              ],
              mesajCorect: "Corect. Componenta paralelă tinde să deplaseze corpul în jos pe plan, iar componenta perpendiculară apasă corpul pe suprafață.",
              mesajPartial: "Orientativ: explică efectul fiecărei componente asupra corpului.",
              mesajGresit: "Scrie un răspuns.",
              punctaj: 1.5
            }
          ]
        }

        // Pagina finală de verificare se adaugă automat.
      ]
    };

    initWorksheet({
      data: FISA_DATA,
      containerId: "worksheetApp",
      navId: "worksheetNav"
    });

    window.addEventListener("load", function () {
      if (window.MathJax && typeof window.MathJax.typesetPromise === "function") {
        window.MathJax.typesetPromise();
      }
    });

    // ===== Comutator temă zi/noapte =====
    (function () {
      const STORAGE_KEY = "fizica-galaction-fisa-theme";
      const body = document.body;
      const switchBtn = document.getElementById("themeSwitch");
      const icon = document.getElementById("themeIcon");
      const label = document.getElementById("themeLabel");

      function apply(theme) {
        if (theme === "light") {
          body.setAttribute("data-theme", "light");
          icon.textContent = "☀️";
          label.textContent = "Mod zi";
        } else {
          body.removeAttribute("data-theme");
          icon.textContent = "🌙";
          label.textContent = "Mod noapte";
        }
      }

      apply(localStorage.getItem(STORAGE_KEY) || "dark");

      switchBtn.addEventListener("click", function () {
        const current = body.getAttribute("data-theme") === "light" ? "light" : "dark";
        const next = current === "light" ? "dark" : "light";
        localStorage.setItem(STORAGE_KEY, next);
        apply(next);
      });
    })();
  </script>
</body>
</html>
