<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lucrul mecanic, puterea mecanică, randamentul | Clasa a VII-a | Fizica Galaction</title>
  <meta name="description" content="Fizica Galaction - Clasa a VII-a, capitolul Lucrul mecanic, puterea mecanică, randamentul. Acces rapid la lecții, fișe de lucru, recapitulare și test final.">
  <style>
    :root{
      --bg:#0f172a;
      --panel:#111c33;
      --text:#f8fafc;
      --muted:#cbd5e1;
      --cyan:#22d3ee;
      --blue:#38bdf8;
      --green:#22c55e;
      --yellow:#facc15;
      --orange:#fb923c;
      --border:rgba(148,163,184,.28);
      --shadow:0 18px 45px rgba(0,0,0,.32);
    }

    *{box-sizing:border-box}

    html{
      min-height:100%;
      background:var(--bg);
    }

    body{
      margin:0;
      min-height:100dvh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(34,211,238,.18), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(34,197,94,.14), transparent 30rem),
        var(--bg);
      display:flex;
      justify-content:center;
      padding:18px;
    }

    .page{
      width:100%;
      max-width:720px;
      min-height:calc(100dvh - 36px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:18px;
    }

    .hero{
      text-align:center;
      background:linear-gradient(180deg, rgba(17,28,51,.96), rgba(15,23,42,.95));
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:22px 18px;
    }

    .brand{
      font-size:clamp(1.9rem, 7vw, 3.6rem);
      line-height:1.03;
      margin:0;
      color:var(--cyan);
      letter-spacing:.02em;
      font-weight:900;
    }

    .subtitle{
      margin:10px 0 0;
      font-size:clamp(1.22rem, 4.8vw, 1.9rem);
      font-weight:850;
      color:#e0f2fe;
    }

    .chapter{
      margin:8px 0 0;
      font-size:clamp(1.04rem, 4vw, 1.25rem);
      color:#dbeafe;
      font-weight:800;
    }

    .motto{
      margin:14px auto 0;
      max-width:560px;
      color:#fef08a;
      font-size:clamp(1rem, 3.8vw, 1.2rem);
      line-height:1.45;
      font-weight:700;
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:13px;
    }

    .big-btn{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      width:100%;
      min-height:68px;
      padding:16px 18px;
      border-radius:19px;
      text-decoration:none;
      color:#082f49;
      background:linear-gradient(135deg, #67e8f9, #38bdf8);
      border:2px solid rgba(186,230,253,.75);
      box-shadow:0 12px 24px rgba(2,132,199,.20);
      font-size:clamp(1.08rem, 4.8vw, 1.42rem);
      font-weight:900;
      line-height:1.18;
      transition:transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }

    .big-btn:active{
      transform:scale(.99);
    }

    .big-btn:hover,
    .big-btn:focus-visible{
      filter:brightness(1.05);
      box-shadow:0 16px 30px rgba(2,132,199,.27);
      outline:none;
    }

    .big-btn.green{
      color:#052e16;
      background:linear-gradient(135deg, #86efac, #22c55e);
      border-color:rgba(187,247,208,.75);
      box-shadow:0 12px 24px rgba(22,163,74,.22);
    }

    .big-btn.yellow{
      color:#422006;
      background:linear-gradient(135deg, #fde68a, #facc15);
      border-color:rgba(254,240,138,.8);
      box-shadow:0 12px 24px rgba(250,204,21,.18);
    }

    .big-btn.orange{
      color:#431407;
      background:linear-gradient(135deg, #fdba74, #fb923c);
      border-color:rgba(254,215,170,.8);
      box-shadow:0 12px 24px rgba(249,115,22,.20);
    }

    .big-btn.muted{
      color:#0f172a;
      background:linear-gradient(135deg, #f8fafc, #cbd5e1);
      border-color:rgba(226,232,240,.9);
      box-shadow:0 12px 24px rgba(148,163,184,.16);
    }

    .left{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
      text-align:left;
    }

    .badge{
      flex:0 0 auto;
      width:42px;
      height:42px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.55);
      color:#082f49;
      font-size:1.2rem;
      font-weight:950;
      border:1px solid rgba(255,255,255,.55);
    }

    .arrow{
      flex:0 0 auto;
      font-size:2.2rem;
      line-height:1;
      font-weight:900;
      opacity:.85;
    }

    .footer{
      text-align:center;
      color:var(--muted);
      font-size:clamp(.95rem, 3.5vw, 1.08rem);
      line-height:1.5;
      padding:10px 4px 2px;
    }

    @media (max-width:420px){
      body{padding:12px}
      .page{min-height:calc(100dvh - 24px); gap:14px}
      .hero{padding:20px 14px; border-radius:22px}
      .big-btn{min-height:64px; padding:14px 15px; border-radius:17px}
      .badge{width:39px; height:39px; border-radius:13px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-label="Introducere">
      <h1 class="brand">Fizica Galaction</h1>
      <p class="subtitle">Lucrul mecanic, puterea mecanică, randamentul</p>
      <p class="chapter">Clasa a VII-a • Capitolul 3</p>
      <p class="motto">„Fizica nu este dominată de formule, ci de logică.”</p>
    </section>

    <nav class="menu" aria-label="Meniu capitol Lucrul mecanic, puterea mecanică, randamentul">
      <a class="big-btn" href="./lectii/">
        <span class="left"><span class="badge">1</span><span>Lecții</span></span>
        <span class="arrow">›</span>
      </a>

      <a class="big-btn orange" href="./fise-de-lucru/">
        <span class="left"><span class="badge">2</span><span>Fișe de lucru</span></span>
        <span class="arrow">›</span>
      </a>

      <a class="big-btn green" href="./recapitulare/">
        <span class="left"><span class="badge">3</span><span>Recapitulare</span></span>
        <span class="arrow">›</span>
      </a>

      <a class="big-btn yellow" href="./test-final/">
        <span class="left"><span class="badge">4</span><span>Test final</span></span>
        <span class="arrow">›</span>
      </a>

      <a class="big-btn muted" href="../">
        <span class="left"><span class="badge">←</span><span>Înapoi la clasa a VII-a</span></span>
        <span class="arrow"> </span>
      </a>
    </nav>

    <footer class="footer">
      <strong>Prof. Dănuț Andronie</strong><br>
      email: danutmg@gmail.com
    </footer>
  </main>
</body>
</html>
