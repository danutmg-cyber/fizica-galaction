<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Energia mecanică | Clasa a VII-a | Fizica Galaction</title>
  <meta name="description" content="Capitolul Energia mecanică, clasa a VII-a: lecții, fișe de lucru, recapitulare și test final.">
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111c33;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --cyan: #22d3ee;
      --cyan-dark: #0891b2;
      --green: #22c55e;
      --green-dark: #16a34a;
      --yellow: #facc15;
      --orange: #fb923c;
      --blue: #60a5fa;
      --white-btn: #e2e8f0;
      --white-btn-text: #0f172a;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(34, 211, 238, 0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.14), transparent 32%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .app {
      width: min(100%, 520px);
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 22px 60px var(--shadow);
    }

    .brand {
      text-align: center;
      margin-bottom: 18px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(2rem, 9vw, 3.4rem);
      line-height: 1.05;
      color: var(--cyan);
      letter-spacing: -0.03em;
    }

    .brand .school {
      margin-top: 8px;
      font-size: 1rem;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .motto {
      margin: 14px auto 0;
      padding: 12px 14px;
      border-left: 5px solid var(--cyan);
      border-radius: 14px;
      background: rgba(34, 211, 238, 0.10);
      color: #e0f2fe;
      font-size: clamp(1rem, 4vw, 1.15rem);
      font-style: italic;
      line-height: 1.35;
    }

    .title-card {
      margin: 18px 0 16px;
      padding: 18px;
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 22px;
      text-align: center;
    }

    .title-card .class {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: clamp(1rem, 4vw, 1.15rem);
      font-weight: 800;
    }

    .title-card h2 {
      margin: 0;
      color: #fef08a;
      font-size: clamp(1.6rem, 7vw, 2.35rem);
      line-height: 1.12;
    }

    .menu {
      display: grid;
      gap: 13px;
      margin-top: 14px;
    }

    .big-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 66px;
      padding: 15px 17px;
      border-radius: 18px;
      border: 2px solid rgba(255, 255, 255, 0.10);
      text-decoration: none;
      color: #082f49;
      background: var(--cyan);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
      transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
    }

    .big-btn:hover,
    .big-btn:focus {
      transform: translateY(-2px);
      filter: brightness(1.04);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
      outline: none;
    }

    .big-btn:active {
      transform: translateY(0);
    }

    .icon {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.36);
      font-size: 1.55rem;
    }

    .label {
      flex: 1;
      font-size: clamp(1.18rem, 5vw, 1.45rem);
      font-weight: 900;
      line-height: 1.18;
    }

    .arrow {
      font-size: 1.4rem;
      font-weight: 900;
    }

    .green {
      background: var(--green);
      color: #052e16;
      border-color: var(--green-dark);
    }

    .yellow {
      background: var(--yellow);
      color: #422006;
      border-color: #eab308;
    }

    .orange {
      background: var(--orange);
      color: #431407;
      border-color: #f97316;
    }

    .blue {
      background: var(--blue);
      color: #0f172a;
      border-color: #3b82f6;
    }

    .light {
      background: var(--white-btn);
      color: var(--white-btn-text);
      border-color: #cbd5e1;
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    @media (max-width: 420px) {
      body {
        padding: 12px;
      }

      .app {
        border-radius: 22px;
        padding: 16px;
      }

      .big-btn {
        min-height: 64px;
        padding: 14px;
      }

      .icon {
        width: 36px;
        height: 36px;
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Capitolul Energia mecanică">
    <header class="brand">
      <h1>Fizica Galaction</h1>
      <div class="school">Clasa a VII-a • Capitolul 4</div>
      <div class="motto">„Fizica nu este dominată de formule, ci de logică.”</div>
    </header>

    <section class="title-card">
      <p class="class">Capitolul</p>
      <h2>Energia mecanică</h2>
    </section>

    <nav class="menu" aria-label="Resursele capitolului">
      <a class="big-btn green" href="./lectii/index.html">
        <span class="icon">📘</span>
        <span class="label">Lecții</span>
        <span class="arrow">›</span>
      </a>

      <a class="big-btn blue" href="./fise-de-lucru/index.html">
        <span class="icon">📝</span>
        <span class="label">Fișe de lucru</span>
        <span class="arrow">›</span>
      </a>

      <a class="big-btn yellow" href="./recapitulare/index.html">
        <span class="icon">🔁</span>
        <span class="label">Recapitulare</span>
        <span class="arrow">›</span>
      </a>

      <a class="big-btn orange" href="./test-final/index.html">
        <span class="icon">✅</span>
        <span class="label">Test final</span>
        <span class="arrow">›</span>
      </a>

      <a class="big-btn light" href="../index.html">
        <span class="icon">⬅️</span>
        <span class="label">Înapoi la clasa a VII-a</span>
        <span class="arrow">›</span>
      </a>
    </nav>

    <footer class="footer">
      Prof. Dănuț Andronie<br>
      danutmg@gmail.com
    </footer>
  </main>
</body>
</html>
