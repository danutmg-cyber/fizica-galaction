<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Test Final – Statica Fluidelor</title>
<style>
body { font-family: Arial; margin: 20px; }
input { width: 80px; }
.correct { color: green; font-weight: bold; }
.wrong { color: red; font-weight: bold; }
button { margin-top: 10px; }
</style>
</head>

<body>
<h2>Test Final – Statica Fluidelor</h2>
<p>Fiecare elev primește valori numerice diferite, iar ordinea întrebărilor este amestecată.</p>

<div id="test"></div>
<button onclick="verifica()">Verifică răspunsurile</button>

<div id="rezultat"></div>
<div id="diploma" style="margin-top:20px;"></div>

<script>
// funcție pentru amestecarea întrebărilor
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

// număr aleator între min și max (inclusiv)
function rnd(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

// definim cele 20 de întrebări cu valori aleatorii
let intrebari = [
    {
        text: () => {
            const m = rnd(1,10);
            return { 
                t: `Calculează greutatea unui corp de masă ${m} kg.`,
                r: (m * 9.8).toFixed(1)
            };
        }
    },
    {
        text: () => {
            const h = rnd(5,20), d = rnd(800,1100);
            return {
                t: `Presiunea exercitată de un lichid cu densitatea ${d} kg/m³ la adâncimea ${h} m este:`,
                r: (d * 9.8 * h).toFixed(0)
            };
        }
    },
    {
        text: () => {
            const F = rnd(10,50), A = rnd(2,10);
            return {
                t: `Un piston exercită o forță de ${F} N pe o suprafață de ${A} cm². Calculează presiunea.`,
                r: (F / (A/10000)).toFixed(0)
            };
        }
    },
    {
        text: () => {
            const ρ = rnd(900,1100), V = rnd(1,5);
            return {
                t: `Determină greutatea unui volum de ${V} m³ de lichid cu densitatea ${ρ} kg/m³.`,
                r: (ρ * V * 9.8).toFixed(0)
            };
        }
    },
    {
        text: () => {
            const h = rnd(1,10);
            return {
                t: `Presiunea hidrostatică într-un lichid crește cu aproximativ 1000 Pa pentru fiecare metru. Estimează presiunea la ${h} m.`,
                r: (h * 1000).toString()
            };
        }
    },
    {
        text: () => {
            const F = rnd(50,200), A = rnd(10,40);
            return {
                t: `O presă hidraulică are o forță de intrare de ${F} N și o suprafață de ${A} cm². Calculează presiunea.`,
                r: (F / (A/10000)).toFixed(0)
            };
        }
    },
    {
        text: () => {
            const ρ = rnd(800,1200);
            return {
                t: `Un lichid are densitatea ${ρ} kg/m³. Care este greutatea unui metru cub?`,
                r: (ρ * 9.8).toFixed(0)
            };
        }
    },
    {
        text: () => {
            const h = rnd(2,15), ρ = rnd(900,1100);
            return {
                t: `Determină presiunea la adâncimea ${h} m într-un lichid cu densitatea ${ρ} kg/m³.`,
                r: (ρ * 9.8 * h).toFixed(0)
            };
        }
    },
    {
        text: () => {
            const F = rnd(20,80), A = rnd(5,20);
            return {
                t: `Un obiect apasă pe sol cu o forță de ${F} N pe o suprafață de ${A} cm². Calculează presiunea.`,
                r: (F / (A/10000)).toFixed(0)
            };
        }
    },
    {
        text: () => {
            const ρ = rnd(850,1100), V = rnd(2,8);
            return {
                t: `Calculează masa unui volum de ${V} m³ de lichid cu densitatea ${ρ} kg/m³.`,
                r: (ρ * V).toFixed(0)
            };
        }
    },
    {
        text: () => {
            const h = rnd(1,20);
            return {
                t: `Presiunea într-un lichid crește cu adâncimea. Estimează presiunea la ${h} m (aprox.).`,
                r: (h * 1000).toString()
            };
        }
    },
    {
        text: () => {
            const F = rnd(100,300), A = rnd(20,50);
            return {
                t: `O presă hidraulică transmite o forță de ${F} N pe o suprafață de ${A} cm². Calculează presiunea.`,
                r: (F / (A/10000)).toFixed(0)
            };
        }
    },
    {
        text: () => {
            const ρ = rnd(900,1100), h = rnd(3,12);
            return {
                t: `Determină presiunea hidrostatică la ${h} m într-un lichid cu densitatea ${ρ} kg/m³.`,
                r: (ρ * 9.8 * h).toFixed(0)
            };
        }
    },
    {
        text: () => {
            const m = rnd(2,15);
            return {
                t: `Calculează greutatea unui corp de ${m} kg.`,
                r: (m * 9.8).toFixed(1)
            };
        }
    },
    {
        text: () => {
            const A = rnd(10,30), F = rnd(50,150);
            return {
                t: `Un obiect apasă cu ${F} N pe o suprafață de ${A} cm². Determină presiunea.`,
                r: (F / (A/10000)).toFixed(0)
            };
        }
    },
    {
        text: () => {
            const ρ = rnd(800,1200);
            return {
                t: `Care este greutatea unui metru cub de lichid cu densitatea ${ρ} kg/m³?`,
                r: (ρ * 9.8).toFixed(0)
            };
        }
    },
    {
        text: () => {
            const h = rnd(1,15), ρ = rnd(900,1100);
            return {
                t: `Calculează presiunea la ${h} m într-un lichid cu densitatea ${ρ} kg/m³.`,
                r: (ρ * 9.8 * h).toFixed(0)
            };
        }
    },
    {
        text: () => {
            const F = rnd(30,90), A = rnd(5,25);
            return {
                t: `Determină presiunea exercitată de o forță de ${F} N pe o suprafață de ${A} cm².`,
                r: (F / (A/10000)).toFixed(0)
            };
        }
    },
    {
        text: () => {
            const ρ = rnd(850,1100), V = rnd(1,6);
            return {
                t: `Calculează greutatea unui volum de ${V} m³ de lichid cu densitatea ${ρ} kg/m³.`,
                r: (ρ * V * 9.8).toFixed(0)
            };
        }
    },
    {
        text: () => {
            const h = rnd(2,18);
            return {
                t: `Estimează presiunea hidrostatică la adâncimea de ${h} m.`,
                r: (h * 1000).toString()
            };
        }
    }
];

// generăm întrebările cu valorile lor
let generate = [];
intrebari.forEach(q => {
    const obj = q.text();
    generate.push({ text: obj.t, raspuns: obj.r });
});

// amestecăm întrebările
shuffle(generate);

// afișăm testul
let html = "";
generate.forEach((q, i) => {
    html += `<p><b>${i+1}.</b> ${q.text}<br>
    Răspuns: <input id="r${i}"></p>`;
});
document.getElementById("test").innerHTML = html;

// funcția de verificare
function verifica() {
    let corecte = 0;
    generate.forEach((q, i) => {
        let user = document.getElementById("r"+i).value.trim();
        if (user === q.raspuns) {
            corecte++;
            document.getElementById("r"+i).className = "correct";
        } else {
            document.getElementById("r"+i).className = "wrong";
        }
    });
    document.getElementById("rezultat").innerHTML =
        `<h3>Ai obținut ${corecte} din 20.</h3>`;
}

// ---------------- DIPLOMA ----------------

// inițializăm contorul de rezolvări
if (!localStorage.getItem("statica_rezolvari")) {
    localStorage.setItem("statica_rezolvari", 0);
}

// funcție pentru generarea diplomei PDF
function genereazaDiploma() {
    const nume = prompt("Introdu numele tău pentru diplomă:");
    if (!nume) return;

    const data = new Date().toLocaleDateString("ro-RO");

    const continut = `
        <html>
        <head><title>Diplomă de Merit</title></head>
        <body style="font-family: Arial; margin:40px;">
            <h1 style="text-align:center;">Diplomă de Merit</h1>
            <p style="text-align:center;">Se acordă elevului</p>
            <h2 style="text-align:center;">${nume}</h2>
            <p style="text-align:center;">
                pentru finalizarea testului „Statica fluidelor” de cel puțin 4 ori.
            </p>
            <p style="text-align:center;">Data: ${data}</p>
        </body>
        </html>
    `;

    const w = window.open("", "_blank");
    w.document.write(continut);
    w.document.close();
    w.focus();
    w.print();
}

// păstrăm funcția veche și o extindem cu logica diplomei
const vecheaVerifica = verifica;

verifica = function() {
    vecheaVerifica();

    let nr = parseInt(localStorage.getItem("statica_rezolvari")) + 1;
    localStorage.setItem("statica_rezolvari", nr);

    if (nr >= 4) {
        document.getElementById("diploma").innerHTML = `
            <h3>Felicitări! Ai rezolvat testul de ${nr} ori.</h3>
            <button onclick="genereazaDiploma()">Descarcă diploma în format PDF</button>
        `;
    } else {
        document.getElementById("diploma").innerHTML =
            \`Ai rezolvat testul de \${nr} ori. Mai ai nevoie de \${4 - nr} rezolvări pentru diplomă.\`;
    }
}
</script>

</body>
</html>
