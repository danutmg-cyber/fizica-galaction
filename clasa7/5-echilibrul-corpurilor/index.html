<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Clasa a VII-a | Echilibrul corpurilor | Fizica Galaction</title>
  <meta name="description" content="Capitolul 5: Echilibrul corpurilor – Fizica Galaction, clasa a VII-a.">
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --card2: #1e293b;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --cyan: #22d3ee;
      --cyan-dark: #0891b2;
      --green: #22c55e;
      --green-dark: #16a34a;
      --yellow: #facc15;
      --blue: #60a5fa;
      --border: rgba(148, 163, 184, 0.32);
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100dvh;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(34, 211, 238, 0.14), transparent 36rem),
        linear-gradient(180deg, #0f172a 0%, #111827 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    }

    .app {
      width: min(100%, 560px);
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: clamp(18px, 4vw, 30px);
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    .brand {
      font-size: clamp(2rem, 8vw, 3.2rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--cyan);
      margin: 0 0 8px;
    }

    .class-label {
      display: inline-block;
      margin: 0 0 12px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(96, 165, 250, 0.15);
      color: #bfdbfe;
      font-size: clamp(0.95rem, 3.4vw, 1.1rem);
      font-weight: 800;
      border: 1px solid rgba(96, 165, 250, 0.35);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 7vw, 2.45rem);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -0.035em;
    }

    .motto {
      margin: 14px auto 0;
      color: #fef3c7;
      font-size: clamp(1rem, 3.8vw, 1.18rem);
      line-height: 1.45;
      max-width: 38ch;
      font-style: italic;
    }

    .menu {
      display: grid;
      gap: 14px;
      margin-top: 24px;
    }

    .big-btn {
      width: 100%;
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
      text-align: center;
      border-radius: 18px;
      border: 2px solid transparent;
      padding: 17px 18px;
      font-size: clamp(1.08rem, 4.6vw, 1.35rem);
      line-height: 1.2;
      font-weight: 900;
      color: #082f49;
      background: linear-gradient(180deg, #67e8f9, #22d3ee);
      box-shadow: 0 10px 22px rgba(34, 211, 238, 0.18);
      transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
    }

    .big-btn:active {
      transform: translateY(1px) scale(0.995);
    }

    .big-btn:hover,
    .big-btn:focus-visible {
      outline: none;
      filter: brightness(1.05);
      box-shadow: 0 14px 28px rgba(34, 211, 238, 0.25);
    }

    .big-btn .icon {
      font-size: 1.35em;
      line-height: 1;
    }

    .big-btn.green {
      background: linear-gradient(180deg, #86efac, var(--green));
      color: #052e16;
      box-shadow: 0 10px 22px rgba(34, 197, 94, 0.17);
    }

    .big-btn.yellow {
      background: linear-gradient(180deg, #fde68a, var(--yellow));
      color: #422006;
      box-shadow: 0 10px 22px rgba(250, 204, 21, 0.16);
    }

    .big-btn.blue {
      background: linear-gradient(180deg, #bfdbfe, var(--blue));
      color: #0f172a;
      box-shadow: 0 10px 22px rgba(96, 165, 250, 0.18);
    }

    .big-btn.gray {
      background: linear-gradient(180deg, #f8fafc, #cbd5e1);
      color: #0f172a;
      box-shadow: 0 10px 22px rgba(203, 213, 225, 0.12);
    }

    .separator {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(203, 213, 225, 0.44), transparent);
      margin: 6px 0;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      color: var(--muted);
      font-size: clamp(0.92rem, 3.2vw, 1rem);
      line-height: 1.45;
    }

    .teacher {
      color: #e0f2fe;
      font-weight: 800;
    }

    @media (max-width: 380px) {
      .app {
        border-radius: 20px;
        padding: 16px 13px;
      }

      .big-btn {
        min-height: 62px;
        border-radius: 16px;
        padding: 15px 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .big-btn {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-labelledby="page-title">
    <header>
      <p class="brand">Fizica Galaction</p>
      <p class="class-label">Clasa a VII-a • Capitolul 5</p>
      <h1 id="page-title">Echilibrul corpurilor</h1>
      <p class="motto">„Fizica nu este dominată de formule, ci de logică.”</p>
    </header>

    <nav class="menu" aria-label="Meniu capitol">
      <a class="big-btn" href="./lectii/index.html">
        <span class="icon">📘</span>
        <span>Lecții</span>
      </a>

      <a class="big-btn blue" href="./fise-de-lucru/index.html">
        <span class="icon">✍️</span>
        <span>Fișe de lucru</span>
      </a>

      <a class="big-btn green" href="./recapitulare/index.html">
        <span class="icon">🔁</span>
        <span>Recapitulare</span>
      </a>

      <a class="big-btn yellow" href="./test-final/index.html">
        <span class="icon">✅</span>
        <span>Test final</span>
      </a>

      <div class="separator" aria-hidden="true"></div>

      <a class="big-btn gray" href="../index.html">
        <span class="icon">⬅️</span>
        <span>Înapoi la clasa a VII-a</span>
      </a>
    </nav>

    <footer>
      <div class="teacher">Prof. Dănuț Andronie</div>
      <div>danutmg@gmail.com</div>
    </footer>
  </main>
</body>
</html>
