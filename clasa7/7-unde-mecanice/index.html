<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Clasa a VII-a | Unde mecanice | Fizica Galaction</title>
  <meta name="description" content="Fizica Galaction – Clasa a VII-a, capitolul Unde mecanice. Acces rapid la lecții, fișe de lucru, recapitulare și test final.">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card2: #111827;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --cyan: #22d3ee;
      --cyan2: #0891b2;
      --green: #22c55e;
      --green2: #16a34a;
      --yellow: #facc15;
      --orange: #fb923c;
      --purple: #a78bfa;
      --border: rgba(148, 163, 184, 0.35);
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(34, 211, 238, 0.18), transparent 32rem),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.10), transparent 28rem),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    }

    main {
      width: min(100%, 560px);
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.96), rgba(15, 23, 42, 0.98));
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .top {
      text-align: center;
      margin-bottom: 18px;
    }

    .school {
      color: var(--cyan);
      font-size: clamp(1.55rem, 6vw, 2.45rem);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: 0.2px;
      margin: 0;
    }

    .class-title {
      margin: 12px 0 0;
      color: var(--text);
      font-size: clamp(1.2rem, 5vw, 1.75rem);
      line-height: 1.15;
      font-weight: 850;
    }

    .chapter {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      font-weight: 700;
    }

    .motto {
      margin: 16px auto 0;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(250, 204, 21, 0.10);
      border: 1px solid rgba(250, 204, 21, 0.28);
      color: #fef3c7;
      font-size: clamp(0.98rem, 3.8vw, 1.15rem);
      line-height: 1.35;
      font-style: italic;
    }

    .menu {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .big-btn {
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      border-radius: 18px;
      border: 2px solid transparent;
      text-decoration: none;
      color: #052e16;
      background: var(--green);
      font-weight: 900;
      font-size: clamp(1.1rem, 4.5vw, 1.35rem);
      line-height: 1.15;
      text-align: center;
      padding: 15px 16px;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
      transition: transform 0.16s ease, filter 0.16s ease, border-color 0.16s ease;
    }

    .big-btn:hover,
    .big-btn:focus {
      transform: translateY(-2px);
      filter: brightness(1.05);
      outline: none;
      border-color: rgba(255, 255, 255, 0.65);
    }

    .big-btn:active {
      transform: translateY(0);
    }

    .cyan {
      background: var(--cyan);
      color: #083344;
    }

    .yellow {
      background: var(--yellow);
      color: #422006;
    }

    .orange {
      background: var(--orange);
      color: #431407;
    }

    .purple {
      background: var(--purple);
      color: #1e1b4b;
    }

    .back {
      margin-top: 4px;
      background: #e2e8f0;
      color: #0f172a;
    }

    .icon {
      font-size: 1.45em;
      line-height: 1;
      flex: 0 0 auto;
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.35;
    }

    @media (max-width: 420px) {
      main {
        border-radius: 22px;
        padding: 18px;
      }

      .big-btn {
        min-height: 62px;
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="top" aria-labelledby="page-title">
      <h1 id="page-title" class="school">Fizica Galaction</h1>
      <p class="class-title">Clasa a VII-a</p>
      <p class="chapter">Capitolul 7 • Unde mecanice</p>
      <p class="motto">„Fizica nu este dominată de formule, ci de logică.”</p>
    </section>

    <nav class="menu" aria-label="Navigare capitol">
      <a class="big-btn cyan" href="./lectii/index.html">
        <span class="icon">📘</span>
        <span>Lecții</span>
      </a>

      <a class="big-btn purple" href="./fise-de-lucru/index.html">
        <span class="icon">📝</span>
        <span>Fișe de lucru</span>
      </a>

      <a class="big-btn yellow" href="./recapitulare/index.html">
        <span class="icon">🔁</span>
        <span>Recapitulare</span>
      </a>

      <a class="big-btn orange" href="./test-final/index.html">
        <span class="icon">✅</span>
        <span>Test final</span>
      </a>

      <a class="big-btn back" href="../index.html">
        <span class="icon">⬅️</span>
        <span>Înapoi la clasa a VII-a</span>
      </a>
    </nav>

    <footer class="footer">
      Prof. Dănuț Andronie • danutmg@gmail.com
    </footer>
  </main>
</body>
</html>
