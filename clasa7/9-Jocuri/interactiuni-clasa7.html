const numberFormat = new Intl.NumberFormat("ro-RO", { maximumFractionDigits: 1 });
const dataSets = Array.from({ length: 30 }, (_, index) => index + 2);

function numeric(build) {
  let previous = -1;
  return () => {
    const offset = previous < 0 ? 0 : 1;
    const index = (previous + 1 + Math.floor(Math.random() * (dataSets.length - offset))) % dataSets.length;
    previous = index;
    const [prompt, result, unit, explanation, alternatives = []] = build(dataSets[index]);
    const values = [result, ...alternatives, result + 1, result - 1, result + 2, result + 3];
    const choices = [...new Set(values.map(value => format(value, unit)))].slice(0, 4);
    return [prompt, choices, 0, explanation];
  };
}

function format(value, unit) {
  return unit ? numberFormat.format(value) + " " + unit : numberFormat.format(value);
}

function shuffle(items) {
  const copy = [...items];
  for (let index = copy.length - 1; index > 0; index -= 1) {
    const other = Math.floor(Math.random() * (index + 1));
    [copy[index], copy[other]] = [copy[other], copy[index]];
  }
  return copy;
}

function playSound(cue) {
  if (!soundEnabled || audio?.state !== "running") return;
  tunes[cue].forEach((frequency, index) => {
    const note = audio.createOscillator();
    const volume = audio.createGain();
    const start = audio.currentTime + index * .095;
    note.type = "sine";
    note.frequency.value = frequency;
    volume.gain.setValueAtTime(.001, start);
    volume.gain.exponentialRampToValueAtTime(.085, start + .025);
    volume.gain.exponentialRampToValueAtTime(.001, start + .15);
    note.connect(volume).connect(audio.destination);
    note.start(start);
    note.stop(start + .16);
  });
}

function updateSound(enabled) {
  soundEnabled = enabled;
  soundButton.textContent = enabled ? "Sunet pornit" : "Sunet oprit";
  soundButton.setAttribute("aria-pressed", String(enabled));
}

if (AudioEngine) {
  soundButton.onclick = async () => {
    updateSound(!soundEnabled);
    if (!soundEnabled) return;
    try {
      audio ??= new AudioEngine();
      await audio.resume();
      playSound("correct");
    } catch {
      updateSound(false);
    }
  };
} else {
  soundButton.hidden = true;

function add(tag, content, parent = game) {
  const element = document.createElement(tag);
  element.textContent = content;
  parent.append(element);
  return element;
}

function action(label, handler) {
  const button = add("button", label);
  button.className = "action";
  button.onclick = handler;
  return button;
}

function heading(label) {
  const element = add("h3", label);
  element.tabIndex = -1;
  element.focus();
}

function showRank() {
  const missionStars = records.slice(0, missions.length).reduce((total, stars) => total + stars, 0);
  const champion = missionStars === missions.length * 3 && records[missions.length] === 3;
  const next = ranks.find(([threshold]) => threshold > missionStars);
  const [, rank] = ranks.filter(([threshold]) => threshold <= missionStars).at(-1);
  const panel = add("div", "");
  panel.className = "rank";
  add("p", "Rangul tău · " + (champion ? "Campion de nota 10" : rank), panel);
  add("p", missionStars + "/" + (missions.length * 3) + " stele în misiuni", panel);
  if (next) add("p", "Încă " + (next[0] - missionStars) + " ★ până la rangul „" + next[1] + "”.", panel);
  else if (!champion) add("p", "Câștigă trei stele în provocarea finală pentru rangul „Campion de nota 10”.", panel);
}

function play(round, firstScore = null) {
  let position = 0;
  const mistakes = [];
  function showQuestion() {
    game.replaceChildren();
    const question = round[position];
    const [prompt, choices, correct, explanation] = typeof question === "function" ? question() : question;
    const order = shuffle(choices.map((_, index) => index));
    add("p", (firstScore === null ? "Întrebare " : "Reluare ") + (position + 1) + " din " + round.length).className = "step";
    const progress = add("progress", "");
    progress.max = round.length;
    progress.value = position;
    progress.setAttribute("aria-label", "Întrebări parcurse");
    heading(prompt);
    const grid = add("div", "");
    grid.className = "choices";
    const buttons = order.map((index, positionInGrid) => {
      const button = add("button", "", grid);
      button.className = "choice";
      add("span", "ABCD"[positionInGrid], button).setAttribute("aria-hidden", "true");
      button.append(document.createTextNode(choices[index]));
      button.onclick = () => {
        buttons.forEach(answer => { answer.disabled = true; });
        buttons[order.indexOf(correct)].classList.add("correct");
        progress.value = position + 1;
        if (index !== correct) {
          mistakes.push(question);
          button.classList.add("wrong");
        }
        playSound(index === correct ? "correct" : "wrong");
        feedback.textContent = (index === correct ? "Corect! " : "Răspuns corect: " + choices[correct] + ". ") + explanation;
        action("Continuă", () => {
          position += 1;
          if (position < round.length) showQuestion();
          else finish(firstScore ?? round.length - mistakes.length, mistakes);
        }).focus();
      };
      return button;
    });
    const feedback = add("p", "");
    feedback.className = "feedback";
    feedback.setAttribute("role", "status");
  }
  showQuestion();
}

function finish(score, mistakes) {
  const stars = mistakes.length === 0 ? 3 : score / currentRound.length >= .75 ? 2 : 1;
  records[activeMission] = Math.max(records[activeMission], stars);
  try { localStorage.setItem(keyPrefix + (activeMission + 1), String(records[activeMission])); } catch {}
  game.replaceChildren();
  heading(stars === 3 ? "Misiune stăpânită!" : "Misiune parcursă");
  add("div", "★".repeat(stars) + "☆".repeat(3 - stars)).className = "stars";
  if (stars === 3) playSound("win");
  add("p", stars + " din 3 stele");
  add("p", score + " din " + currentRound.length + " răspunsuri corecte din prima încercare.");
  showRank();
  if (mistakes.length) action("Reia întrebările greșite", () => play(mistakes, score));
  action("Joacă din nou", () => startMission(activeMission));
  action("Alege altă misiune", showMissions);
  add("p", "Felicitări! Ești tot mai aproape de nota 10").className = "encouragement";
}

function startMission(index) {
  activeMission = index;
  if (index === missions.length) {
    missionHeading.textContent = "Provocarea de nota 10";
    currentRound = shuffle(missions.flatMap(([, items]) => shuffle(items).slice(0, 2)));
  } else {
    const [title, items] = missions[index];
    missionHeading.textContent = "Misiunea " + (index + 1) + " · " + title;
    const firstChallenge = basicCounts[index];
    currentRound = [...shuffle(items.slice(0, firstChallenge)), ...items.slice(firstChallenge)];
  }
  play(currentRound);
}

function showMissions() {
  game.replaceChildren();
  missionHeading.textContent = "Alege o misiune";
  showRank();
  add("p", "Câștigi trei stele când rezolvi corect toate întrebările, inclusiv la reluare.");
  missions.forEach(([title], index) => {
    const stars = records[index];
    action((index + 1) + ". " + title + " · " + stars + "/3 stele", () => startMission(index));
  });
  if (records.slice(0, missions.length).every(stars => stars === 3)) {
    action("Provocarea de nota 10 · " + records[missions.length] + "/3 stele", () => startMission(missions.length));
  } else {
    add("p", "Provocarea de nota 10 se deblochează când ai câte trei stele la fiecare misiune.");
  }
}

showMissions();
</script>
