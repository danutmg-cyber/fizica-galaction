<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Electrostatică | Clasa a VIII-a | Fizica Galaction</title>
  <meta name="description" content="Fizica Galaction - Clasa a VIII-a, capitolul Electrostatică. Alege lecțiile, fișele, recapitularea sau testul final.">
  <style>
    :root{
      --bg:#0f172a;
      --text:#f8fafc;
      --muted:#cbd5e1;
      --cyan:#22d3ee;
      --border:rgba(148,163,184,.28);
      --shadow:0 18px 45px rgba(0,0,0,.35);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:
        radial-gradient(circle at top, rgba(34,211,238,.18), transparent 32rem),
        linear-gradient(180deg,#0f172a 0%,#020617 100%);
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    body{
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
    }

    .page{
      width:100%;
      max-width:560px;
      background:rgba(15,23,42,.82);
      border:1px solid var(--border);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:22px;
    }

    .top{
      text-align:center;
      margin-bottom:18px;
    }

    .school{
      color:var(--cyan);
      font-weight:900;
      letter-spacing:.03em;
      font-size:1rem;
      text-transform:uppercase;
    }

    .prof{
      color:var(--muted);
      font-size:.96rem;
      margin-top:4px;
    }

    .motto{
      margin:14px auto 0;
      padding:10px 12px;
      border-left:4px solid var(--cyan);
      border-radius:12px;
      background:rgba(34,211,238,.08);
      color:#fef9c3;
      font-style:italic;
      line-height:1.35;
      max-width:430px;
    }

    h1{
      margin:18px 0 8px;
      text-align:center;
      color:#e0f2fe;
      font-size:clamp(2rem,8vw,3rem);
      line-height:1.05;
    }

    .subtitle{
      margin:0 0 18px;
      text-align:center;
      color:var(--muted);
      font-size:1.15rem;
      font-weight:700;
    }

    .buttons{
      display:grid;
      gap:12px;
    }

    .big-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      width:100%;
      min-height:64px;
      padding:16px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:linear-gradient(135deg,#0ea5e9,#22d3ee);
      color:#082f49;
      text-decoration:none;
      text-align:center;
      font-size:1.18rem;
      font-weight:900;
      box-shadow:0 10px 24px rgba(14,165,233,.22);
      transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
    }

    .big-btn:hover,
    .big-btn:focus{
      transform:translateY(-2px);
      filter:brightness(1.04);
      box-shadow:0 14px 28px rgba(14,165,233,.28);
      outline:none;
    }

    .big-btn.green{
      background:linear-gradient(135deg,#16a34a,#22c55e);
      color:#052e16;
      box-shadow:0 10px 24px rgba(34,197,94,.22);
    }

    .big-btn.yellow{
      background:linear-gradient(135deg,#eab308,#facc15);
      color:#422006;
      box-shadow:0 10px 24px rgba(250,204,21,.20);
    }

    .big-btn.light{
      background:linear-gradient(135deg,#e2e8f0,#f8fafc);
      color:#0f172a;
      box-shadow:0 10px 24px rgba(226,232,240,.14);
    }

    .footer{
      margin-top:18px;
      text-align:center;
      color:#94a3b8;
      font-size:.95rem;
      line-height:1.45;
    }

    @media (max-width:420px){
      body{padding:12px}
      .page{padding:18px;border-radius:22px}
      .big-btn{font-size:1.08rem;min-height:60px;padding:14px}
      .motto{font-size:.94rem}
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="school">Fizica Galaction</div>
      <div class="prof">Prof. Dănuț Andronie</div>
      <div class="motto">„Fizica nu este dominată de formule, ci de logică.”</div>
    </header>

    <h1>Electrostatică</h1>
    <p class="subtitle">Clasa a VIII-a • Capitolul 2</p>

    <nav class="buttons" aria-label="Secțiuni Electrostatică">
      <a class="big-btn" href="./lectii/">📘 Lecții</a>
      <a class="big-btn" href="./fise-de-lucru/">📝 Fișe de lucru</a>
      <a class="big-btn green" href="./recapitulare/">✅ Recapitulare</a>
      <a class="big-btn yellow" href="./test-final/">🏆 Test final</a>
      <a class="big-btn light" href="../index.html">⬅️ Înapoi la clasa a VIII-a</a>
    </nav>

    <footer class="footer">
      © 2026 • Prof. Dănuț Andronie<br>
      danutmg@gmail.com
    </footer>
  </main>
</body>
</html>
