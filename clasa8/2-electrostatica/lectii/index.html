<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Electrostatică – Lecții | Fizica Galaction</title>
  <meta name="description" content="Lecțiile capitolului Electrostatică – Clasa a VIII-a, Fizica Galaction.">
  <style>
    :root{
      --bg:#0f172a;
      --panel:#111827;
      --panel2:#1e293b;
      --text:#f8fafc;
      --muted:#cbd5e1;
      --cyan:#22d3ee;
      --blue:#38bdf8;
      --green:#22c55e;
      --yellow:#facc15;
      --border:#334155;
      --shadow:0 18px 45px rgba(0,0,0,.35);
    }

    *{box-sizing:border-box}

    html{
      min-height:100%;
      background:var(--bg);
    }

    body{
      margin:0;
      min-height:100dvh;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(34,211,238,.16), transparent 34%),
        radial-gradient(circle at 85% 25%, rgba(34,197,94,.10), transparent 32%),
        linear-gradient(180deg, #0f172a 0%, #111827 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
    }

    .page{
      width:100%;
      max-width:720px;
      min-height:calc(100dvh - 36px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:16px;
    }

    .hero{
      text-align:center;
      background:rgba(15,23,42,.78);
      border:1px solid rgba(148,163,184,.22);
      border-radius:24px;
      padding:24px 18px 20px;
      box-shadow:var(--shadow);
    }

    .school{
      color:var(--cyan);
      font-size:clamp(1.35rem, 5vw, 2.2rem);
      font-weight:900;
      letter-spacing:.02em;
      margin:0 0 6px;
      line-height:1.12;
    }

    .subtitle{
      margin:0;
      color:var(--muted);
      font-size:clamp(1rem, 3.5vw, 1.25rem);
      font-weight:700;
    }

    .chapter{
      margin:12px 0 0;
      color:#e0f2fe;
      font-size:clamp(1.25rem, 4.3vw, 1.65rem);
      font-weight:900;
      line-height:1.16;
    }

    .motto{
      margin:16px auto 0;
      max-width:620px;
      color:#fef08a;
      background:rgba(250,204,21,.08);
      border-left:4px solid var(--yellow);
      border-radius:14px;
      padding:12px 14px;
      font-size:clamp(.98rem, 3.3vw, 1.13rem);
      font-weight:650;
      line-height:1.35;
    }

    .buttons{
      display:grid;
      gap:13px;
      width:100%;
    }

    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      width:100%;
      min-height:66px;
      padding:17px 18px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.16);
      text-decoration:none;
      color:#052e16;
      background:linear-gradient(180deg, #4ade80, #22c55e);
      box-shadow:0 10px 22px rgba(34,197,94,.18);
      font-size:clamp(1.08rem, 4.2vw, 1.34rem);
      font-weight:900;
      text-align:center;
      line-height:1.18;
      -webkit-tap-highlight-color:transparent;
      transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
    }

    .btn:focus-visible{
      outline:4px solid rgba(34,211,238,.7);
      outline-offset:3px;
    }

    .btn:hover{
      transform:translateY(-1px);
      filter:brightness(1.04);
      box-shadow:0 14px 28px rgba(34,197,94,.22);
    }

    .btn.lesson{
      color:#082f49;
      background:linear-gradient(180deg, #67e8f9, #22d3ee);
      box-shadow:0 10px 22px rgba(34,211,238,.16);
    }

    .btn.recap{
      color:#111827;
      background:linear-gradient(180deg, #fde68a, #facc15);
      box-shadow:0 10px 22px rgba(250,204,21,.15);
    }

    .btn.test{
      color:#fff7ed;
      background:linear-gradient(180deg, #fb923c, #ea580c);
      box-shadow:0 10px 22px rgba(234,88,12,.18);
    }

    .btn.back{
      color:#0f172a;
      background:linear-gradient(180deg, #e2e8f0, #cbd5e1);
      box-shadow:0 10px 22px rgba(203,213,225,.12);
    }

    .number{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
      width:34px;
      height:34px;
      border-radius:999px;
      background:rgba(15,23,42,.16);
      border:1px solid rgba(15,23,42,.18);
      font-size:.96em;
      font-weight:1000;
    }

    .footer{
      text-align:center;
      color:#94a3b8;
      font-size:.95rem;
      line-height:1.35;
      padding:4px 0 0;
    }

    @media (max-width:420px){
      body{padding:12px}
      .page{min-height:calc(100dvh - 24px); gap:12px}
      .hero{border-radius:20px; padding:20px 14px 16px}
      .btn{min-height:62px; border-radius:16px; padding:15px 14px}
      .number{width:31px;height:31px}
    }

    @media (min-width:800px){
      .page{max-width:760px}
      .buttons{gap:15px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="titlu">
      <h1 class="school" id="titlu">Fizica Galaction</h1>
      <p class="subtitle">Clasa a VIII-a • Lecții</p>
      <div class="chapter">Electrostatică</div>
      <div class="motto">„Fizica nu este dominată de formule, ci de logică.”</div>
    </section>

    <nav class="buttons" aria-label="Lecțiile capitolului Electrostatică">
      <a class="btn lesson" href="./lectia-1.html"><span class="number">1</span> Electrizarea, sarcina electrică</a>
      <a class="btn lesson" href="./lectia-2.html"><span class="number">2</span> Interacțiunea corpurilor electrizate</a>
      <a class="btn lesson" href="./lectia-3.html"><span class="number">3</span> Legea lui Coulomb</a>

      <a class="btn recap" href="../recapitulare/index.html">Recapitulare</a>
      <a class="btn test" href="../test-final/index.html">Test final</a>
      <a class="btn back" href="../index.html">Înapoi la capitol</a>
    </nav>

    <footer class="footer">
      Prof. Dănuț Andronie • danutmg@gmail.com
    </footer>
  </main>
</body>
</html>
