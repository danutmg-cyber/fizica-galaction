<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Electrocinetică | Clasa a VIII-a | Fizica Galaction</title>
  <meta name="description" content="Capitolul Electrocinetică pentru clasa a VIII-a – lecții, fișe de lucru, recapitulare și test final.">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card2: #111827;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --cyan: #22d3ee;
      --blue: #38bdf8;
      --green: #22c55e;
      --green2: #16a34a;
      --yellow: #facc15;
      --border: #334155;
      --shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(34, 211, 238, .14), transparent 34rem),
        linear-gradient(180deg, #0f172a 0%, #111827 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    main {
      width: min(100%, 560px);
    }

    .panel {
      background: rgba(30, 41, 59, .92);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: clamp(20px, 5vw, 34px);
    }

    .school {
      text-align: center;
      color: var(--cyan);
      font-weight: 800;
      font-size: clamp(1rem, 3.8vw, 1.25rem);
      letter-spacing: .02em;
      margin-bottom: 6px;
    }

    .prof {
      text-align: center;
      color: var(--muted);
      font-weight: 700;
      font-size: clamp(.9rem, 3.2vw, 1rem);
      margin-bottom: 14px;
    }

    .motto {
      background: rgba(250, 204, 21, .08);
      border-left: 4px solid var(--cyan);
      color: #fef3c7;
      border-radius: 14px;
      padding: 12px 14px;
      text-align: center;
      font-size: clamp(.95rem, 3.4vw, 1.05rem);
      font-style: italic;
      line-height: 1.45;
      margin-bottom: 22px;
    }

    h1 {
      text-align: center;
      margin: 0;
      color: var(--blue);
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1.08;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: clamp(1.05rem, 4.2vw, 1.25rem);
      font-weight: 700;
      margin: 10px 0 24px;
    }

    .menu {
      display: grid;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      width: 100%;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,.08);
      padding: 16px 18px;
      text-decoration: none;
      text-align: center;
      font-size: clamp(1.1rem, 4.8vw, 1.35rem);
      font-weight: 900;
      line-height: 1.25;
      color: #052e16;
      background: linear-gradient(180deg, #4ade80, var(--green));
      box-shadow: 0 10px 22px rgba(34, 197, 94, .22);
      transition: transform .15s ease, filter .15s ease;
    }

    .btn:focus-visible,
    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
      outline: 3px solid rgba(34, 211, 238, .35);
      outline-offset: 2px;
    }

    .btn.secondary {
      color: #082f49;
      background: linear-gradient(180deg, #67e8f9, #22d3ee);
      box-shadow: 0 10px 22px rgba(34, 211, 238, .2);
    }

    .btn.yellow {
      color: #422006;
      background: linear-gradient(180deg, #fde68a, var(--yellow));
      box-shadow: 0 10px 22px rgba(250, 204, 21, .18);
    }

    .btn.light {
      color: #0f172a;
      background: linear-gradient(180deg, #f8fafc, #cbd5e1);
      box-shadow: 0 10px 22px rgba(203, 213, 225, .15);
    }

    .footer {
      text-align: center;
      color: #94a3b8;
      font-size: .95rem;
      margin-top: 18px;
      line-height: 1.4;
    }

    @media (max-width: 420px) {
      body {
        padding: 12px;
        align-items: stretch;
      }

      main {
        display: flex;
        align-items: center;
      }

      .panel {
        width: 100%;
        border-radius: 22px;
        padding: 18px;
      }

      .btn {
        min-height: 62px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-label="Capitolul Electrocinetică">
      <div class="school">Fizica Galaction</div>
      <div class="prof">Clasa a VIII-a • Capitolul 3</div>

      <div class="motto">„Fizica nu este dominată de formule, ci de logică.”</div>

      <h1>Electrocinetică</h1>
      <div class="subtitle">Circuite electrice și curent electric</div>

      <nav class="menu" aria-label="Navigare capitol">
        <a class="btn" href="./lectii/index.html">Lecții</a>
        <a class="btn secondary" href="./fise-de-lucru/index.html">Fișe de lucru</a>
        <a class="btn yellow" href="./recapitulare/index.html">Recapitulare</a>
        <a class="btn yellow" href="./test-final/index.html">Test final</a>
        <a class="btn light" href="../index.html">Înapoi la clasa a VIII-a</a>
      </nav>

      <div class="footer">
        Prof. Dănuț Andronie<br>
        danutmg@gmail.com
      </div>
    </section>
  </main>
</body>
</html>
