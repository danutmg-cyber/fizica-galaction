<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reflexia și refracția | Clasa a VIII-a | Fizica Galaction</title>
  <meta name="description" content="Pagina capitolului Reflexia și refracția, clasa a VIII-a, Fizica Galaction.">
  <style>
    :root {
      --bg: #0f172a;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --cyan: #22d3ee;
      --blue: #38bdf8;
      --border: rgba(148, 163, 184, 0.35);
      --shadow: 0 18px 45px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--bg); }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(34, 211, 238, 0.18), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.14), transparent 28rem),
        var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .page {
      width: min(720px, 100%);
      min-height: calc(100dvh - 36px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }

    .hero {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 22px 18px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .school {
      color: var(--cyan);
      font-weight: 900;
      font-size: clamp(1rem, 3.6vw, 1.35rem);
      line-height: 1.25;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .teacher {
      margin-top: 6px;
      color: var(--muted);
      font-size: clamp(0.95rem, 3.2vw, 1.08rem);
      font-weight: 700;
    }

    .motto {
      margin: 14px auto 0;
      max-width: 560px;
      color: #fef08a;
      font-style: italic;
      font-weight: 700;
      font-size: clamp(0.95rem, 3.4vw, 1.08rem);
      line-height: 1.35;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(250, 204, 21, 0.10);
      border-left: 5px solid var(--cyan);
    }

    .title-card {
      text-align: center;
      padding: 4px 8px;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(2rem, 8.4vw, 3.6rem);
      line-height: 1.03;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--blue);
      font-weight: 900;
      font-size: clamp(1.15rem, 4.8vw, 1.8rem);
    }

    .button-list {
      display: grid;
      gap: 13px;
    }

    .big-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      min-height: 68px;
      padding: 16px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.16);
      color: #061018;
      text-decoration: none;
      font-weight: 950;
      font-size: clamp(1.08rem, 4.4vw, 1.45rem);
      line-height: 1.15;
      box-shadow: 0 12px 28px rgba(0,0,0,0.26);
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
    }

    .big-button:active {
      transform: translateY(2px) scale(0.99);
      box-shadow: 0 8px 18px rgba(0,0,0,0.24);
    }

    .big-button:hover,
    .big-button:focus {
      filter: brightness(1.04);
      outline: 3px solid rgba(255,255,255,0.32);
      outline-offset: 2px;
    }

    .big-button .icon {
      font-size: 1.55em;
      flex: 0 0 auto;
    }

    .big-button .arrow {
      font-size: 1.35em;
      flex: 0 0 auto;
      opacity: 0.88;
    }

    .primary { background: linear-gradient(135deg, #22c55e, #86efac); }
    .secondary { background: linear-gradient(135deg, #38bdf8, #bae6fd); }
    .accent { background: linear-gradient(135deg, #facc15, #fde68a); }
    .danger { background: linear-gradient(135deg, #fb923c, #fed7aa); }
    .back { background: linear-gradient(135deg, #e2e8f0, #ffffff); color: #0f172a; }

    .footer {
      color: var(--muted);
      text-align: center;
      font-size: clamp(0.9rem, 3vw, 1rem);
      line-height: 1.45;
      padding: 4px 10px 0;
    }

    .footer strong { color: var(--cyan); }

    @media (min-width: 760px) {
      .button-list { grid-template-columns: 1fr 1fr; }
      .big-button.full { grid-column: 1 / -1; }
    }

    @media (max-height: 720px) {
      body { align-items: flex-start; }
      .page { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-label="Fizica Galaction">
      <div class="school">Școala Gimnazială „Gala Galaction” Mangalia</div>
      <div class="teacher">Prof. Dănuț Andronie</div>
      <div class="motto">„Fizica nu este dominată de formule, ci de logică.”</div>
    </section>

    <section class="title-card" aria-label="Titlul capitolului">
      <h1>Clasa a VIII-a</h1>
      <p class="subtitle">6. Reflexia și refracția</p>
    </section>

    <nav class="button-list" aria-label="Resursele capitolului">
      <a class="big-button primary full" href="./lectii/index.html">
        <span class="icon">📘</span>
        <span>Lecții</span>
        <span class="arrow">›</span>
      </a>

      <a class="big-button secondary" href="./fise-de-lucru/index.html">
        <span class="icon">✍️</span>
        <span>Fișe de lucru</span>
        <span class="arrow">›</span>
      </a>

      <a class="big-button accent" href="./recapitulare/index.html">
        <span class="icon">🔁</span>
        <span>Recapitulare</span>
        <span class="arrow">›</span>
      </a>

      <a class="big-button danger full" href="./test-final/index.html">
        <span class="icon">✅</span>
        <span>Test final</span>
        <span class="arrow">›</span>
      </a>

      <a class="big-button back full" href="../index.html">
        <span class="icon">⬅️</span>
        <span>Înapoi la clasa a VIII-a</span>
        <span class="arrow">›</span>
      </a>
    </nav>

    <footer class="footer">
      <strong>Fizica Galaction</strong><br>
      danutmg@gmail.com
    </footer>
  </main>
</body>
</html>
