<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 500"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Conservarea energiei mecanice</title>
  <desc id="desc">
    Ilustrație schematică a aruncării verticale: corpul urcă, atinge înălțimea maximă,
    coboară și ajunge la nivelul de referință h egal cu zero. Energia mecanică se conservă.
  </desc>

  <defs>
    <linearGradient id="ballGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="energyGradient" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020617" flood-opacity="0.35"/>
    </filter>

    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>

    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>

    <style>
      .label {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        font-weight: 700;
        fill: #f8fafc;
      }
      .small {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        font-weight: 650;
        fill: #cbd5e1;
      }
      .math {
        font-family: "Cambria Math", "STIX Two Math", Georgia, serif;
        font-style: italic;
        fill: #e2e8f0;
      }
      .muted-line {
        stroke: #64748b;
        stroke-width: 2;
        stroke-dasharray: 7 9;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Fundal transparent. Halo discret pentru lizibilitate pe card dark. -->
  <g id="scene-halo" opacity="0.28">
    <ellipse cx="400" cy="450" rx="300" ry="22" fill="#0ea5e9"/>
    <ellipse cx="400" cy="245" rx="185" ry="210" fill="#0f172a" opacity="0.32"/>
  </g>

  <!-- Nivelul de referință -->
  <g id="reference-level">
    <line x1="105" y1="420" x2="695" y2="420"
          stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="118" y1="425" x2="682" y2="425"
          stroke="#334155" stroke-width="2" stroke-dasharray="3 9"/>
    <rect x="610" y="384" width="86" height="28" rx="14"
          fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="653" y="404" text-anchor="middle" class="math" font-size="18">h = 0</text>
  </g>

  <!-- Traiectoria verticală unică -->
  <g id="trajectory">
    <line x1="400" y1="400" x2="400" y2="95"
          class="muted-line" opacity="0.85"/>
    <path d="M 372 355 C 344 300 344 218 374 162"
          fill="none" stroke="#22d3ee" stroke-width="5"
          stroke-linecap="round" marker-end="url(#arrowCyan)"
          opacity="0.92"/>
    <path d="M 426 160 C 458 224 458 304 428 354"
          fill="none" stroke="#34d399" stroke-width="5"
          stroke-linecap="round" marker-end="url(#arrowGreen)"
          opacity="0.92"/>
  </g>

  <!-- Înălțimea maximă -->
  <g id="state-hmax">
    <line x1="270" y1="108" x2="530" y2="108"
          stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 7" opacity="0.72"/>
    <circle id="ball-hmax" cx="400" cy="108" r="29"
            fill="url(#ballGradient)" stroke="#cffafe" stroke-width="3"
            filter="url(#softGlow)"/>
    <circle cx="390" cy="98" r="8" fill="#ecfeff" opacity="0.72"/>

    <rect x="449" y="67" width="134" height="68" rx="16"
          fill="#111827" fill-opacity="0.92"
          stroke="#fbbf24" stroke-width="2"/>
    <text x="516" y="92" text-anchor="middle" class="label" font-size="17">h max</text>
    <text x="516" y="117" text-anchor="middle" class="math" font-size="20">v = 0</text>

    <g id="potential-energy-max" transform="translate(222 73)">
      <rect width="18" height="58" rx="9" fill="#1e293b" stroke="#475569"/>
      <rect x="2" y="2" width="14" height="54" rx="7" fill="#fbbf24"/>
      <text x="-10" y="76" class="small" font-size="13">Eₚ max</text>
    </g>
  </g>

  <!-- Corpul urcă -->
  <g id="state-up" filter="url(#shadow)">
    <circle id="ball-up" cx="365" cy="253" r="24"
            fill="url(#ballGradient)" stroke="#cffafe" stroke-width="2.5"/>
    <circle cx="357" cy="245" r="6" fill="#ecfeff" opacity="0.7"/>

    <line id="velocity-up" x1="322" y1="286" x2="322" y2="220"
          stroke="#22d3ee" stroke-width="5" stroke-linecap="round"
          marker-end="url(#arrowCyan)"/>
    <text x="296" y="258" text-anchor="middle" class="math"
          font-size="22" fill="#67e8f9">v</text>

    <rect x="147" y="226" width="137" height="52" rx="15"
          fill="#0f172a" fill-opacity="0.9" stroke="#22d3ee" stroke-width="1.8"/>
    <text x="215" y="248" text-anchor="middle" class="label" font-size="15">CORPUL</text>
    <text x="215" y="268" text-anchor="middle" class="label" font-size="15"
          fill="#67e8f9">URCĂ</text>
  </g>

  <!-- Corpul coboară -->
  <g id="state-down" filter="url(#shadow)">
    <circle id="ball-down" cx="435" cy="253" r="24"
            fill="url(#ballGradient)" stroke="#cffafe" stroke-width="2.5"/>
    <circle cx="427" cy="245" r="6" fill="#ecfeff" opacity="0.7"/>

    <line id="velocity-down" x1="478" y1="220" x2="478" y2="286"
          stroke="#34d399" stroke-width="5" stroke-linecap="round"
          marker-end="url(#arrowGreen)"/>
    <text x="505" y="258" text-anchor="middle" class="math"
          font-size="22" fill="#6ee7b7">v</text>

    <rect x="516" y="226" width="137" height="52" rx="15"
          fill="#0f172a" fill-opacity="0.9" stroke="#34d399" stroke-width="1.8"/>
    <text x="584" y="248" text-anchor="middle" class="label" font-size="15">CORPUL</text>
    <text x="584" y="268" text-anchor="middle" class="label" font-size="15"
          fill="#6ee7b7">COBOARĂ</text>
  </g>

  <!-- h măsurat față de nivelul zero -->
  <g id="height-indicator">
    <line x1="262" y1="116" x2="262" y2="416"
          stroke="#fbbf24" stroke-width="2" opacity="0.65"/>
    <line x1="252" y1="116" x2="272" y2="116" stroke="#fbbf24" stroke-width="2"/>
    <line x1="252" y1="416" x2="272" y2="416" stroke="#fbbf24" stroke-width="2"/>
    <rect x="225" y="253" width="52" height="30" rx="15"
          fill="#422006" fill-opacity="0.92" stroke="#fbbf24"/>
    <text x="251" y="274" text-anchor="middle" class="math" font-size="20"
          fill="#fde68a">h</text>
  </g>

  <!-- Starea la h = 0 -->
  <g id="state-h0">
    <circle id="ball-h0" cx="400" cy="404" r="27"
            fill="url(#ballGradient)" stroke="#cffafe" stroke-width="3"
            filter="url(#softGlow)"/>
    <circle cx="391" cy="395" r="7" fill="#ecfeff" opacity="0.72"/>

    <line id="velocity-h0" x1="450" y1="361" x2="450" y2="414"
          stroke="#34d399" stroke-width="6" stroke-linecap="round"
          marker-end="url(#arrowGreen)"/>

    <rect x="475" y="345" width="154" height="60" rx="16"
          fill="#111827" fill-opacity="0.92"
          stroke="#34d399" stroke-width="2"/>
    <text x="552" y="368" text-anchor="middle" class="label" font-size="15">LA h = 0</text>
    <text x="552" y="390" text-anchor="middle" class="math" font-size="18">v = v max</text>

    <g id="kinetic-energy-max" transform="translate(150 344)">
      <rect width="18" height="58" rx="9" fill="#1e293b" stroke="#475569"/>
      <rect x="2" y="2" width="14" height="54" rx="7" fill="#34d399"/>
      <text x="-9" y="76" class="small" font-size="13">E꜀ max</text>
    </g>
  </g>

  <!-- Mesajul vizual central -->
  <g id="energy-conservation-badge">
    <rect x="293" y="301" width="214" height="42" rx="21"
          fill="#0b1220" fill-opacity="0.94"
          stroke="url(#energyGradient)" stroke-width="2"/>
    <circle cx="316" cy="322" r="7" fill="#fbbf24"/>
    <circle cx="484" cy="322" r="7" fill="#34d399"/>
    <text x="400" y="328" text-anchor="middle"
          class="label" font-size="17">Eₘ = constantă</text>
  </g>
</svg>
