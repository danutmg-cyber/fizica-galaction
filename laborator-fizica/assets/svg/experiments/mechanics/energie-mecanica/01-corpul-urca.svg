<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 500"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Corpul urcă</title>
  <desc id="desc">
    Corp aruncat vertical în sus. Viteza este orientată în sus și scade,
    înălțimea și energia potențială cresc, energia cinetică scade,
    iar energia mecanică rămâne constantă.
  </desc>

  <defs>
    <linearGradient id="ballGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="0.25" stop-color="#67e8f9"/>
      <stop offset="0.68" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="upGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".7"/>
    </linearGradient>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="7" stdDeviation="8"
                    flood-color="#020617" flood-opacity=".42"/>
    </filter>

    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22d3ee"/>
    </marker>

    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fbbf24"/>
    </marker>

    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#34d399"/>
    </marker>

    <style>
      .ui {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        fill: #f8fafc;
      }
      .label {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        font-weight: 750;
        fill: #f8fafc;
      }
      .muted {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        font-weight: 600;
        fill: #cbd5e1;
      }
      .math {
        font-family: "Cambria Math", "STIX Two Math", Georgia, serif;
        font-style: italic;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Fundal transparent; halo pentru lizibilitate pe card dark -->
  <g id="scene-halo">
    <ellipse cx="390" cy="454" rx="285" ry="23" fill="#0ea5e9" opacity=".18"/>
    <ellipse cx="390" cy="265" rx="210" ry="205" fill="#0f172a" opacity=".23"/>
  </g>

  <!-- Nivel de referință h = 0 -->
  <g id="reference-level">
    <line x1="90" y1="425" x2="710" y2="425"
          stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="431" x2="690" y2="431"
          stroke="#334155" stroke-width="2" stroke-dasharray="4 10"/>
    <rect x="617" y="388" width="89" height="29" rx="14.5"
          fill="#0f172a" fill-opacity=".94"
          stroke="#64748b" stroke-width="1.5"/>
    <text x="661.5" y="408.5" text-anchor="middle"
          class="math" font-size="18">h = 0</text>
  </g>

  <!-- Poziția maximă viitoare, doar ca reper -->
  <g id="hmax-reference" opacity=".72">
    <line x1="302" y1="88" x2="520" y2="88"
          stroke="#fbbf24" stroke-width="2"
          stroke-dasharray="6 8"/>
    <circle cx="405" cy="88" r="15"
            fill="#fbbf24" fill-opacity=".09"
            stroke="#fbbf24" stroke-width="2"
            stroke-dasharray="4 5"/>
    <text x="540" y="94" class="math" font-size="18"
          fill="#fde68a">h max</text>
  </g>

  <!-- Traiectoria de urcare -->
  <g id="ascending-path">
    <line x1="405" y1="403" x2="405" y2="116"
          stroke="#475569" stroke-width="2"
          stroke-dasharray="7 10" stroke-linecap="round"/>
    <path d="M 377 390 C 344 337, 343 264, 379 197 C 388 181, 396 167, 401 150"
          fill="none" stroke="url(#upGlow)" stroke-width="15"
          stroke-linecap="round" opacity=".75"/>
    <path d="M 376 376 C 349 330, 351 267, 378 216"
          fill="none" stroke="#22d3ee" stroke-width="5"
          stroke-linecap="round" marker-end="url(#arrowCyan)"/>
  </g>

  <!-- Corpul în urcare -->
  <g id="ascending-body" filter="url(#shadow)">
    <circle id="body" cx="405" cy="238" r="34"
            fill="url(#ballGradient)"
            stroke="#cffafe" stroke-width="3"/>
    <circle cx="393" cy="226" r="9"
            fill="#ffffff" opacity=".62"/>
    <ellipse cx="405" cy="276" rx="28" ry="7"
             fill="#020617" opacity=".28"/>
  </g>

  <!-- Vectorul vitezei -->
  <g id="velocity-vector">
    <line x1="474" y1="264" x2="474" y2="166"
          stroke="#22d3ee" stroke-width="6"
          stroke-linecap="round"
          marker-end="url(#arrowCyan)"/>
    <rect x="493" y="184" width="92" height="37" rx="18.5"
          fill="#082f49" fill-opacity=".92"
          stroke="#22d3ee" stroke-width="1.6"/>
    <text x="539" y="209" text-anchor="middle"
          class="math" font-size="20" fill="#67e8f9">v ↑</text>
  </g>

  <!-- Accelerația gravitațională -->
  <g id="gravity-vector">
    <line x1="330" y1="202" x2="330" y2="280"
          stroke="#fbbf24" stroke-width="5"
          stroke-linecap="round"
          marker-end="url(#arrowAmber)"/>
    <text x="306" y="247" text-anchor="middle"
          class="math" font-size="20" fill="#fde68a">g</text>
  </g>

  <!-- Înălțimea curentă -->
  <g id="height-indicator">
    <line x1="225" y1="238" x2="225" y2="421"
          stroke="#fbbf24" stroke-width="2.3"/>
    <line x1="215" y1="238" x2="235" y2="238"
          stroke="#fbbf24" stroke-width="2.3"/>
    <line x1="215" y1="421" x2="235" y2="421"
          stroke="#fbbf24" stroke-width="2.3"/>
    <rect x="193" y="315" width="64" height="34" rx="17"
          fill="#422006" fill-opacity=".92"
          stroke="#fbbf24"/>
    <text x="225" y="338" text-anchor="middle"
          class="math" font-size="21" fill="#fde68a">h ↑</text>
  </g>

  <!-- Eticheta stării -->
  <g id="state-label">
    <rect x="278" y="25" width="254" height="48" rx="24"
          fill="#0b1220" fill-opacity=".94"
          stroke="#22d3ee" stroke-width="2"/>
    <circle cx="306" cy="49" r="7" fill="#22d3ee"/>
    <text x="414" y="56" text-anchor="middle"
          class="label" font-size="20">CORPUL URCĂ</text>
  </g>

  <!-- Transformarea energiilor -->
  <g id="energy-trend">
    <rect x="523" y="285" width="202" height="118" rx="20"
          fill="#0b1220" fill-opacity=".92"
          stroke="#334155" stroke-width="1.8"/>

    <text x="547" y="313" class="muted" font-size="14">În timpul urcării</text>

    <circle cx="551" cy="341" r="7" fill="#fbbf24"/>
    <text x="570" y="347" class="math" font-size="19"
          fill="#fde68a">Eₚ ↑</text>

    <circle cx="643" cy="341" r="7" fill="#22d3ee"/>
    <text x="662" y="347" class="math" font-size="19"
          fill="#67e8f9">E꜀ ↓</text>

    <line x1="548" y1="366" x2="701" y2="366"
          stroke="#334155" stroke-width="1"/>

    <circle cx="551" cy="385" r="7" fill="#34d399"/>
    <text x="570" y="391" class="math" font-size="18"
          fill="#6ee7b7">Eₘ = constantă</text>
  </g>
</svg>
