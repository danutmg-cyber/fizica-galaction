<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 500"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Corpul coboară</title>
  <desc id="desc">
    Corp aflat în coborâre verticală. Viteza este orientată în jos și crește,
    înălțimea și energia potențială scad, energia cinetică crește,
    iar energia mecanică rămâne constantă.
  </desc>

  <defs>
    <linearGradient id="ballGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="0.25" stop-color="#6ee7b7"/>
      <stop offset="0.68" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="downGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#059669" stop-opacity="0"/>
      <stop offset="1" stop-color="#34d399" stop-opacity=".72"/>
    </linearGradient>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="7" stdDeviation="8"
                    flood-color="#020617" flood-opacity=".42"/>
    </filter>

    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#34d399"/>
    </marker>

    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fbbf24"/>
    </marker>

    <style>
      .label {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        font-weight: 750;
        fill: #f8fafc;
      }
      .muted {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        font-weight: 600;
        fill: #cbd5e1;
      }
      .math {
        font-family: "Cambria Math", "STIX Two Math", Georgia, serif;
        font-style: italic;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Fundal transparent; halo discret pentru tema dark -->
  <g id="scene-halo">
    <ellipse cx="410" cy="454" rx="285" ry="23" fill="#10b981" opacity=".15"/>
    <ellipse cx="410" cy="265" rx="210" ry="205" fill="#0f172a" opacity=".23"/>
  </g>

  <!-- Nivel de referință h = 0 -->
  <g id="reference-level">
    <line x1="90" y1="425" x2="710" y2="425"
          stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="431" x2="690" y2="431"
          stroke="#334155" stroke-width="2" stroke-dasharray="4 10"/>
    <rect x="617" y="388" width="89" height="29" rx="14.5"
          fill="#0f172a" fill-opacity=".94"
          stroke="#64748b" stroke-width="1.5"/>
    <text x="661.5" y="408.5" text-anchor="middle"
          class="math" font-size="18">h = 0</text>
  </g>

  <!-- Înălțimea maximă, ca reper al coborârii -->
  <g id="hmax-reference" opacity=".72">
    <line x1="280" y1="88" x2="498" y2="88"
          stroke="#fbbf24" stroke-width="2"
          stroke-dasharray="6 8"/>
    <circle cx="395" cy="88" r="15"
            fill="#fbbf24" fill-opacity=".09"
            stroke="#fbbf24" stroke-width="2"
            stroke-dasharray="4 5"/>
    <text x="518" y="94" class="math" font-size="18"
          fill="#fde68a">h max</text>
  </g>

  <!-- Traiectoria de coborâre -->
  <g id="descending-path">
    <line x1="395" y1="116" x2="395" y2="403"
          stroke="#475569" stroke-width="2"
          stroke-dasharray="7 10" stroke-linecap="round"/>
    <path d="M 421 150 C 432 189, 446 230, 448 273 C 451 326, 431 365, 410 393"
          fill="none" stroke="url(#downGlow)" stroke-width="15"
          stroke-linecap="round" opacity=".75"/>
    <path d="M 421 145 C 444 190, 446 252, 420 302"
          fill="none" stroke="#34d399" stroke-width="5"
          stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- Corpul în coborâre -->
  <g id="descending-body" filter="url(#shadow)">
    <circle id="body" cx="395" cy="244" r="34"
            fill="url(#ballGradient)"
            stroke="#d1fae5" stroke-width="3"/>
    <circle cx="383" cy="232" r="9"
            fill="#ffffff" opacity=".62"/>
    <ellipse cx="395" cy="282" rx="28" ry="7"
             fill="#020617" opacity=".28"/>
  </g>

  <!-- Vectorul vitezei -->
  <g id="velocity-vector">
    <line x1="466" y1="208" x2="466" y2="318"
          stroke="#34d399" stroke-width="6"
          stroke-linecap="round"
          marker-end="url(#arrowGreen)"/>
    <rect x="486" y="252" width="92" height="37" rx="18.5"
          fill="#052e16" fill-opacity=".92"
          stroke="#34d399" stroke-width="1.6"/>
    <text x="532" y="277" text-anchor="middle"
          class="math" font-size="20" fill="#6ee7b7">v ↓</text>
  </g>

  <!-- Accelerația gravitațională, aceeași direcție cu viteza -->
  <g id="gravity-vector">
    <line x1="322" y1="205" x2="322" y2="292"
          stroke="#fbbf24" stroke-width="5"
          stroke-linecap="round"
          marker-end="url(#arrowAmber)"/>
    <text x="298" y="254" text-anchor="middle"
          class="math" font-size="20" fill="#fde68a">g</text>
  </g>

  <!-- Înălțimea curentă scade -->
  <g id="height-indicator">
    <line x1="220" y1="244" x2="220" y2="421"
          stroke="#fbbf24" stroke-width="2.3"/>
    <line x1="210" y1="244" x2="230" y2="244"
          stroke="#fbbf24" stroke-width="2.3"/>
    <line x1="210" y1="421" x2="230" y2="421"
          stroke="#fbbf24" stroke-width="2.3"/>
    <rect x="188" y="314" width="64" height="34" rx="17"
          fill="#422006" fill-opacity=".92"
          stroke="#fbbf24"/>
    <text x="220" y="337" text-anchor="middle"
          class="math" font-size="21" fill="#fde68a">h ↓</text>
  </g>

  <!-- Eticheta stării -->
  <g id="state-label">
    <rect x="267" y="25" width="276" height="48" rx="24"
          fill="#0b1220" fill-opacity=".94"
          stroke="#34d399" stroke-width="2"/>
    <circle cx="298" cy="49" r="7" fill="#34d399"/>
    <text x="420" y="56" text-anchor="middle"
          class="label" font-size="20">CORPUL COBOARĂ</text>
  </g>

  <!-- Transformarea energiilor -->
  <g id="energy-trend">
    <rect x="515" y="302" width="210" height="112" rx="20"
          fill="#0b1220" fill-opacity=".92"
          stroke="#334155" stroke-width="1.8"/>

    <text x="539" y="330" class="muted" font-size="14">În timpul coborârii</text>

    <circle cx="543" cy="357" r="7" fill="#fbbf24"/>
    <text x="562" y="363" class="math" font-size="19"
          fill="#fde68a">Eₚ ↓</text>

    <circle cx="641" cy="357" r="7" fill="#34d399"/>
    <text x="660" y="363" class="math" font-size="19"
          fill="#6ee7b7">E꜀ ↑</text>

    <line x1="540" y1="378" x2="702" y2="378"
          stroke="#334155" stroke-width="1"/>

    <circle cx="543" cy="397" r="7" fill="#22d3ee"/>
    <text x="562" y="403" class="math" font-size="18"
          fill="#67e8f9">Eₘ = constantă</text>
  </g>
</svg>
