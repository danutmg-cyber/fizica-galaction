<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 500"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Înălțimea maximă</title>
  <desc id="desc">
    Corpul se află la înălțimea maximă a aruncării verticale.
    Viteza instantanee este zero, energia cinetică este zero,
    energia potențială gravitațională este maximă,
    iar energia mecanică rămâne constantă.
  </desc>

  <defs>
    <linearGradient id="ballGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.28" stop-color="#fde68a"/>
      <stop offset="0.68" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="heightGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity=".55"/>
    </linearGradient>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="7" stdDeviation="8"
                    flood-color="#020617" flood-opacity=".42"/>
    </filter>

    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fbbf24"/>
    </marker>

    <style>
      .label {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        font-weight: 750;
        fill: #f8fafc;
      }
      .muted {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        font-weight: 600;
        fill: #cbd5e1;
      }
      .math {
        font-family: "Cambria Math", "STIX Two Math", Georgia, serif;
        font-style: italic;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Fundal transparent; halo discret pentru tema dark -->
  <g id="scene-halo">
    <ellipse cx="400" cy="454" rx="285" ry="23" fill="#fbbf24" opacity=".10"/>
    <ellipse cx="400" cy="245" rx="215" ry="210" fill="#0f172a" opacity=".23"/>
  </g>

  <!-- Nivel de referință h = 0 -->
  <g id="reference-level">
    <line x1="90" y1="425" x2="710" y2="425"
          stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="431" x2="690" y2="431"
          stroke="#334155" stroke-width="2" stroke-dasharray="4 10"/>
    <rect x="617" y="388" width="89" height="29" rx="14.5"
          fill="#0f172a" fill-opacity=".94"
          stroke="#64748b" stroke-width="1.5"/>
    <text x="661.5" y="408.5" text-anchor="middle"
          class="math" font-size="18">h = 0</text>
  </g>

  <!-- Axa traiectoriei -->
  <g id="trajectory-axis">
    <line x1="400" y1="399" x2="400" y2="114"
          stroke="#475569" stroke-width="2"
          stroke-dasharray="7 10" stroke-linecap="round"/>
    <path d="M 400 395 C 389 330, 389 250, 400 147"
          fill="none" stroke="url(#heightGlow)" stroke-width="13"
          stroke-linecap="round" opacity=".65"/>
  </g>

  <!-- Înălțimea maximă -->
  <g id="maximum-height">
    <line x1="265" y1="116" x2="535" y2="116"
          stroke="#fbbf24" stroke-width="2.5"
          stroke-dasharray="6 8"/>

    <circle id="body" cx="400" cy="116" r="36"
            fill="url(#ballGradient)"
            stroke="#fef3c7" stroke-width="3"
            filter="url(#softGlow)"/>
    <circle cx="387" cy="103" r="10"
            fill="#ffffff" opacity=".60"/>
    <ellipse cx="400" cy="158" rx="29" ry="7"
             fill="#020617" opacity=".24"/>

    <!-- Marcaj explicit: viteza este zero, deci fără săgeată de viteză -->
    <rect x="455" y="90" width="114" height="47" rx="20"
          fill="#451a03" fill-opacity=".92"
          stroke="#fbbf24" stroke-width="1.8"/>
    <text x="512" y="120" text-anchor="middle"
          class="math" font-size="23" fill="#fde68a">v = 0</text>
  </g>

  <!-- Accelerația gravitațională rămâne orientată în jos -->
  <g id="gravity-vector">
    <line x1="337" y1="98" x2="337" y2="178"
          stroke="#fbbf24" stroke-width="5"
          stroke-linecap="round"
          marker-end="url(#arrowAmber)"/>
    <text x="311" y="146" text-anchor="middle"
          class="math" font-size="20" fill="#fde68a">g</text>
  </g>

  <!-- Indicator h max -->
  <g id="height-indicator">
    <line x1="214" y1="116" x2="214" y2="421"
          stroke="#fbbf24" stroke-width="2.4"/>
    <line x1="203" y1="116" x2="225" y2="116"
          stroke="#fbbf24" stroke-width="2.4"/>
    <line x1="203" y1="421" x2="225" y2="421"
          stroke="#fbbf24" stroke-width="2.4"/>

    <rect x="164" y="251" width="100" height="38" rx="19"
          fill="#422006" fill-opacity=".93"
          stroke="#fbbf24"/>
    <text x="214" y="276" text-anchor="middle"
          class="math" font-size="21" fill="#fde68a">h max</text>
  </g>

  <!-- Eticheta stării -->
  <g id="state-label">
    <rect x="252" y="25" width="296" height="48" rx="24"
          fill="#0b1220" fill-opacity=".94"
          stroke="#fbbf24" stroke-width="2"/>
    <circle cx="283" cy="49" r="7" fill="#fbbf24"/>
    <text x="412" y="56" text-anchor="middle"
          class="label" font-size="20">ÎNĂLȚIMEA MAXIMĂ</text>
  </g>

  <!-- Situația energiilor -->
  <g id="energy-state">
    <rect x="500" y="226" width="226" height="164" rx="21"
          fill="#0b1220" fill-opacity=".93"
          stroke="#334155" stroke-width="1.8"/>

    <text x="524" y="255" class="muted" font-size="14">În punctul cel mai înalt</text>

    <circle cx="527" cy="286" r="7" fill="#22d3ee"/>
    <text x="547" y="293" class="math" font-size="20"
          fill="#67e8f9">E꜀ = 0</text>

    <circle cx="527" cy="322" r="7" fill="#fbbf24"/>
    <text x="547" y="329" class="math" font-size="20"
          fill="#fde68a">Eₚ = Eₚ max</text>

    <line x1="524" y1="347" x2="702" y2="347"
          stroke="#334155" stroke-width="1"/>

    <circle cx="527" cy="369" r="7" fill="#34d399"/>
    <text x="547" y="376" class="math" font-size="18"
          fill="#6ee7b7">Eₘ = constantă</text>
  </g>

  <!-- Bară simbolică: toată energia este potențială -->
  <g id="energy-bars">
    <rect x="295" y="292" width="54" height="106" rx="14"
          fill="#0b1220" fill-opacity=".93"
          stroke="#475569" stroke-width="1.5"/>
    <rect x="306" y="307" width="13" height="76" rx="6.5"
          fill="#fbbf24"/>
    <rect x="326" y="377" width="13" height="6" rx="3"
          fill="#22d3ee"/>

    <text x="312.5" y="415" text-anchor="middle"
          class="math" font-size="14" fill="#fde68a">Eₚ</text>
    <text x="332.5" y="415" text-anchor="middle"
          class="math" font-size="14" fill="#67e8f9">E꜀</text>
  </g>
</svg>
