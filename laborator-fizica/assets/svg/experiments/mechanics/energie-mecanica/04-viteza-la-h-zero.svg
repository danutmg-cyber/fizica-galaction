<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 500"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Viteza la h egal cu zero</title>
  <desc id="desc">
    Corpul ajunge la nivelul de referință h egal cu zero.
    Energia potențială gravitațională este zero, energia cinetică este maximă,
    viteza are modul maxim, iar energia mecanică rămâne constantă.
  </desc>

  <defs>
    <linearGradient id="ballGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="0.25" stop-color="#6ee7b7"/>
      <stop offset="0.68" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="motionGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="1" stop-color="#34d399" stop-opacity=".75"/>
    </linearGradient>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="7" stdDeviation="8"
                    flood-color="#020617" flood-opacity=".42"/>
    </filter>

    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#34d399"/>
    </marker>

    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fbbf24"/>
    </marker>

    <style>
      .label {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        font-weight: 750;
        fill: #f8fafc;
      }
      .muted {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        font-weight: 600;
        fill: #cbd5e1;
      }
      .math {
        font-family: "Cambria Math", "STIX Two Math", Georgia, serif;
        font-style: italic;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Fundal transparent; halo discret pentru tema dark -->
  <g id="scene-halo">
    <ellipse cx="400" cy="431" rx="300" ry="28" fill="#10b981" opacity=".16"/>
    <ellipse cx="400" cy="267" rx="220" ry="200" fill="#0f172a" opacity=".23"/>
  </g>

  <!-- Reper pentru înălțimea maximă -->
  <g id="hmax-reference" opacity=".58">
    <line x1="284" y1="91" x2="516" y2="91"
          stroke="#fbbf24" stroke-width="2"
          stroke-dasharray="6 8"/>
    <circle cx="400" cy="91" r="14"
            fill="#fbbf24" fill-opacity=".07"
            stroke="#fbbf24" stroke-width="2"
            stroke-dasharray="4 5"/>
    <text x="536" y="97" class="math" font-size="18"
          fill="#fde68a">h max</text>
  </g>

  <!-- Traiectoria verticală -->
  <g id="trajectory">
    <line x1="400" y1="116" x2="400" y2="395"
          stroke="#475569" stroke-width="2"
          stroke-dasharray="7 10" stroke-linecap="round"/>
    <path d="M 424 125 C 451 190, 453 278, 415 378"
          fill="none" stroke="url(#motionGlow)" stroke-width="16"
          stroke-linecap="round" opacity=".76"/>
    <path d="M 425 153 C 448 215, 445 293, 414 357"
          fill="none" stroke="#34d399" stroke-width="5"
          stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- Nivelul de referință -->
  <g id="reference-level">
    <line x1="90" y1="400" x2="710" y2="400"
          stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="407" x2="690" y2="407"
          stroke="#334155" stroke-width="2" stroke-dasharray="4 10"/>

    <rect x="596" y="359" width="110" height="32" rx="16"
          fill="#052e16" fill-opacity=".94"
          stroke="#34d399" stroke-width="1.7"/>
    <text x="651" y="381.5" text-anchor="middle"
          class="math" font-size="20" fill="#6ee7b7">h = 0</text>
  </g>

  <!-- Corpul la h = 0 -->
  <g id="body-at-zero" filter="url(#shadow)">
    <circle id="body" cx="400" cy="376" r="37"
            fill="url(#ballGradient)"
            stroke="#d1fae5" stroke-width="3"
            filter="url(#softGlow)"/>
    <circle cx="387" cy="363" r="10"
            fill="#ffffff" opacity=".62"/>
  </g>

  <!-- Vectorul vitezei maxime -->
  <g id="velocity-vector">
    <line x1="475" y1="290" x2="475" y2="388"
          stroke="#34d399" stroke-width="7"
          stroke-linecap="round"
          marker-end="url(#arrowGreen)"/>

    <rect x="498" y="315" width="135" height="45" rx="21"
          fill="#052e16" fill-opacity=".94"
          stroke="#34d399" stroke-width="1.8"/>
    <text x="565.5" y="344" text-anchor="middle"
          class="math" font-size="22" fill="#6ee7b7">v = v max</text>
  </g>

  <!-- Accelerația gravitațională -->
  <g id="gravity-vector">
    <line x1="326" y1="292" x2="326" y2="365"
          stroke="#fbbf24" stroke-width="5"
          stroke-linecap="round"
          marker-end="url(#arrowAmber)"/>
    <text x="301" y="336" text-anchor="middle"
          class="math" font-size="20" fill="#fde68a">g</text>
  </g>

  <!-- Eticheta principală -->
  <g id="state-label">
    <rect x="245" y="25" width="310" height="48" rx="24"
          fill="#0b1220" fill-opacity=".94"
          stroke="#34d399" stroke-width="2"/>
    <circle cx="277" cy="49" r="7" fill="#34d399"/>
    <text x="415" y="56" text-anchor="middle"
          class="label" font-size="20">VITEZA LA h = 0</text>
  </g>

  <!-- Relațiile energetice -->
  <g id="energy-state">
    <rect x="515" y="125" width="216" height="154" rx="21"
          fill="#0b1220" fill-opacity=".93"
          stroke="#334155" stroke-width="1.8"/>

    <text x="539" y="154" class="muted" font-size="14">La nivelul de referință</text>

    <circle cx="542" cy="185" r="7" fill="#fbbf24"/>
    <text x="562" y="192" class="math" font-size="20"
          fill="#fde68a">Eₚ = 0</text>

    <circle cx="542" cy="221" r="7" fill="#34d399"/>
    <text x="562" y="228" class="math" font-size="20"
          fill="#6ee7b7">E꜀ = E꜀ max</text>

    <line x1="539" y1="244" x2="706" y2="244"
          stroke="#334155" stroke-width="1"/>

    <circle cx="542" cy="261" r="7" fill="#22d3ee"/>
    <text x="562" y="268" class="math" font-size="18"
          fill="#67e8f9">Eₘ = constantă</text>
  </g>

  <!-- Bare simbolice ale energiilor -->
  <g id="energy-bars">
    <rect x="165" y="167" width="66" height="136" rx="16"
          fill="#0b1220" fill-opacity=".93"
          stroke="#475569" stroke-width="1.5"/>

    <!-- Ec maximă -->
    <rect x="180" y="188" width="15" height="86" rx="7.5"
          fill="#34d399"/>

    <!-- Ep zero -->
    <rect x="202" y="268" width="15" height="6" rx="3"
          fill="#fbbf24"/>

    <text x="187.5" y="292" text-anchor="middle"
          class="math" font-size="14" fill="#6ee7b7">E꜀</text>
    <text x="209.5" y="292" text-anchor="middle"
          class="math" font-size="14" fill="#fde68a">Eₚ</text>
  </g>

  <!-- Mesaj fizic -->
  <g id="kinetic-maximum-badge">
    <rect x="125" y="323" width="185" height="47" rx="23.5"
          fill="#052e16" fill-opacity=".93"
          stroke="#34d399" stroke-width="1.7"/>
    <text x="217.5" y="353" text-anchor="middle"
          class="label" font-size="16">ENERGIE CINETICĂ MAXIMĂ</text>
  </g>
</svg>
